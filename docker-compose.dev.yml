services:
  postgres:
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cleat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: cleat
      MYSQL_DATABASE: cleat
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # `-h 127.0.0.1`, NOT `-h localhost`. In the MySQL client `localhost` is a
      # magic string meaning "use the unix socket"; `127.0.0.1` forces TCP. Every
      # consumer of this service connects over TCP, so a socket ping reports on an
      # interface nothing here uses.
      #
      # THE DISCRIMINATOR IS THE CLIENT, NOT THE STRING -- do not "fix" the mssql
      # service below on the strength of this line. That service's healthcheck
      # says `-S localhost` and is CORRECT: `sqlcmd` has no socket special case,
      # so `localhost` there is a hostname resolved to loopback. (Read the file
      # rather than trusting this sentence -- it was written wrong once already,
      # asserting that service had no healthcheck at all when it has one.)
      #
      # HONEST LIMIT, and it is why this changed without a prior issue: the
      # socket/TCP window was NOT observed here. It does not reproduce without
      # load -- a cold-start poll on an idle machine had both forms answering at
      # the same instant -- so there is no measurement showing this host fails
      # without the change, and this comment does not claim one.
      #
      # AND NOTHING IN CI EXERCISES THIS FILE, which is worth knowing before
      # expecting a run to confirm or refute the change. No workflow and no
      # script invokes it; the single occurrence of its name under .github/ is a
      # comment listing files to `grep` for a pinned mssql digest
      # (tier1-gate.yml). It is a developer convenience stack. So a green CI run
      # says nothing about this line either way.
      #
      # What justifies it is the reason the sibling example's arm was worth
      # fixing: a healthcheck must assert the interface its consumers use whether
      # or not the window is ever demonstrated. There, on a loaded CI runner, it
      # turned out to be real -- measured by reverting only that line, which is
      # examples/order-lifecycle's compose and cleat#2565. Same line, same shape.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pcleat"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  mssql:
    # Pinned by digest 2026-08-07; `2022-latest` is a moving tag and this is
    # a required check. Full rationale, the re-derive commands, and why the
    # `ancestor=` filter had to move with it: tier1-gate.yml's mssql
    # service. Bump all six sites together or `Lint` fails the PR.
    image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CleatTest123!"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CleatTest123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    # quay.io/minio/minio stopped serving anonymous pulls on 2026-09-24
    # (cleat#2211). Chainguard's build is served anonymously. It has no curl,
    # so there is no container healthcheck; poll
    # http://localhost:9000/minio/health/live from the host instead.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  mysqldata:
  mssqldata:
  minio_data:
