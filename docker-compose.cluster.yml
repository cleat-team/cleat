version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cleat-postgres
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - cleat-cluster
    ports:
      - "5432:5432"
    restart: unless-stopped

  worker-1:
    image: cleat-worker:latest
    container_name: cleat-worker-1
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-1"
      - "--concurrency=10"
      - "--namespace=default"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-2:
    image: cleat-worker:latest
    container_name: cleat-worker-2
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-2"
      - "--concurrency=10"
      - "--namespace=default"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-3:
    image: cleat-worker:latest
    container_name: cleat-worker-3
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-3"
      - "--concurrency=10"
      - "--namespace=default"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  dashboard:
    image: cleat-worker:latest
    container_name: cleat-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=dashboard"
      - "--concurrency=2"
      - "--namespace=default"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

networks:
  cleat-cluster:
    name: cleat-cluster
    driver: bridge

volumes:
  pgdata:
    driver: local
