version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cleat-postgres
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
      # Password for the unprivileged role the workers connect as. The
      # superuser above owns the schema and runs migrations; it must not be
      # what serves traffic, because PostgreSQL never applies row-level
      # security to a superuser and RLS is the only tenant isolation
      # GetWorkflowByID and ListWorkflows have.
      CLEAT_APP_PASSWORD: ${CLEAT_APP_PASSWORD:-cleat-app-local-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The migrations, read-only and somewhere neutral. They are not mounted
      # as initdb.d itself: that made the directory serve two masters (the
      # migration set the Go runner reads, and the literal contents of
      # initdb.d) so nothing else could be placed there, and mounting a second
      # file over the top fails at container init -- a bind mount inside a
      # read-only bind mount cannot create its mountpoint.
      #
      # This used to mount a root schema.sql that was a second, hand-kept copy.
      # It had drifted into a strict subset: no finalize_workflow_status (so
      # every workflow completion failed -- engine/store_lifecycle.go calls it
      # with no fallback), no RLS policies at all, and no admin.tenants. Tests
      # only ever read migrations/postgres/, so nothing caught it.
      - ./migrations/postgres:/opt/cleat/migrations:ro
      # initdb.d: 100-apply-migrations.sh applies the files above in order,
      # then 900-app-role.sh gives cleat_app a password.
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - cleat-cluster
    ports:
      - "5432:5432"
    restart: unless-stopped

  worker-1:
    image: cleat-worker:latest
    container_name: cleat-worker-1
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable"
      - "--migrate-db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-1"
      - "--concurrency=10"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-2:
    image: cleat-worker:latest
    container_name: cleat-worker-2
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable"
      - "--migrate-db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-2"
      - "--concurrency=10"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-3:
    image: cleat-worker:latest
    container_name: cleat-worker-3
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable"
      - "--migrate-db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-3"
      - "--concurrency=10"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  dashboard:
    image: cleat-worker:latest
    container_name: cleat-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable"
      - "--migrate-db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=dashboard"
      - "--concurrency=2"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: cleat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: cleat
      MYSQL_DATABASE: cleat
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - cleat-cluster
    ports:
      - "3306:3306"
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cleat-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CleatTest123!"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CleatTest123!", "-Q", "SELECT 1", "-C"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - cleat-cluster
    ports:
      - "1433:1433"
    restart: unless-stopped

networks:
  cleat-cluster:
    name: cleat-cluster
    driver: bridge

volumes:
  pgdata:
    driver: local
  mysqldata:
    driver: local
  mssqldata:
    driver: local
