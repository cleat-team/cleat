version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cleat-postgres
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount the migrations directory, not a hand-maintained copy of it.
      # docker-entrypoint-initdb.d executes *.sql in lexical order, which is
      # exactly 001_schema -> 002_defaults -> 003_procedures -> 004_fix_*.
      #
      # This used to mount a root schema.sql that was a second, hand-kept
      # copy. It had drifted into a strict subset: no finalize_workflow_status
      # (so FinalizeWorkflowSegment failed on every workflow completion --
      # engine/store_lifecycle.go calls it with no fallback), no RLS policies
      # at all, and no admin.tenants/admin.tenant_api_keys (so the Admin API
      # could not work either). Tests only ever read migrations/postgres/,
      # so nothing caught it.
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - cleat-cluster
    ports:
      - "5432:5432"
    restart: unless-stopped

  worker-1:
    image: cleat-worker:latest
    container_name: cleat-worker-1
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-1"
      - "--concurrency=10"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-2:
    image: cleat-worker:latest
    container_name: cleat-worker-2
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-2"
      - "--concurrency=10"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  worker-3:
    image: cleat-worker:latest
    container_name: cleat-worker-3
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=queue-3"
      - "--concurrency=10"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  dashboard:
    image: cleat-worker:latest
    container_name: cleat-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--task-queue=dashboard"
      - "--concurrency=2"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - cleat-cluster
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: cleat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: cleat
      MYSQL_DATABASE: cleat
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - cleat-cluster
    ports:
      - "3306:3306"
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cleat-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CleatTest123!"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CleatTest123!", "-Q", "SELECT 1", "-C"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - cleat-cluster
    ports:
      - "1433:1433"
    restart: unless-stopped

networks:
  cleat-cluster:
    name: cleat-cluster
    driver: bridge

volumes:
  pgdata:
    driver: local
  mysqldata:
    driver: local
  mssqldata:
    driver: local
