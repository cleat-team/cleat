run:
  go: "1.25"
linters:
  enable:
    # Not on by golangci-lint's default set, so listing it under `disable`
    # below never did anything -- it had to be enabled to run at all.
    - misspell
    # Enabled 2026-08-05 (WS-3). Was 4 findings, not the 8 recorded below.
    - ineffassign
  disable:
    - errcheck
    - gosimple
    - staticcheck
    - unused
    - unconvert
    - gocyclo
    - gosec
  # The disables above are a backlog, not a policy. This note used to read
  # "errcheck and other noisy linters are temporarily disabled. The engine
  # refactoring introduced hundreds of pre-existing issues." That was true when
  # it was written, and by then unfalsifiable: nobody could tell which linters
  # were still hundreds and which had quietly become tractable.
  #
  # Measured 2026-08-04 against this file's own exclusions (non-test files),
  # with golangci-lint's default caps removed -- max-issues-per-linter and
  # max-same-issues both default to non-zero and silently truncate, so errcheck
  # reads as 50 with them on and 307 with them off:
  #
  #     misspell        0    <- enabled by this change
  #     ineffassign     8
  #     gosimple        9
  #     unused         16
  #     staticcheck    17
  #     unconvert      23
  #     gocyclo        28
  #     gosec         193
  #     errcheck      307
  #
  # misspell is off the list because it was never "hundreds": it is zero, and
  # leaving it disabled meant the next typo in a comment or an error string had
  # nothing stopping it.
  #
  # Re-measure before believing these numbers. Recording them is the point --
  # the next person can take the cheapest one off the top instead of inheriting
  # a claim they have no way to check.
  #
  # ineffassign, 2026-08-05 (WS-3): and re-measuring was the right advice. It
  # was **4**, not 8, on golangci-lint v1.64.7 against this file's exclusions.
  # The table above is a measurement with a date on it, not a running total, so
  # the other rows should be assumed equally stale until someone re-runs them.
  #
  # Three of the four were the defensive trailing `argIdx++` the workstream
  # notes warned about, in scheduledbackup/{commands,routes}.go and
  # webhookingest/host_functions.go. They are //nolint'd with the reason rather
  # than deleted: each keeps a SQL placeholder counter correct so the next
  # clause added below cannot silently reuse the previous one's $N. Deleting
  # them passes the linter and plants a bug.
  #
  # The fourth was real, in internal/closure/threading.go: a map initialised
  # outside an `if` and unconditionally overwritten as the first statement
  # inside it, with no reader in the nil branch. Moved into the branch.
issues:
  exclude-files:
    - ".*_test\\.go$"
