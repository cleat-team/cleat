version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/cleat-team/cleat-worker:latest
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      # Single-node development: this worker applies the schema itself at start.
      # A worker no longer migrates unless told to (cleat#2117) -- for a fleet, run
      # `cleat-worker --migrate-only` as a deploy step and drop this flag.
      - "--migrate-on-start"
      - "--plugin-config=/etc/cleat/plugins.json"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./plugin-config.json:/etc/cleat/plugins.json:ro

volumes:
  pgdata:
