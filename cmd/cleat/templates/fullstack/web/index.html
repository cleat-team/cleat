<!doctype html>
<meta charset="utf-8">
<title>cleat full-stack scaffold</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: .4rem .6rem; }
  #status { margin-top: 1rem; padding: .6rem .8rem; background: #f4f4f5; border-radius: 4px; }
  code { background: #f4f4f5; padding: .1rem .3rem; border-radius: 3px; }
</style>

<h1>Submit an order</h1>

<!--
  DELIBERATELY NO FRAMEWORK AND NO BUILD STEP.

  The cleat playbooks say your front-end framework "stays rope" -- unchanged,
  unowned, not reimplemented. A scaffold that picked React or Svelte would
  contradict that and impose a toolchain on a Go project. What this file
  demonstrates is the API CONTRACT: start a run, then poll published state.
  Replace it wholesale with whatever you actually build.

  In production, serve your bundle from a CDN and point it at the worker.
  cleat is the origin and the API, not your bundler.
-->

<p>
  <input id="item" value="widget" aria-label="item">
  <button id="go">Submit</button>
</p>

<div id="status">idle</div>

<script>
  // Replace with however your app authenticates. A tenant API key must NEVER
  // reach a browser -- it identifies the whole tenant. Use a per-user session
  // (the oauth-provider plugin issues one) and have your own endpoint call
  // cleat server-side.
  const API = "http://localhost:8080";
  const statusEl = document.getElementById("status");

  document.getElementById("go").onclick = async () => {
    statusEl.textContent = "starting...";
    const res = await fetch(`${API}/api/workflows/my-fullstack-app`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        // A retry of this exact request returns the original run rather than
        // creating a second one. The response says which happened.
        "Idempotency-Key": crypto.randomUUID(),
      },
      body: JSON.stringify({ item: document.getElementById("item").value, qty: 1 }),
    });
    if (!res.ok) { statusEl.textContent = `start failed: ${res.status}`; return; }
    const { id } = await res.json();
    poll(id);
  };

  // The browser polls published state rather than waiting on the run. See
  // README.md, "Why the browser does not wait".
  async function poll(id) {
    for (let i = 0; i < 60; i++) {
      const r = await fetch(`${API}/api/workflows/${id}/state?key=status`);
      if (r.ok) {
        const { value } = await r.json();
        statusEl.textContent = `${id}: ${value || "(no state yet)"}`;
        if (value === "complete" || value === "rejected") return;
      }
      await new Promise(s => setTimeout(s, 500));
    }
    statusEl.textContent = `${id}: gave up polling`;
  }
</script>
