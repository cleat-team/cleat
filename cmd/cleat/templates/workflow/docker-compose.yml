version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10

  cleat-worker:
    image: ghcr.io/cleat-team/cleat-worker:latest
    command:
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--concurrency=10"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
