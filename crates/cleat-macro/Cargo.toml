[package]
name = "cleat-macro"
version = "0.1.0"
edition = "2021"
description = "Proc-macro for cleat durable execution — #[cleat_entry] attribute"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
cleat-sdk = { path = "../cleat-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
