buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.teavm:teavm-gradle-plugin:0.10.2'
    }
}

apply plugin: "java"
apply plugin: "org.teavm"
apply plugin: "maven-publish"
apply plugin: "signing"

group = "com.cleat"
version = "0.1.0"

repositories {
    mavenCentral()
}

dependencies {
    // TeaVM runtime
    implementation "org.teavm:teavm-classlib:0.10.2"
    implementation "org.teavm:teavm-jso-apis:0.10.2"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withJavadocJar()
    withSourcesJar()
}

teavm {
    // WorkflowEntry is the static analysis root for TeaVM.
    // It is auto-generated by CleatEntryProcessor and references
    // CleatEntryIndex to prevent tree-shaking of @CleatEntry exports.
    mainClass = "cleat.WorkflowEntry"
    fileName = "workflow.wasm"
    outputDir = file("build/wasm")
    targetType = "WASM"
    optimizationLevel = "FULL"
    obfuscated = false   // Debug-friendly; switch to ADVANCED for production
}

tasks.named("test") {
    useJUnitPlatform()
}

// =========================================================================
// Maven Central publishing configuration
// =========================================================================

// Publish guard: disabled by default to prevent accidental publication
ext.cleatPublish = false

tasks.named("publish") {
    doFirst {
        if (!cleatPublish && !project.hasProperty("cleatPublish")) {
            throw new GradleException("Publishing is disabled by default. Enable with -PcleatPublish=true or define cleatPublish=true in gradle.properties.")
        }
    }
}

publishing {
    publications {
        cleatJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = "cleat-sdk"
            version = project.version

            pom {
                name = "Cleat Java SDK"
                description = "Java SDK for building cleat durable workflow applications"
                url = "https://github.com/cleat/cleat"

                licenses {
                    license {
                        name = "Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                developers {
                    developer {
                        name = "Cleat Contributors"
                        email = "contributors@cleat.dev"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/cleat/cleat.git"
                    developerConnection = "scm:git:ssh://github.com/cleat/cleat.git"
                    url = "https://github.com/cleat/cleat"
                }
            }
        }
    }

    repositories {
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
            credentials {
                username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME") ?: ""
                password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD") ?: ""
            }
        }
    }
}

signing {
    setRequired {
        gradle.taskGraph.hasTask(":publishCleatJavaPublicationToSonatypeRepository")
    }

    def signingKey = findProperty("signingKey") ?: System.getenv("SIGNING_KEY") ?: ""
    def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD") ?: ""

    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.cleatJava
    }
}

// =========================================================================
// TeaVM version compatibility
// =========================================================================
// TeaVM 0.10.2 (February 2025) is the current stable release targeting
// the WASM backend. Tested and compatible version range:
//
//   - 0.10.0 — initial WASM backend support, verified with cleat SDK
//   - 0.10.1 — bugfix release, verified
//   - 0.10.2 — current; includes WASM GC support and improved
//              dead-code elimination (verified May 2025)
//
// Upgrading to 0.11.x (expected late 2025) may require adjustments to
// the annotation processor pipeline, particularly around @Export
// generation and the WASM target type enum.
//
// To upgrade, change the version in these locations:
//   1. buildscript > dependencies > classpath (teavm-gradle-plugin)
//   2. dependencies > implementation (teavm-classlib, teavm-jso-apis)
//   3. The `teavm` block configuration if the plugin API changes
//
// Always verify with `./gradlew classes` and a smoke-test WASM build
// after upgrading the TeaVM version.
// =========================================================================
