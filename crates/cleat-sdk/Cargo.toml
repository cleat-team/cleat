[package]
name = "cleat-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for cleat durable execution framework — WASM host call bindings"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "host_calls_bench"
harness = false

[lib]
crate-type = ["lib"]
