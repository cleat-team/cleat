[package]
name = "cleat-test"
version = "0.1.0"
edition = "2021"
description = "Test environment for cleat workflows — mock HostCalls for deterministic native testing"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cleat-macro = { path = "../cleat-macro" }
# For signal_envelope: the request/reply wire format has ONE definition,
# shared with the SDK, so this harness cannot drift from what a workflow
# actually sends. IMPROVEMENT-PLAN 3.220.
cleat-sdk = { path = "../cleat-sdk" }
