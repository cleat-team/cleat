# -- Number of worker replicas to run. Used ONLY when autoscaling.enabled is false.
# With autoscaling on (the default) the HorizontalPodAutoscaler owns the replica count and the chart does not
# render it (cleat#3761): a new Deployment starts at 1 and the autoscaler raises it to autoscaling.minReplicas,
# so set minReplicas to the floor you want, not replicaCount.
replicaCount: 3

# -- Image configuration for the cleat-worker container.
image:
  repository: ghcr.io/cleat-team/cleat-worker
  tag: latest
  pullPolicy: IfNotPresent

# -- Worker runtime configuration.
# These map to CLI flags on the cleat-worker binary.
worker:
  # -- Max concurrent workflow executions (--concurrency).
  concurrency: 10
  # -- Task queue to claim work from (--task-queue). Comma-separated for several.
  taskQueues: "default"
  # Note: there is deliberately no tenantId here. cleat-worker has no
  # --tenant-id flag (it never had one), so the value this chart used to pass
  # made every pod exit 2 at flag parsing. Tenancy is resolved per request via
  # --tenant-resolver, which defaults to single-tenant; this chart does not
  # expose it yet.
  # -- Heartbeat interval for claimed workflow instances (--heartbeat).
  # This also derives the reclaim window below when that is "0".
  heartbeatInterval: "5s"
  # -- How long a run may go without a heartbeat before another worker claims it
  # (--reclaim-timeout). "0" derives it as max(2 x heartbeatInterval, 10s),
  # which is the historical behaviour and changes nothing.
  #
  # Raise it on a managed database that fails over: the heartbeat is written to
  # the same database, so a failover silences every worker at once and makes
  # every run reclaimable ten seconds in. Setting this instead of raising
  # heartbeatInterval keeps crash recovery fast. Refused below 2 x the heartbeat.
  reclaimTimeout: "0"
  # -- How long a failed event flush keeps retrying before the step is reported
  # as unpersisted (--flush-retry-window). "0" means 750ms, which is the sleep
  # budget the batch flush path has always had.
  #
  # Raise it to ride out a database failover, and raise reclaimTimeout with it:
  # an outage that long also stops the heartbeat, so a retry that succeeds after
  # the database returns finds its run already reclaimed. The worker logs a
  # warning at startup when this exceeds the reclaim window.
  flushRetryWindow: "0"
  # -- Poll interval when no work is available (--poll).
  pollInterval: "500ms"
  # -- Seconds the preStop hook sleeps when adminApi.enabled is false, so the pod leaves Service endpoints
  # before SIGTERM. It comes out of terminationGracePeriodSeconds below, ahead of the drain.
  preStopSleepSeconds: 5
  # -- How long a worker that receives SIGTERM lets its in-flight runs finish before it cancels them
  # (--shutdown-grace). A run still going when it ends is released for another worker to replay from
  # its durable history, and a durable call that was mid-flight is EXECUTED AGAIN there (at-least-once).
  # If your calls run longer than this, raise it, and terminationGracePeriodSeconds with it.
  shutdownGrace: "20s"
  # -- The pod's terminationGracePeriodSeconds. Must exceed preStopSleepSeconds + shutdownGrace + the
  # worker's plugin Stop budget (5s, cleat#2147) with room to spare: the kubelet SIGKILLs the pod when
  # it runs out, drain or no drain. A template test enforces it.
  #
  # The plugin term is new and easy to miss when raising the grace: the worker calls
  # plugin.Stoppable.Stop after the drain, so that budget comes out of this same clock.
  terminationGracePeriodSeconds: 60

# -- PostgreSQL connection parameters.
# Either provide a password here (for the chart to create a Secret), or
# supply an existing Secret containing a "database-url" key.
postgres:
  host: ""
  port: 5432
  database: cleat
  username: cleat
  password: ""
  # -- Name of an existing Secret with a "database-url" key.
  # When set, the chart will not create its own Secret.
  existingSecret: ""
  sslmode: disable

# -- Schema migration, run as a pre-install/pre-upgrade hook Job (cleat#2117).
#
# A worker no longer migrates the database when it starts: it VERIFIES the schema and
# refuses to start, with the remediation in its message, if a migration is not applied.
# So a release migrates BEFORE its pods start, and this Job (cleat-worker --migrate-only)
# is that step. Turn it off only if you run `cleat-worker --migrate-only` yourself as a
# deploy step -- with it off and no other migration step, new pods will not start.
migration:
  # -- Run the migration Job on install and upgrade.
  enabled: true
  # -- A DDL-capable role for the Job, if the runtime role (postgres.username) is
  # unprivileged, as it should be. Defaults to postgres.username / postgres.password.
  username: ""
  password: ""
  # -- Name of an existing Secret holding the migration DSN (key: existingSecretKey).
  # Preferred: the DDL credentials then never pass through chart values. When unset
  # and postgres.existingSecret is set, that Secret is reused; otherwise the chart
  # creates a short-lived hook Secret from username/password above.
  existingSecret: ""
  existingSecretKey: "database-url"
  # -- The Job is not retried: a failed migration needs a person, and a retry of a
  # half-applied one is exactly what the lock and per-migration transactions are for.
  backoffLimit: 0
  # -- Seconds before the Job is failed. A first migration onto a large table can be slow.
  activeDeadlineSeconds: 900

# -- Stop-first guard for the 0.5.0 to 0.6.0 upgrade (cleat#3758). TEMPORARY: removed after 0.6.0 (cleat#3759).
#
# An upgrade from 0.5.x is stop-first (D79): the migration hook runs BEFORE any pod is replaced, so a plain
# `helm upgrade` migrates the schema under running 0.5.x workers. The chart refuses that, before the hook,
# when the live worker Deployment runs an identifiably 0.5.x image (a 0.5, 0.5.N or v0.5.N tag) with replicas
# above 0 and the image being deployed is not 0.5.x. It does NOT fire for the tag `latest` or a digest-only
# image (they carry no version), for pods still terminating after a scale to 0, or under `helm template`,
# `--dry-run` and GitOps renderers (no cluster to look up). See docs/operations/upgrading.md.
upgrade:
  # -- Skip the guard and run the unsupported rolling upgrade anyway. Only `true` skips it; any other value,
  # including the string "false" from a quoted values file or --set-string, leaves the guard on.
  allowLiveWorkers: false

# -- HTTP API server configuration.
api:
  # -- Port for the HTTP API, health checks, and metrics endpoint.
  port: 8080

# -- The admin API (cleat#2267). OFF by default.
#
# Every /api/admin/* route (drain, retention sweep, force-complete, force-fail, re-replay, step resolve)
# answers 404 unless the worker runs with --enable-admin-api, which is what enabled: true passes.
#
# WHILE IT IS ON, ANY AUTHENTICATED API KEY OF ANY TENANT CAN DRAIN A WORKER AND TRIGGER A RETENTION
# SWEEP over every tenant's data, because cleat has no operator credential yet (cleat#2169). Turn it on
# only where every key you have issued is trusted to that degree. docs/operations/admin-api.md has the
# list of which routes are worker-level and which are tenant-scoped.
#
# What the preStop hook does depends on it:
#   enabled: true (and auth.adminApiKey or auth.existingSecret set)
#       the hook POSTs /api/admin/drain.
#   enabled: false (the default)
#       the hook only sleeps (worker.preStopSleepSeconds), so the pod leaves Service endpoints before SIGTERM.
# NEITHER lets a run in flight finish: the kubelet sends SIGTERM as soon as the hook returns, the drain hook
# returns when the POST is answered rather than when the drain is complete, and a run in flight at SIGTERM is
# currently failed rather than reclaimed by another worker (cleat#2285). See docs/operations/admin-api.md.
adminApi:
  enabled: false

# -- Auth configuration for the worker's HTTP API.
#
# cleat-worker's supported configuration defaults to --require-auth=true
# (tiers.yaml does not grant support for --require-auth=false), which
# rejects every request without a valid API key except the infrastructure paths (/healthz, /livez, /readyz,
# /metrics). That includes the preStop drain hook this chart runs on every
# pod shutdown (templates/deployment.yaml) -- POST /api/admin/drain. Without
# a key configured here, that hook 401s, the failure is swallowed by the
# hook's own `|| true` (needed so a slow/unreachable API server does not
# block pod termination), and pods terminate without ever draining in-flight
# work.
#
# Generate a key against your database once, out of band -- there is no way
# for the chart to provision one for you, since cleat-worker only mints a
# specific key value when told to write it to a real tenant_api_keys row:
#   cleat-worker --db "$DATABASE_URL" --generate-api-key "00000000-0000-0000-0000-000000000000"
# Then either paste the result into adminApiKey below (the chart creates a
# Secret for it) or store it in your own Secret and set existingSecret +
# existingSecretKey instead.
auth:
  # -- An API key for the preStop drain hook. Used only when adminApi.enabled is true; see below.
  # Ignored if existingSecret is set.
  adminApiKey: ""
  # -- Name of an existing Secret containing the admin API key. When set,
  # the chart will not create its own auth Secret.
  existingSecret: ""
  # -- Key within existingSecret holding the admin API key.
  existingSecretKey: "admin-api-key"

# -- Container resource requests and limits. The defaults are chosen to WORK, not to be optimal:
# a worker that is killed or starved by its own limit is a worse default than a pod that asks for
# more than a small workload needs. Override `resources` to shrink them for a workload you have
# measured, and SET BOTH `requests` and `limits` for each of cpu and memory: Helm merges your values
# over these maps, so setting only a limit below the default request (or only a request above the
# default limit) leaves a request above its limit, which Kubernetes rejects. The chart refuses that at
# render time with a message that says what to set (templates/_resources-guard.tpl).
#
# WHAT A WORKER ACTUALLY USES (arm64 Linux, 2026-11-22/23; cleat#4377 and cleat#4389 have the data):
#   - an idle worker with no workflows: about 35 MiB resident.
#   - after one guest has compiled and run, the process baseline is about 207 MiB for Go,
#     112 MiB for C# and 565 MiB for Python (medians of 21 runs each). The first Python
#     component a worker compiles peaks about 475 to 525 MiB ABOVE that baseline for a second
#     or two, once per distinct component per worker. Measured under a cgroup limit, that compile
#     was OOM-killed at 512m (the old default) for both Python builds, and completed at 768m, 1g
#     and 2g; a C# compile was killed at 128m and completed at 512m. So with the old 512Mi limit a
#     Python workflow could not run at all.
#   - each HELD run (residency, on by default) adds on top: Go about 1.5 MiB, Python 1.3 MiB once
#     cleat#4382 is in (12 MiB before), C# 17 MiB once cleat#4378 is in (49 before), plus whatever
#     the guest itself allocates. The compiled-component cache holds about 100 MiB per distinct
#     Python component and about 10 to 17 MiB per C# one.
# RESIDENCY'S BUDGET IS A SHARE OF THE LIMIT: unless --resident-memory-budget-mb is set it is
# 8 held runs x the dearest per-run charge (66 MiB for C#), 528 MiB, which was MORE than the old
# 512Mi limit and is a quarter of 2Gi. And the worker stops claiming new work when its memory
# reaches --memory-soft-limit (0.80) of the container limit, read from the cgroup: 1.6 GiB at 2Gi.
#
# CPU: a Python compile took 11.4 s at a 0.5 CPU limit (twice) against 1.2 to 2.4 s
# unconstrained on a 10-CPU machine, and 4.3 to 7.6 s at 2 CPUs (the machine was shared, so the
# 1 and 2 CPU rows are noisy; the 0.5 CPU row is not). The old 500m limit throttled every compile
# for about ten seconds. The CPU REQUEST is what the autoscaler measures utilization against (see
# autoscaling), so it is sized for a worker doing real work, not for an idle one.
# The migration Job (templates/migrate-job.yaml) uses the same values.
#
# THE MEMORY REQUEST EQUALS THE LIMIT (2Gi), by the owner's decision (2026-11-23): a worker RESERVES its
# memory. The scheduler sets 2Gi aside for it, it cannot be over-committed away, and because it can never use
# more than it requested, node-pressure eviction ranks it behind every pod that does. (The pod's QoS class is
# still Burstable, not Guaranteed, because the CPU request is below the CPU limit; that is on purpose, see
# the CPU note above. From the Kubernetes documentation, not tested on a cluster.) The price is
# scheduling: the default 2 replicas need 4 GiB of allocatable memory free, and the pre-upgrade migration
# Job asks for another 2 GiB while the old pods are still running. Lower BOTH requests.memory and
# limits.memory together for a smaller cluster.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 2Gi

# -- HorizontalPodAutoscaler configuration.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  # -- Scale on CPU utilization, as a percentage of resources.requests.cpu.
  targetCPU: 70
  # -- Memory utilization target (percent of resources.requests.memory). UNSET BY DEFAULT, and the
  # HPA renders no memory metric unless you set it. A worker's memory is dominated by things that
  # grow by design and do not follow load: the compiled-component cache, the held runs, the
  # allocator's retention. The metric is also a percentage of the REQUEST, and per-pod usage does
  # not fall when replicas are added, so a target below what one warmed worker uses pins the HPA at
  # maxReplicas: with the old 128Mi request the 80% target was 102 MiB, and a warmed Go worker
  # baseline is about 207 MiB, which is 162% of the request, so the HPA computes
  # ceil(2 x 162/80) = 5 replicas, and then, since each pod still uses 207 MiB, 10.
  # (From the HPA's documented formula and measured baselines, not from a cluster run.)
  # targetMemory: 80

# -- Prometheus monitoring configuration.
monitoring:
  # -- ServiceMonitor for Prometheus Operator auto-discovery.
  serviceMonitor:
    enabled: true

# -- Kubernetes Service configuration.
service:
  type: ClusterIP

# -- ServiceAccount configuration.
serviceAccount:
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Security context for the pod (applied to all containers).
# https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Security context for the container (overrides pod-level).
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for scheduling.
nodeSelector: {}

# -- Pod tolerations.
tolerations: []

# -- Pod affinity rules. Left to you: the chart sets none, and what keeps the workers on different nodes is
# topologySpread below, not this. If you set podAntiAffinity here as well, a cluster with fewer nodes than
# replicas will leave the extra pods Pending when the rule is "required", which topologySpread does not do.
affinity: {}

# -- Spread the worker pods across nodes, so two workers do not share one machine (cleat#4439). The owner's
# requirement is that the two workers the autoscaler keeps as a floor are on separate hardware.
#
# THE DEFAULT SPREADS BUT DOES NOT REFUSE. `whenUnsatisfiable: ScheduleAnyway` makes this a preference the
# scheduler weighs heavily, not a rule: on a one-node cluster, or when the other node is full, cordoned or
# tainted, the pods still start, together. That is deliberate, so the chart installs and runs everywhere. If
# you would rather have a Pending pod than two workers on one node, set whenUnsatisfiable to DoNotSchedule.
# Measured on kind (2026-11-23), two workers and one of two nodes cordoned: DoNotSchedule leaves the second
# worker Pending, and ScheduleAnyway starts it on the same node as the first. On a one-node cluster both
# values start both workers (a single node is a single topology domain). On two healthy nodes the
# scheduler's own spreading separates them with or without this; see docs/operations/zero-downtime-deploy.md.
#
# It is topology spread rather than pod anti-affinity so the autoscaler can still go past the node count:
# with maxSkew 1, three workers on two nodes (2 + 1) is allowed, where required anti-affinity would leave the
# third Pending.
topologySpread:
  # -- Render the constraint. false renders none and leaves placement to the scheduler's own spreading.
  enabled: true
  # -- The largest allowed difference in pod count between any two nodes.
  maxSkew: 1
  # -- The node label that defines "separate hardware". kubernetes.io/hostname is one domain per node.
  topologyKey: kubernetes.io/hostname
  # -- ScheduleAnyway (prefer, never refuse; the default) or DoNotSchedule (refuse: a pod that cannot be
  # placed within maxSkew stays Pending). Anything else is rejected by the API server when applied.
  whenUnsatisfiable: ScheduleAnyway
  # -- Also spread across zones, by this node label (for example topology.kubernetes.io/zone). Empty adds no
  # second constraint. Uses the same maxSkew, with its own whenUnsatisfiable below.
  zoneKey: ""
  # -- whenUnsatisfiable for the zone constraint. Defaults to a preference: a cluster with one zone, or
  # nodes that carry no zone label, still schedules.
  zoneWhenUnsatisfiable: ScheduleAnyway

# -- A PodDisruptionBudget for the workers (cleat#4439), so a node drain evicts one worker at a time and
# cannot take both of the autoscaler's floor of two. With one replica it allows the drain, because
# maxUnavailable 1 of 1 is not a block.
podDisruptionBudget:
  # -- Render the budget. false renders none, and a drain may evict every worker at once.
  enabled: true
  # -- How many workers a voluntary disruption (a drain, an upgrade of the node pool) may take down at once.
  # An integer, or a percentage string such as "25%".
  maxUnavailable: 1
