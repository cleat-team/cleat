# -- Number of worker replicas to run.
replicaCount: 3

# -- Image configuration for the cleat-worker container.
image:
  repository: ghcr.io/cleat-team/cleat-worker
  tag: latest
  pullPolicy: IfNotPresent

# -- Worker runtime configuration.
# These map to CLI flags on the cleat-worker binary.
worker:
  # -- Max concurrent workflow executions (--concurrency).
  concurrency: 10
  # -- Task queue to claim work from (--task-queue). Comma-separated for several.
  taskQueues: "default"
  # Note: there is deliberately no tenantId here. cleat-worker has no
  # --tenant-id flag (it never had one), so the value this chart used to pass
  # made every pod exit 2 at flag parsing. Tenancy is resolved per request via
  # --tenant-resolver, which defaults to single-tenant; this chart does not
  # expose it yet.
  # -- Heartbeat interval for claimed workflow instances (--heartbeat).
  # This also derives the reclaim window below when that is "0".
  heartbeatInterval: "5s"
  # -- How long a run may go without a heartbeat before another worker claims it
  # (--reclaim-timeout). "0" derives it as max(2 x heartbeatInterval, 10s),
  # which is the historical behaviour and changes nothing.
  #
  # Raise it on a managed database that fails over: the heartbeat is written to
  # the same database, so a failover silences every worker at once and makes
  # every run reclaimable ten seconds in. Setting this instead of raising
  # heartbeatInterval keeps crash recovery fast. Refused below 2 x the heartbeat.
  reclaimTimeout: "0"
  # -- How long a failed event flush keeps retrying before the step is reported
  # as unpersisted (--flush-retry-window). "0" means 750ms, which is the sleep
  # budget the batch flush path has always had.
  #
  # Raise it to ride out a database failover, and raise reclaimTimeout with it:
  # an outage that long also stops the heartbeat, so a retry that succeeds after
  # the database returns finds its run already reclaimed. The worker logs a
  # warning at startup when this exceeds the reclaim window.
  flushRetryWindow: "0"
  # -- Poll interval when no work is available (--poll).
  pollInterval: "500ms"
  # -- Seconds the preStop hook sleeps when adminApi.enabled is false, so the pod leaves Service endpoints
  # before SIGTERM. It comes out of terminationGracePeriodSeconds below, ahead of the drain.
  preStopSleepSeconds: 5
  # -- How long a worker that receives SIGTERM lets its in-flight runs finish before it cancels them
  # (--shutdown-grace). A run still going when it ends is released for another worker to replay from
  # its durable history, and a durable call that was mid-flight is EXECUTED AGAIN there (at-least-once).
  # If your calls run longer than this, raise it, and terminationGracePeriodSeconds with it.
  shutdownGrace: "20s"
  # -- The pod's terminationGracePeriodSeconds. Must exceed preStopSleepSeconds + shutdownGrace + the
  # worker's plugin Stop budget (5s, cleat#2147) with room to spare: the kubelet SIGKILLs the pod when
  # it runs out, drain or no drain. A template test enforces it.
  #
  # The plugin term is new and easy to miss when raising the grace: the worker calls
  # plugin.Stoppable.Stop after the drain, so that budget comes out of this same clock.
  terminationGracePeriodSeconds: 60

# -- PostgreSQL connection parameters.
# Either provide a password here (for the chart to create a Secret), or
# supply an existing Secret containing a "database-url" key.
postgres:
  host: ""
  port: 5432
  database: cleat
  username: cleat
  password: ""
  # -- Name of an existing Secret with a "database-url" key.
  # When set, the chart will not create its own Secret.
  existingSecret: ""
  sslmode: disable

# -- Schema migration, run as a pre-install/pre-upgrade hook Job (cleat#2117).
#
# A worker no longer migrates the database when it starts: it VERIFIES the schema and
# refuses to start, with the remediation in its message, if a migration is not applied.
# So a release migrates BEFORE its pods start, and this Job (cleat-worker --migrate-only)
# is that step. Turn it off only if you run `cleat-worker --migrate-only` yourself as a
# deploy step -- with it off and no other migration step, new pods will not start.
migration:
  # -- Run the migration Job on install and upgrade.
  enabled: true
  # -- A DDL-capable role for the Job, if the runtime role (postgres.username) is
  # unprivileged, as it should be. Defaults to postgres.username / postgres.password.
  username: ""
  password: ""
  # -- Name of an existing Secret holding the migration DSN (key: existingSecretKey).
  # Preferred: the DDL credentials then never pass through chart values. When unset
  # and postgres.existingSecret is set, that Secret is reused; otherwise the chart
  # creates a short-lived hook Secret from username/password above.
  existingSecret: ""
  existingSecretKey: "database-url"
  # -- The Job is not retried: a failed migration needs a person, and a retry of a
  # half-applied one is exactly what the lock and per-migration transactions are for.
  backoffLimit: 0
  # -- Seconds before the Job is failed. A first migration onto a large table can be slow.
  activeDeadlineSeconds: 900

# -- HTTP API server configuration.
api:
  # -- Port for the HTTP API, health checks, and metrics endpoint.
  port: 8080

# -- The admin API (cleat#2267). OFF by default.
#
# Every /api/admin/* route (drain, retention sweep, force-complete, force-fail, re-replay, step resolve)
# answers 404 unless the worker runs with --enable-admin-api, which is what enabled: true passes.
#
# WHILE IT IS ON, ANY AUTHENTICATED API KEY OF ANY TENANT CAN DRAIN A WORKER AND TRIGGER A RETENTION
# SWEEP over every tenant's data, because cleat has no operator credential yet (cleat#2169). Turn it on
# only where every key you have issued is trusted to that degree. docs/operations/admin-api.md has the
# list of which routes are worker-level and which are tenant-scoped.
#
# What the preStop hook does depends on it:
#   enabled: true (and auth.adminApiKey or auth.existingSecret set)
#       the hook POSTs /api/admin/drain.
#   enabled: false (the default)
#       the hook only sleeps (worker.preStopSleepSeconds), so the pod leaves Service endpoints before SIGTERM.
# NEITHER lets a run in flight finish: the kubelet sends SIGTERM as soon as the hook returns, the drain hook
# returns when the POST is answered rather than when the drain is complete, and a run in flight at SIGTERM is
# currently failed rather than reclaimed by another worker (cleat#2285). See docs/operations/admin-api.md.
adminApi:
  enabled: false

# -- Auth configuration for the worker's HTTP API.
#
# cleat-worker's supported configuration defaults to --require-auth=true
# (tiers.yaml does not grant support for --require-auth=false), which
# rejects every request without a valid API key except the infrastructure paths (/healthz, /livez, /readyz,
# /metrics). That includes the preStop drain hook this chart runs on every
# pod shutdown (templates/deployment.yaml) -- POST /api/admin/drain. Without
# a key configured here, that hook 401s, the failure is swallowed by the
# hook's own `|| true` (needed so a slow/unreachable API server does not
# block pod termination), and pods terminate without ever draining in-flight
# work.
#
# Generate a key against your database once, out of band -- there is no way
# for the chart to provision one for you, since cleat-worker only mints a
# specific key value when told to write it to a real tenant_api_keys row:
#   cleat-worker --db "$DATABASE_URL" --generate-api-key "00000000-0000-0000-0000-000000000000"
# Then either paste the result into adminApiKey below (the chart creates a
# Secret for it) or store it in your own Secret and set existingSecret +
# existingSecretKey instead.
auth:
  # -- An API key for the preStop drain hook. Used only when adminApi.enabled is true; see below.
  # Ignored if existingSecret is set.
  adminApiKey: ""
  # -- Name of an existing Secret containing the admin API key. When set,
  # the chart will not create its own auth Secret.
  existingSecret: ""
  # -- Key within existingSecret holding the admin API key.
  existingSecretKey: "admin-api-key"

# -- Container resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- HorizontalPodAutoscaler configuration.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80

# -- Prometheus monitoring configuration.
monitoring:
  # -- ServiceMonitor for Prometheus Operator auto-discovery.
  serviceMonitor:
    enabled: true

# -- Kubernetes Service configuration.
service:
  type: ClusterIP

# -- ServiceAccount configuration.
serviceAccount:
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Security context for the pod (applied to all containers).
# https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Security context for the container (overrides pod-level).
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for scheduling.
nodeSelector: {}

# -- Pod tolerations.
tolerations: []

# -- Pod affinity rules.
affinity: {}
