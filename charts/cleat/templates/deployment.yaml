apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cleat.fullname" . }}
  labels:
    {{- include "cleat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cleat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cleat.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cleat.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--db=$(DATABASE_URL)"
            - "--concurrency={{ .Values.worker.concurrency }}"
            - "--task-queue={{ .Values.worker.taskQueues }}"
            - "--api-addr=:{{ .Values.api.port }}"
            - "--heartbeat={{ .Values.worker.heartbeatInterval }}"
            - "--poll={{ .Values.worker.pollInterval }}"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.existingSecret }}
                  name: {{ .Values.postgres.existingSecret }}
                  {{- else }}
                  name: {{ include "cleat.fullname" . }}
                  {{- end }}
                  key: database-url
            {{- if or .Values.auth.existingSecret .Values.auth.adminApiKey }}
            # Consumed only by the preStop hook below, to authenticate its own
            # call to /api/admin/drain (--require-auth defaults to true; see
            # values.yaml's auth section for why this can't be provisioned
            # automatically).
            - name: CLEAT_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.existingSecret }}
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretKey }}
                  {{- else }}
                  name: {{ include "cleat.fullname" . }}-auth
                  key: admin-api-key
                  {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  # `|| true`: pod termination must not block on this call (an
                  # unreachable or slow API server should not delay shutdown),
                  # so a still-missing CLEAT_ADMIN_API_KEY (see values.yaml's
                  # auth section) fails the same way it always silently has --
                  # this only fixes the case where a key *is* configured.
                  - "wget -q -O- --header=\"Authorization: Bearer ${CLEAT_ADMIN_API_KEY}\" --post-data='{}' http://localhost:{{ .Values.api.port }}/api/admin/drain || true"
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
