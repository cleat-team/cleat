apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cleat.fullname" . }}
  labels:
    {{- include "cleat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cleat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cleat.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cleat.serviceAccountName" . }}
      # The kubelet SIGKILLs the pod this long after it starts terminating, and the preStop hook, the worker's
      # SIGTERM drain (--shutdown-grace) and its plugin Stop budget (5s, cleat#2147) all come out of it. The
      # Kubernetes default, 30s, is too short for a 20s drain plus the preStop sleep (cleat#2285).
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--db=$(DATABASE_URL)"
            - "--concurrency={{ .Values.worker.concurrency }}"
            - "--task-queue={{ .Values.worker.taskQueues }}"
            - "--api-addr=:{{ .Values.api.port }}"
            - "--heartbeat={{ .Values.worker.heartbeatInterval }}"
            - "--reclaim-timeout={{ .Values.worker.reclaimTimeout }}"
            - "--flush-retry-window={{ .Values.worker.flushRetryWindow }}"
            - "--poll={{ .Values.worker.pollInterval }}"
            - "--shutdown-grace={{ .Values.worker.shutdownGrace }}"
            {{- if .Values.adminApi.enabled }}
            # Off unless asked for (cleat#2267): while it is on, any authenticated key of any tenant can drain a
            # worker and trigger an all-tenant retention sweep. See values.yaml and docs/operations/admin-api.md.
            - "--enable-admin-api"
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.existingSecret }}
                  name: {{ .Values.postgres.existingSecret }}
                  {{- else }}
                  name: {{ include "cleat.fullname" . }}
                  {{- end }}
                  key: database-url
            {{- if and .Values.adminApi.enabled (or .Values.auth.existingSecret .Values.auth.adminApiKey) }}
            # Consumed only by the preStop hook below, to authenticate its own
            # call to /api/admin/drain (--require-auth defaults to true; see
            # values.yaml's auth section for why this can't be provisioned
            # automatically). Only present when adminApi.enabled, since otherwise the hook
            # does not call that route.
            - name: CLEAT_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.existingSecret }}
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretKey }}
                  {{- else }}
                  name: {{ include "cleat.fullname" . }}-auth
                  key: admin-api-key
                  {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  {{- if and .Values.adminApi.enabled (or .Values.auth.existingSecret .Values.auth.adminApiKey) }}
                  # `|| true`: pod termination must not block on this call (an
                  # unreachable or slow API server should not delay shutdown),
                  # so a still-missing CLEAT_ADMIN_API_KEY (see values.yaml's
                  # auth section) fails the same way it always silently has --
                  # this only fixes the case where a key *is* configured.
                  - "wget -q -O- --header=\"Authorization: Bearer ${CLEAT_ADMIN_API_KEY}\" --post-data='{}' http://localhost:{{ .Values.api.port }}/api/admin/drain || true"
                  {{- else }}
                  # The admin API is off (the default; cleat#2267), so there is no drain route to call. A short
                  # sleep lets the endpoint controller take this pod out of Service endpoints before SIGTERM
                  # arrives; the worker then handles SIGTERM itself (see values.yaml, adminApi).
                  - "sleep {{ .Values.worker.preStopSleepSeconds }}"
                  {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
