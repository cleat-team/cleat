[project]
name = "cleat-langgraph"
version = "0.1.0"
description = "Cleat LangGraph Plugin — Design Study Port"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cleat_langgraph*"]
