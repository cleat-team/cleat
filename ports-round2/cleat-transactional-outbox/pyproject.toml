[project]
name = "cleat-transactional-outbox"
version = "0.1.0"
description = "Port of the DBOS transactional-outbox demo to the Cleat durable execution SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cleat-sdk @ file:///localssd/rcownie/cleat-agent1/python-sdk",
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
cleat-outbox = "app:main"
