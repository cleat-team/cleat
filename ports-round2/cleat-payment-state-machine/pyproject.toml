[project]
name = "cleat-payment-state-machine"
version = "0.1.0"
description = "Payment state machine ported from Restate to Cleat Python SDK"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cleat_sdk*", "cleat_payment_state_machine*"]
