[package]
name = "cleat-rust-basics"
version = "0.1.0"
edition = "2021"
description = "Port of Restate Rust basics example to the Cleat durable execution Rust SDK"

[lib]
crate-type = ["cdylib"]

[dependencies]
cleat-sdk = { path = "../../crates/cleat-sdk" }
cleat-macro = { path = "../../crates/cleat-macro" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1.41"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.docs]
build-target = "wasm32-wasip1"
build-command = "cargo build --target wasm32-wasip1 --release"
