apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleat-worker
  labels:
    app: cleat-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cleat-worker
  template:
    metadata:
      labels:
        app: cleat-worker
    spec:
      containers:
        - name: worker
          image: cleat-worker:latest
          args:
            - "--db=$(DATABASE_URL)"
            - "--api-addr=:8080"
            - "--concurrency=10"
            - "--namespace=default"
            - "--memory-soft-limit=0.80"
            - "--memory-hard-limit=0.95"
            - "--memory-check-interval=2s"
            - "--memory-sample-retention=1000"
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cleat-worker-config
                  key: database_url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cleat-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cleat-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric for memory-pressure-driven scaling (requires prometheus-adapter).
    # Uncomment to use instead of resource:memory above:
    # - type: Pods
    #   pods:
    #     metric:
    #       name: cleat_scaling_pressure
    #     target:
    #       type: AverageValue
    #       averageValue: "0.3"
