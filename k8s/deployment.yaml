apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleat-worker
  labels:
    app: cleat-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cleat-worker
  template:
    metadata:
      labels:
        app: cleat-worker
    spec:
      # A worker drains for --shutdown-grace (20s) after SIGTERM (cleat#2285); the kubelet's 30s default would leave
      # too little room for the release writes.
      terminationGracePeriodSeconds: 60
      # Must match the headless Service's name in service.yaml (cleat#2196):
      # this is what makes each pod resolvable as <pod-name>.cleat-worker-headless,
      # rather than just reachable through the load-balanced ClusterIP above.
      subdomain: cleat-worker-headless
      # Keeps two workers off one node (cleat#4439), the same default as charts/cleat/values.yaml's topologySpread.
      # A PREFERENCE, not a refusal: ScheduleAnyway lets a one-node cluster, or one whose other nodes are full or
      # cordoned, still start every worker. For a Pending pod instead of two workers on one node, change it to
      # DoNotSchedule. It is spread rather than anti-affinity so the autoscaler can go past the node count.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cleat-worker
      containers:
        - name: worker
          image: cleat-worker:latest
          args:
            - "--db=$(DATABASE_URL)"
            - "--api-addr=:8080"
            - "--concurrency=10"
            - "--task-queue=default"
            - "--memory-soft-limit=0.80"
            - "--memory-hard-limit=0.95"
            - "--memory-check-interval=2s"
            - "--memory-sample-retention=1000"
            - "--worker-service-name=cleat-worker-headless"
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cleat-worker-config
                  key: database_url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          # The same defaults as charts/cleat/values.yaml, which has the measurements behind them
          # (cleat#4393): a Python component compile is OOM-killed at a 512Mi limit and takes 11.4 s
          # at 500m of CPU, and the HPA below measures utilization against the REQUEST.
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cleat-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cleat-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # No resource:memory metric (cleat#4393): it is a percentage of the request, a worker's memory is
    # dominated by caches and held runs that grow by design, and a target below what one warmed worker
    # uses pins the autoscaler at maxReplicas. charts/cleat/values.yaml (autoscaling.targetMemory) has
    # the arithmetic. For memory-pressure-driven scaling use the custom metric below, or KEDA
    # (k8s/keda-scaledobject.yaml).
    # Custom metric for memory-pressure-driven scaling (requires prometheus-adapter):
    # - type: Pods
    #   pods:
    #     metric:
    #       name: cleat_scaling_pressure
    #     target:
    #       type: AverageValue
    #       averageValue: "0.3"
