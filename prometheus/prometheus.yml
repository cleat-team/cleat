global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "durable-workers"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker-1:8080"
          - "worker-2:8080"
          - "worker-3:8080"
          - "dashboard:8080"
        labels:
          app: "durable-worker"
