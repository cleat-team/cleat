[package]
name = "cleat-js-plugin"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "cleat_js_plugin"
crate-type = ["cdylib"]

[dependencies]
javy-plugin-api = { version = "=7.1.0", features = ["json"] }
# The host-call bindings are the repository's own Rust SDK, reused as-is: the sentinel decode, the stop-bit check and the
# suspended flag are the ones the Rust replay tests already cover (plan section 4.1).
cleat-sdk = { path = "../../../crates/cleat-sdk" }
serde_json = "1"

# Not a member of the repository's Cargo workspace: this is a branch-only prototype
# (proto/ts-javy) and must not change what the Rust SDK's CI builds.
[workspace]

[profile.release]
opt-level = "s"
lto = true
