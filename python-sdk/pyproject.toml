[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleat-sdk"
version = "0.2.0"
description = "Python SDK for cleat — durable execution framework for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Cleat Team"}
]
keywords = ["durable-execution", "workflow", "wasm", "cleat", "langchain", "langgraph", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
# ruff is bounded, not floored: its default rule set moves between releases and
# [tool.ruff] below pins the same range via `required-version`. `ruff>=0.1`
# resolved to whatever was newest, which is how a lint backlog went from 3 to
# 260 without a line of Python changing. Bump this, `required-version`, and the
# pin in .github/workflows/ci.yml together.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.16,<0.17"]
langchain = ["langchain>=0.3.0", "langchain-openai>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
all = ["cleat-sdk[langchain,langgraph,dev]"]

[project.urls]
Repository = "https://github.com/cleat-team/cleat"
Issues = "https://github.com/cleat-team/cleat/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cleat_sdk._wit" = ["**/*.py"]
"cleat_sdk._wit.wit_world" = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# -----------------------------------------------------------------------------
# ruff
#
# WHY `required-version` AND AN EXPLICIT `select` ARE BOTH LOAD-BEARING.
#
# This section used to set line-length, target-version and exclude, and no
# rules. With no `select`, the rule set is whatever ruff's built-in default is
# -- and that default is not stable across ruff releases. Measured 2026-08-08,
# same tree, same config, only the ruff version changed:
#
#   pip install ruff==0.6.9  && ruff check python-sdk/   ->  60 rules,   3 errors
#   pip install ruff==0.16.2 && ruff check python-sdk/   -> 413 rules, 260 errors
#
# CI installed ruff unpinned, so the strictness of a lint check was set by
# whoever last shipped a ruff release, on their schedule, and the 260 was a
# property of that release rather than of this code. Same class as the moving
# container tag pinned in #390 -- a third party deciding when this repo goes
# red -- except this one had already fired.
#
# So: pin the version, and name the rules. `required-version` fails loudly
# rather than silently changing what the check means:
#
#   Cause: Required version `>=0.16, <0.17` does not match the running
#          version `0.6.9`
#
# Bump it and the CI pin in .github/workflows/ci.yml together, deliberately,
# reading the new release's rule-set changes -- not as a side effect of a
# fresh `pip install`.
# -----------------------------------------------------------------------------
[tool.ruff]
required-version = ">=0.16,<0.17"
line-length = 100
target-version = "py310"
# Generated by componentize-py, and not even py310-parseable (it uses star
# annotations, 3.11+). Excluded because it is not ours to lint or to fix.
exclude = ["cleat_sdk/_wit"]

[tool.ruff.lint]
# Modelled on httpx's set (E, F, I, B, PIE) -- a library of comparable size --
# extended with the families that pay for themselves here. Counts measured on
# 2026-08-08 with `ruff check --select <family> python-sdk/ --statistics`:
#
#   UP   178   pyupgrade. The single largest win and 173 of them autofixable:
#              typing.Optional[X]/List[X] left over from before this package
#              required py310. Keeping them is how the floor silently rises.
#   RUF   32   ruff's own; mostly real (mutable class defaults, unused unpacked
#              variables).
#   I     20   import sorting, all autofixable.
#   SIM    9   flake8-simplify.
#   PIE    8   flake8-pie.
#   PERF   7   Perflint.
#   B      4   flake8-bugbear.
#   F      3   pyflakes: three genuinely unused imports.
#   E4/E7/E9   0 today; they are the ones worth never regressing on.
#   C4     0   comprehensions.
#   T20   86   print(); see per-file-ignores -- 0 remain in library code.
#   BLE   15   blind `except:`. In an SDK these swallow the user's own errors,
#              which is exactly the failure an external author cannot debug.
#
# NOT selected, deliberately, with what each would cost today:
#
#   ANN  592   annotating every signature is a project decision, not a lint
#              cleanup, and doing it under time pressure produces `Any`.
#   S    708   699 are bare `assert` in tests -- bandit's default assumption is
#              wrong for pytest, and per-file-ignoring it would leave 9.
#   D    440   needs a docstring convention chosen first (google vs numpy).
#   EM/TRY/COM 334  style-heavy, low defect yield.
#   E501  72   line length is `ruff format`'s job, and the Makefile runs it.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "UP", "SIM", "PERF", "RUF", "T20", "BLE"]

# RUF003 flags en dashes in comments as "ambiguous unicode". All 15 hits are
# ordinary prose punctuation in test comments. The rule is aimed at homoglyph
# attacks in identifiers; RUF001 (identifiers) and RUF002 (docstrings) stay on.
#
# PERF203 ("try-except within a loop incurs performance overhead") was wrong at
# all six sites it fired on, which is why it is unselected rather than
# suppressed six times. Every one of them is a loop whose entire purpose is
# per-item error isolation -- saga compensation must attempt every remaining
# step even when one raises (types.py), and the langgraph checkpoint reader
# must skip an undecodable key rather than lose the rest of the thread's
# history (langgraph/checkpoint.py). Hoisting the try out of the loop would
# change behaviour, not just cost. The premise is also weak on the versions
# this package supports: PEP 659's zero-cost exceptions (3.11+) make the
# non-raising path essentially free. The rest of PERF stays selected.
ignore = ["RUF003", "PERF203"]

[tool.ruff.lint.per-file-ignores]
# T201 is `print` found in library code, which is worth catching -- there are
# 13 today and all 13 are in vet.py, a CLI whose job is printing. Ignoring it
# in the four places printing is correct leaves the rule live everywhere it
# would mean something.
"cleat_sdk/vet.py" = ["T201"]
"scripts/**" = ["T201"]
"tests/**" = ["T201", "B011"]
"examples/**" = ["T201", "BLE001"]

[tool.componentize-py]
wit_path = "wit/"
world = "cleat-workflow"

[tool.coverage.run]
source = ["cleat_sdk"]
omit = ["cleat_sdk/_wit/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 50
