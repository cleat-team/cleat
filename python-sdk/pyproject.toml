[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleat-sdk"
version = "0.2.0"
description = "Python SDK for cleat — durable execution framework for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Cleat Team"}
]
keywords = ["durable-execution", "workflow", "wasm", "cleat", "langchain", "langgraph", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
langchain = ["langchain>=0.3.0", "langchain-openai>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
all = ["cleat-sdk[langchain,langgraph,dev]"]

[project.urls]
Repository = "https://github.com/rcownie/cleat"
Issues = "https://github.com/rcownie/cleat/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cleat_sdk._wit" = ["**/*.py"]
"cleat_sdk._wit.wit_world" = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["cleat_sdk/_wit"]

[tool.componentize-py]
wit_path = "wit/"
world = "cleat-workflow"

[tool.coverage.run]
source = ["cleat_sdk"]
omit = ["cleat_sdk/_wit/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 50
