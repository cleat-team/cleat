# The workflow's identity: what `cleat deploy --name` registers and what a
# caller names when it starts a run.
#
# entry_points is snake_case while the Go function is RunAgent, because the
# entry point is part of the ABI and C/WASM callers do not have Go's naming.
# The built artifact is named for its SOURCE FILE, not the entry point --
# agent.go, so agent.wasm. Getting entry_points out of step with the Go
# function deploys cleanly and fails at START, after the run id has been
# handed out.
name: ai-agent-platform
language: go
entry_points:
  - run_agent
