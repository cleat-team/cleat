# Postgres and a cleat worker -- the infrastructure this scenario runs on.
#
# The backend is deliberately NOT a service here. It is your application: this
# file stands up what an application connects TO. Run it with `go run ./backend`
# from the example directory; see the README.
#
# Mirrors examples/order-lifecycle/docker-compose.yml, and the parts that look
# fussy are the parts measured there rather than reasoned about.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    ports:
      - "${CLEAT_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Schema migration as a one-shot step: a worker no longer migrates itself at
  # every start (cleat#2117). Runs as the postgres superuser, because DDL needs
  # it and because migrations/postgres/005_app_role.sql -- the file that creates
  # the lesser role below -- has to run first.
  migrate:
    image: ${CLEAT_WORKER_IMAGE:-ghcr.io/cleat-team/cleat-worker:latest}
    command:
      - "--migrate-only"
      - "--db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 005_app_role.sql creates cleat_app NOLOGIN and without a password, on
  # purpose: a credential does not belong in a file that migrations replay.
  app-role:
    image: postgres:16
    environment:
      PGPASSWORD: cleat
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - cleat
      - -d
      - cleat
      - -c
      - "ALTER ROLE cleat_app LOGIN PASSWORD '${CLEAT_APP_PASSWORD:-cleat-app-local-dev}';"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  cleat-worker:
    image: ${CLEAT_WORKER_IMAGE:-ghcr.io/cleat-team/cleat-worker:latest}
    # A worker drains for --shutdown-grace (default 20s) after SIGTERM before it
    # cancels its runs (cleat#2285). Docker sends SIGKILL after 10s unless told
    # otherwise, which would cut the drain off.
    stop_grace_period: 60s
    command:
      # NOT the postgres superuser above. Every tenant-scoped table has
      # row-level security FORCEd, and PostgreSQL never applies RLS to a
      # superuser -- see migrations/postgres/005_app_role.sql. --require-auth
      # (on by default) refuses to start over a connection that is exempt from
      # RLS, which is what catches this if it regresses.
      - "--db=postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable"
      # Used only for the startup schema-verification's error message; this
      # worker does not migrate itself -- see the migrate service above.
      - "--migrate-db=postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable"
      - "--api-addr=:8080"
      - "--concurrency=4"
      # THE EDGE MIDDLEWARE, CONFIGURED LOW ENOUGH TO OBSERVE.
      #
      # `ratelimiter` wraps every request -- core routes included, not only its
      # own -- and this is the one number the scenario needs: without a rate
      # set, per-tenant limiting is off and the hitch point is present but
      # invisible. Set low so a burst from the scenario produces a real 429
      # rather than being described.
      #
      # DEFAULT MODE IS PER-WORKER (in-process token buckets), which is what an
      # example should show. `mode: db` coordinates across workers through a
      # shared table and needs the plugin-config flag; see the README.
      - "--rate-limit-per-tenant=10"
      - "--rate-limit-per-tenant-burst=10"
    environment:
      # `webhook-ingest` seals each source's signing secret, and `notifications`
      # seals each webhook's -- so BOTH need a master key. Without one the
      # worker still starts and the first create answers 500, which is the
      # first-install case and the one an operator has no reason to expect.
      #
      # A fixed local-development value, like the app-role password above: this
      # file is a starting point, and a real deployment supplies its own out of
      # band. base64, 32 bytes.
      CLEAT_SECRET_MASTER_KEY: ${CLEAT_SECRET_MASTER_KEY:-kiFstWOvEcdUe9ELx0oCTNorrTniHsyhUwLESCzufzw=}
    ports:
      - "${CLEAT_API_PORT:-8080}:8080"
    depends_on:
      app-role:
        condition: service_completed_successfully
