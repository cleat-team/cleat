# A database and a cleat worker -- the infrastructure this scenario runs on.
# One database at a time, and the profile selects which: cleat#2560.
#
#   docker compose --profile postgres up -d
#
# The application backend is deliberately NOT a service here, exactly as in
# examples/order-lifecycle: it is your application, this file stands up what an
# application connects TO, and `go run ./backend` from the example directory
# starts it on the host. scripts/run-integration-hub-scenario.sh drives the same
# flow with `curl` instead, because the CI job's job is to run the README's
# DOCUMENTED COMMANDS rather than a program of its own.
#
# What would sit outside this file in a deployment is the customer's CRM, and
# that is the `sink` below.
#
# Mirrors examples/order-lifecycle/docker-compose.yml, and the parts that look
# fussy are the parts measured there rather than reasoned about. THAT FILE's
# dialect section is the reference for this one; the differences are called out
# where they occur rather than repeated.

x-dsn:
  # The DSNs are the only thing that genuinely differs per dialect. These are the
  # IN-NETWORK names, because the worker reaches the database over the compose
  # network; the README's deploy command runs on your host and uses `localhost`.
  #
  # MySQL's has no scheme (`user:pw@tcp(host:3306)/db`) where the other two do,
  # so there is no one template with the host swapped out -- the shape differs.
  migrate: &dsn_migrate "${CLEAT_MIGRATE_DB_URL:-postgres://cleat:cleat@postgres:5432/cleat?sslmode=disable}"
  worker: &dsn_worker "${CLEAT_WORKER_DB_URL:-postgres://cleat_app:${CLEAT_APP_PASSWORD:-cleat-app-local-dev}@postgres:5432/cleat?sslmode=disable}"

services:
  postgres:
    # Not digest-pinned, unlike cleat's own CI: this file is an example a reader
    # will copy into a project, and a digest frozen on the day they read it is
    # theirs to carry, not ours to choose. 16 is cleat's minimum.
    profiles: [postgres]
    # mirror.gcr.io, not docker.io: this file is exercised directly by CI's
    # scenario jobs (ci.yml's "Integration hub" family), which hit Docker
    # Hub's anonymous pull-rate limit tonight (cleat#3290). mirror.gcr.io
    # pulls through the same content -- re-derive with
    # `docker pull mirror.gcr.io/library/postgres:16` and compare its digest
    # against a plain `docker pull postgres:16`.
    image: mirror.gcr.io/library/postgres:16
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    ports:
      - "${CLEAT_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleat -d cleat"]
      interval: 3s
      timeout: 5s
      retries: 10

  mysql:
    profiles: [mysql]
    # mirror.gcr.io -- see the postgres service above (cleat#3290).
    image: mirror.gcr.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cleat
      MYSQL_DATABASE: cleat
    ports:
      - "${CLEAT_MYSQL_PORT:-3306}:3306"
    healthcheck:
      # `-h 127.0.0.1`, NOT `-h localhost` -- and this is copied from the
      # order-lifecycle compose, where the `localhost` form was MEASURED to fail
      # this scenario's sibling: in the MySQL client `localhost` means "use the
      # unix socket", which can answer during the image's init phase while TCP is
      # still closed, and `service_healthy` releases on the FIRST healthy reading.
      # Every consumer here connects over TCP (`tcp(mysql:3306)`).
      #
      # The discriminator is the CLIENT, not the string: `sqlcmd` has no such
      # special case, so the MSSQL healthcheck below keeps `-S localhost` and the
      # MSSQL arm passes with it.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pcleat"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${CLEAT_MSSQL_SA_PASSWORD:-CleatTest123!}"
      MSSQL_PID: Developer
    ports:
      - "${CLEAT_MSSQL_PORT:-1433}:1433"
    healthcheck:
      # -C trusts the server's self-signed certificate. Without it sqlcmd refuses
      # the connection and the service never reports healthy, which reads as "the
      # database is down" rather than "the client is strict".
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${CLEAT_MSSQL_SA_PASSWORD:-CleatTest123!}", "-Q", "SELECT 1", "-C"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  # SQL Server only: cleat does NOT create its database.
  #
  # On MySQL the store factory issues `CREATE DATABASE IF NOT EXISTS` itself
  # (engine/mysql_store.go), and PostgreSQL's `POSTGRES_DB` above creates one at
  # first boot. Nothing does that for SQL Server, so a
  # `sqlserver://...?database=cleat` DSN against a fresh server fails to connect
  # rather than to migrate.
  mssql-db:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "${CLEAT_MSSQL_SA_PASSWORD:-CleatTest123!}"
      - -C
      - -Q
      - "IF DB_ID('cleat') IS NULL CREATE DATABASE cleat"
    restart: "no"

  # Schema migration as a one-shot step: a worker no longer migrates itself at
  # every start (cleat#2117). On PostgreSQL it runs as the superuser, because DDL
  # needs it, and because the baseline creates the lesser role below -- cleat_app,
  # in migrations/postgres/001_schema.sql -- before anything connects as it.
  migrate:
    image: ${CLEAT_WORKER_IMAGE:-ghcr.io/cleat-team/cleat-worker:latest}
    command:
      # The worker does not infer the dialect from the DSN: `--driver` defaults to
      # `postgres`, so a MySQL DSN without this is a connection error rather than
      # a dialect switch.
      - "--driver=${CLEAT_DIALECT:-postgres}"
      - "--migrate-only"
      - "--db"
      - *dsn_migrate
    depends_on:
      # `required: false` on each, because at most one is enabled by the active
      # profile. It does NOT weaken the condition for the one that IS enabled --
      # measured in the order-lifecycle compose, with a negative control.
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      mssql-db:
        condition: service_completed_successfully
        required: false
    restart: "no"

  # PostgreSQL only. The baseline creates cleat_app NOLOGIN and without a
  # password, on purpose: a credential does not belong in a file that migrations
  # replay (migrations/postgres/001_schema.sql). This supplies one for local
  # development, once the migration above has created the role to receive it.
  #
  # MySQL has no second identity to connect as -- it is single-tenant by
  # construction -- and SQL Server has no such role here either. Under the
  # postgres profile rather than documented as not-for-MySQL, because a step
  # skipped by instruction gets run by the next person to paste a command.
  app-role:
    profiles: [postgres]
    # mirror.gcr.io -- see the first postgres service above (cleat#3290).
    image: mirror.gcr.io/library/postgres:16
    environment:
      PGPASSWORD: cleat
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - cleat
      - -d
      - cleat
      - -c
      - "ALTER ROLE cleat_app LOGIN PASSWORD '${CLEAT_APP_PASSWORD:-cleat-app-local-dev}';"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # THE ROPE END, STANDING IN FOR YOUR CUSTOMER'S SYSTEM.
  #
  # The connector dispatch is a real durable call to the notifications plugin;
  # what is stubbed is only where it lands. In a deployment this service is the
  # customer's CRM and does not exist in your compose file at all; here it
  # exists so the whole thing runs, and it counts what it receives so the
  # scenario can assert that a resumed run did not deliver twice.
  #
  # It is a compose service rather than a process on the host because the
  # worker runs in a container: a host listener needs `host.docker.internal`,
  # which is not resolvable on Linux without an extra --add-host flag. On the
  # compose network the name `sink` just resolves, on every platform.
  #
  # Unprofiled, deliberately: it is not a database and every dialect needs it.
  sink:
    # mirror.gcr.io -- see the postgres service above (cleat#3290).
    image: mirror.gcr.io/library/python:3-alpine
    command:
      - python3
      - -c
      - |
        import http.server

        class Handler(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get('Content-Length', 0) or 0)
                self.rfile.read(n)
                with open('/tmp/hits', 'a') as f:
                    f.write('hit\n')
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'ok')

            def log_message(self, *a):
                pass

        http.server.HTTPServer(('0.0.0.0', 9099), Handler).serve_forever()
    # Nothing depends on it; the worker delivers to it. Declared so a reader
    # sees the two halves of the scenario side by side.

  cleat-worker:
    image: ${CLEAT_WORKER_IMAGE:-ghcr.io/cleat-team/cleat-worker:latest}
    # A worker drains for --shutdown-grace (default 20s) after SIGTERM before it
    # cancels its runs (cleat#2285). Docker sends SIGKILL after 10s unless told
    # otherwise, which would cut the drain off.
    stop_grace_period: 60s
    command:
      - "--driver=${CLEAT_DIALECT:-postgres}"
      # On PostgreSQL, NOT the superuser the migration above used. Every
      # tenant-scoped table has row-level security FORCEd, and PostgreSQL never
      # applies RLS to a superuser -- which is what cleat_app is for. That
      # refusal is PostgreSQL-ONLY: cmd/cleat-worker/main.go gates the whole check
      # on `--driver == "postgres"` before calling engine.CheckRLSEnforced, which
      # queries pg_roles, so on the other two dialects --require-auth is not a
      # weaker guarantee but no check at all. See the README.
      - "--db"
      - *dsn_worker
      # Used only for the startup schema-verification's error message; this
      # worker does not migrate itself -- see the migrate service above.
      - "--migrate-db"
      - *dsn_migrate
      - "--api-addr=:8080"
      - "--concurrency=4"
      # THE PERMISSION AN INTEGRATION HUB ACTUALLY NEEDS.
      #
      # cleat's egress policy refuses loopback and RFC1918 addresses by default,
      # which is the right floor and the wrong default for this scenario: an
      # integration hub's whole job is reaching systems INSIDE the customer's
      # network, so "use a public endpoint" is the opposite of the lesson.
      #
      # The policy is a floor WITH AN EXEMPTION rather than an absolute --
      # `engine/egress_policy.go` marks the RFC1918 prefixes `exemptible: true`
      # and the help text at `cmd/cleat-worker/config.go:423` names a
      # self-hosted model server as the motivating case. An operator permits a
      # host by NAME, and the name is the host as it appears in the URL, so
      # this is the compose service name.
      #
      # Measured: without this, the delivery is refused with
      #   egress to sink (172.19.0.3) is refused by cleat's network policy: RFC1918 private
      # which names a range and a reason and reads like a closed door. It is a
      # door with a handle.
      - "--plugin-egress-allow-private=sink"
      # THE CORE'S PER-TENANT TIER -- NOT the plugin's edge middleware.
      #
      # There are two limiters and this flag is the wrong one for the
      # `ratelimiter` hitch point, which is why it is commented rather than
      # relied on. `--rate-limit-per-tenant` is read by the WORKER's own
      # `rateLimitMiddleware` (cmd/cleat-worker/config.go), whose 429 carries no
      # X-RateLimit-* headers. The PLUGIN's middleware builds its buckets from
      # its own table, seeded through `PUT /rate-limits/{key}`, and its 429 does
      # carry them -- that is the mechanism the scenario exercises and the
      # header it asserts on.
      #
      # Set to 0 (the default, disabled) so the two cannot be confused: the
      # core's per-IP tier is still active at its default of 100/s, which is
      # well above the scenario's burst, so a 429 there can only be the plugin's.
      - "--rate-limit-per-tenant=0"
    environment:
      # `webhook-ingest` seals each source's signing secret, and `notifications`
      # seals each webhook's -- so BOTH need a master key. Without one the
      # worker still starts and the first create answers 500, which is the
      # first-install case and the one an operator has no reason to expect.
      #
      # A fixed local-development value, like the app-role password above: this
      # file is a starting point, and a real deployment supplies its own out of
      # band. base64, 32 bytes.
      CLEAT_SECRET_MASTER_KEY: ${CLEAT_SECRET_MASTER_KEY:-kiFstWOvEcdUe9ELx0oCTNorrTniHsyhUwLESCzufzw=}
    ports:
      - "${CLEAT_API_PORT:-8080}:8080"
    depends_on:
      app-role:
        condition: service_completed_successfully
        required: false
      migrate:
        condition: service_completed_successfully
        required: false
