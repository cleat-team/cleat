# The workflow's identity: what `cleat deploy --name` registers and what a
# caller names when it starts a run.
#
# entry_points is snake_case while the Go function is SyncCustomer, because the
# entry point is part of the ABI and C/WASM callers do not have Go's naming.
# The built artifact is named for THIS FIELD, `name:` above --
# integration-hub.wasm (cleat#2692) -- not the entry point and not its
# source file either. Getting entry_points out of step with the Go function
# deploys cleanly and fails at START, after the run id has been handed out.
name: integration-hub
language: go
entry_points:
  - sync_customer
