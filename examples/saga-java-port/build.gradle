buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.teavm:teavm-gradle-plugin:0.10.2"
    }
}

plugins {
    id "java"
}

// Apply the TeaVM plugin via buildscript classpath (not Gradle Plugin Portal)
apply plugin: "org.teavm"

group = "com.cleat.saga"
version = "0.1.0"

repositories {
    mavenCentral()
}

dependencies {
    // Depend on the cleat Java SDK subproject for implementation
    implementation project(":durable-java")

    // TeaVM classlib for standard Java library emulation
    implementation "org.teavm:teavm-classlib:0.10.2"
    implementation "org.teavm:teavm-jso-apis:0.10.2"

    // Use the SDK as an annotation processor (DurableEntryProcessor is in there)
    annotationProcessor project(":durable-java")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
    }
}

teavm {
    wasm {
        // Use the generated WorkflowEntry as the analysis root.
        // WorkflowEntry -> CleatEntryIndex -> *_Export classes -> user methods.
        // This reference chain preserves all @CleatEntry exports automatically.
        mainClass = "cleat.WorkflowEntry"
        targetFileName = "workflow.wasm"
        outputDir = file("build/wasm")
        optimization = org.teavm.gradle.api.OptimizationLevel.BALANCED
    }
}

tasks.named("test") {
    useJUnitPlatform()
}
