# The workflow's identity: what `cleat deploy --name` registers and what a
# caller names when it starts a run.
#
# entry_points is snake_case while the Go function is ProvisionTenant, because
# the entry point is part of the ABI and C/WASM callers do not have Go's
# naming. The built artifact is named for the entry point today
# (provision_tenant.wasm), not this name: field -- confirmed by running
# `cleat build`, not assumed; see examples/order-lifecycle/cleat.yaml, which
# documents the same rule for place_order.wasm. cleat#2692 changes the rule
# to prefer this field once it merges.
name: b2b-saas-control-plane
language: go
entry_points:
  - provision_tenant
