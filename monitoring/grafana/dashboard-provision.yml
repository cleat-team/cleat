# Grafana dashboard provisioning file.
# Automatically imports the cleat workflow engine dashboard on startup.
apiVersion: 1

providers:
  - name: "Cleat Workflow Dashboard"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/cleat
