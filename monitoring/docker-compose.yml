# Docker Compose for the cleat workflow engine monitoring stack.
#
# Starts Prometheus and Grafana with automatic datasource and dashboard
# provisioning. The cleat worker is expected to be running separately
# (or as part of the cluster compose) and exposing metrics on port 8080.
#
# Usage:
#   docker compose -f monitoring/docker-compose.yml up -d
#   # Grafana: http://localhost:3000  (admin/admin)
#   # Prometheus: http://localhost:9090
#
# To use with the cluster compose, run from the project root:
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.yml up -d

services:
  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: cleat-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: cleat-grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Datasource provisioning: automatically adds Prometheus as a datasource.
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # Dashboard provisioning: automatically imports the cleat dashboard.
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/cleat/cleat-main.json:ro
      - ./grafana/dashboard-provision.yml:/etc/grafana/provisioning/dashboards/dashboard-provision.yml:ro
      # Persist Grafana configuration and user data.
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/cleat/cleat-main.json
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
