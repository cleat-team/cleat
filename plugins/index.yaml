      - version: 1.0.0
        bundled: true
        description: Ships with cleat-worker binary

  - name: kvstore
    description: Versioned JSONB key-value store with optimistic concurrency
    author: cleat
    repository: https://github.com/rcownie/cleat
    versions:
      - version: 1.0.0
        bundled: true
        description: Ships with cleat-worker binary
