# ---------------------------------------------------------------------------
# Labeler configuration — maps file path globs to PR labels
# Used by .github/workflows/labeler.yml (actions/labeler@v5)
# ---------------------------------------------------------------------------

# Area labels
"area/cli":
  - any:
      - cmd/cleat/**/*
      - cmd/cleat-gen/**/*

"area/wasm":
  - any:
      - internal/wasm/**/*
      - internal/transform/**/*

"area/engine":
  - any:
      - internal/host/**/*
      - internal/replay/**/*

"area/ui":
  - any:
      - cmd/cleat-worker/web/**/*

"area/sdk":
  - any:
      - cleat/**/*

"area/docs":
  - any:
      - "*.md"
      - "**/*.md"
      - docs/**/*

"area/ci":
  - any:
      - .github/**/*

"area/plugins":
  - any:
      - plugins/**/*

"area/rust":
  - any:
      - crates/**/*

"area/python":
  - any:
      - python-sdk/**/*

"area/java":
  - any:
      - crates/cleat-java/**/*

"area/assemblyscript":
  - any:
      - packages/cleat-as/**/*
