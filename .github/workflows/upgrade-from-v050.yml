# ---------------------------------------------------------------------------
# Upgrade From v0.5.0 (cleat#3735, owner decision D79)
#
# 0.6.0 supports an in-place upgrade from 0.5.0 (D79 reverses D18 for 0.5.0 to
# 0.6.0). This job seeds a database with the PUBLISHED v0.5.0 cleat-worker, kills
# it with runs in flight, then runs the release candidate against it:
#
#   * `--migrate-only` migrates it in place (exit 0), runs every migration since
#     v0.5.0 and the plugins' migrations (event-triggers, jobqueue, notifications
#     and scheduler gained steps), leaves every run's event history byte-for-byte
#     as the seed wrote it, and produces the schema a FRESH release candidate
#     produces;
#   * the release candidate then serves it and every run that was in flight
#     completes: a step that was RUNNING at the kill (reclaimed after its lease),
#     runs SLEEPING on a timer or WAITING on a signal, parents awaiting a child,
#     and runs QUEUED and never claimed;
#   * a control run whose recorded checksums were corrupted must be refused, so a
#     clean resume of the others proves the history chain was verified.
#
# The v0.5.0 artifacts are pinned by sha256 and image digest in
# scripts/upgrade_from_v040.py (PINS); see the comment there for which commit
# they were built from and how that was established.
#
# WHERE IT RUNS. On a push to a release/** branch and on demand, like the v0.4.0
# job. One job per dialect, each its own check: PostgreSQL and SQL Server here;
# MySQL follows (cleat#3735).
# Making it a REQUIRED check on release branches is a ruleset change and the
# owner's, not this file's.
#
# Exit statuses: 0 passed, 1 a finding, 2 UNMEASURED (the check could not look,
# which is a failure of the check, not a finding about cleat).
# ---------------------------------------------------------------------------
name: Upgrade From v0.5.0

on:
  push:
    branches: ["release/**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - .github/workflows/upgrade-from-v050.yml
  workflow_dispatch:

# Keyed on the commit for pushes, so one queued release-branch run is never
# cancelled by the next push; superseded PR runs are cancelled.
# scripts/check-workflow-concurrency.sh requires exactly this shape.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  upgrade-from-v050:
    name: Upgrade From v0.5.0 (PostgreSQL)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        # 127.0.0.1, not localhost: see engine-race.yml.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # An EMPTY database: the seed step migrates it with the v0.5.0 worker.
      OWNER_DB: postgres://postgres:postgres@127.0.0.1:5432/cleat?sslmode=disable
      STATE_DIR: ${{ github.workspace }}/.upgrade-state

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Harness self-test
        run: python3 scripts/upgrade_from_v040.py --self-test

      # CGO on: with it off there is no WASM backend and the worker exits 1
      # at startup (CLAUDE.md, "Build and test with CGO on"). --verify-backend
      # turns that into a failure HERE rather than a migration-shaped one below.
      - name: Build the release candidate's cleat-worker
        run: |
          go build -o "$RUNNER_TEMP/cleat-worker-rc" ./cmd/cleat-worker
          "$RUNNER_TEMP/cleat-worker-rc" -verify-backend

      - name: Seed a database with the published v0.5.0, runs in flight
        run: |
          start=$SECONDS
          python3 scripts/upgrade_from_v040.py seed --from-version v0.5.0 --owner-db "$OWNER_DB" --state-dir "$STATE_DIR"
          echo "seed_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upgrade in place with the release candidate; every in-flight run completes
        run: |
          start=$SECONDS
          python3 scripts/upgrade_from_v040.py verify --expect upgrade --owner-db "$OWNER_DB" --state-dir "$STATE_DIR" --rc-worker "$RUNNER_TEMP/cleat-worker-rc"
          echo "verify_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      # include-hidden-files: STATE_DIR is `.upgrade-state`, a hidden directory,
      # and upload-artifact skips hidden files by default (cleat#3461). `warn`
      # and not `error`: when an early step fails there is legitimately no
      # state directory, and a second failure would bury the first.
      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-from-v050-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .upgrade-state/*.log
            .upgrade-state/manifest.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  # The same upgrade on SQL Server (cleat#3735, PR 2).  Its own job and its own check name, so a
  # dialect that breaks is named by the red check and a ruleset can require each on its own.
  #
  # WHAT DIFFERS FROM THE PostgreSQL JOB, all of it inside scripts/upgrade_from_v040.py: SQL is read through
  # scripts/upgrade-from-v040/mssqlq (a Go program: the owner login is not exempt from row-level security,
  # so tenant tables are read with the session's tenant_id set); the org and tenant are inserted with SQL
  # because v0.5.0's --create-org and --create-tenant are PostgreSQL only; the app login is created the way
  # deploy/mssql/900-app-role.sh does; and the schema comparison includes column collations, because the
  # 0.6.0 migrations changed several (D60).
  upgrade-from-v050-mssql:
    name: Upgrade From v0.5.0 (SQL Server)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mssql:
        # Pinned by digest, the same one as every other mssql service in this repo
        # (tier1-gate.yml has the rationale); scripts/check-workflow-guards.py wants
        # MSSQL_MEMORY_LIMIT_MB on every one.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
          MSSQL_MEMORY_LIMIT_MB: "2048"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433

    env:
      OWNER_DB: sqlserver://sa:CleatTest123!@127.0.0.1:1433?database=cleat
      STATE_DIR: ${{ github.workspace }}/.upgrade-state

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Names the service container, so the self-test's SQL Server cases run here and not only elsewhere.
      - name: Harness self-test
        env:
          UPGRADE_SELFTEST_MSSQL: sqlserver://sa:CleatTest123!@127.0.0.1:1433?database=master
        run: python3 scripts/upgrade_from_v040.py --self-test

      # An EMPTY database: the seed step migrates it with the v0.5.0 worker.
      - name: Create the cleat database
        run: |
          go run ./scripts/upgrade-from-v040/mssqlq \
            -dsn "sqlserver://sa:CleatTest123!@127.0.0.1:1433?database=master" -sql "CREATE DATABASE cleat"

      - name: Build the release candidate's cleat-worker
        run: |
          go build -o "$RUNNER_TEMP/cleat-worker-rc" ./cmd/cleat-worker
          "$RUNNER_TEMP/cleat-worker-rc" -verify-backend

      - name: Seed a database with the published v0.5.0, runs in flight
        run: |
          start=$SECONDS
          python3 scripts/upgrade_from_v040.py seed --from-version v0.5.0 --owner-db "$OWNER_DB" --state-dir "$STATE_DIR"
          echo "mssql seed_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upgrade in place with the release candidate; every in-flight run completes
        run: |
          start=$SECONDS
          python3 scripts/upgrade_from_v040.py verify --expect upgrade --owner-db "$OWNER_DB" --state-dir "$STATE_DIR" --rc-worker "$RUNNER_TEMP/cleat-worker-rc"
          echo "mssql verify_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-from-v050-mssql-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .upgrade-state/*.log
            .upgrade-state/manifest.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
