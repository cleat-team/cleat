name: Ecosystem CI
on:
  pull_request:
    # cleat#2483: `branches` filters on the PR's BASE branch, and a
    # release branch was absent -- so every PR targeting one ran none of
    # this workflow, and the release PR into main was the only gate left.
    branches: [main, develop, "release/**"]
    # Every job in this file tests an SDK, and until 2026-08-09 none of the SDK
    # source trees was listed here. The filter named cleat/, internal/, cmd/ and
    # the go module files -- so "Python SDK Integration" ran on everything
    # EXCEPT python-sdk/, "Rust SDK Integration" on everything except crates/,
    # and so on. Each job was triggered by every change but its own.
    #
    # It was silent, too: an untriggered job is absent from the PR's check list
    # rather than pending, so the PR reads as fully green with four fewer checks
    # than it should have. Caught on #432, which changes the AssemblyScript and
    # Python SDKs and ran neither of their jobs. (The AssemblyScript SDK was removed
    # by cleat#4023.)
    #
    # Only python-sdk consumes cmd/cleat; rust and java test their own tree
    # alone. GitHub filters paths per workflow, not per job, so this is the
    # union -- a Rust change runs all three. That is the cost of keeping them in
    # one file, and it is cheaper than the gap was.
    paths:
      - "cleat/**"
      - "internal/**"
      - "cmd/**"
      - "crates/**"
      - "python-sdk/**"
      - "go.mod"
      - "go.sum"
      # So a change to the filter itself is checked by the filter itself.
      - ".github/workflows/ecosystem-ci.yml"
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

# Least-privilege token, added 2026-08-07. Without a `permissions:` key a
# workflow inherits the repository default, which can be read/write for every
# scope -- so a compromised action or dependency in any job here would hold a
# writable GITHUB_TOKEN. CodeQL flagged all 4 jobs in this file
# (actions/missing-workflow-permissions). Every job here only checks out code
# and runs tests, so read is all they need; re-derive with
#
#   grep -nE 'gh (pr|issue|api)|github-script|upload-artifact|packages:|id-token' .github/workflows/ecosystem-ci.yml
#
# and widen this block, not the repository default, if that ever stops being
# true.
permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10  # max 1.2m over 60 successful runs (develop push + pull_request samples), 2026-10-27; cleat#3479
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cleat
        run: CGO_ENABLED=0 go install ./cmd/cleat
      - name: Test Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          python -m pytest -v

  rust-sdk:
    name: Rust SDK Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10  # max 1.4m over 60 successful runs (develop push + pull_request samples), 2026-10-27; cleat#3479
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Test cleat-sdk
        working-directory: crates/cleat-sdk
        run: cargo test
      - name: Test cleat-macro
        working-directory: crates/cleat-macro
        run: cargo test

  java-sdk:
    name: Java SDK Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10  # max 1.8m over 60 successful runs (develop push + pull_request samples), 2026-10-27; cleat#3479
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Java SDK
        working-directory: crates/cleat-java
        run: gradle test
