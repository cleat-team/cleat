name: Ecosystem CI
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "cleat/**"
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main, develop]

jobs:
  python-sdk:
    name: Python SDK Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cleat
        run: CGO_ENABLED=0 go install ./cmd/cleat
      - name: Test Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          python -m pytest -v

  rust-sdk:
    name: Rust SDK Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Test cleat-sdk
        working-directory: crates/cleat-sdk
        run: cargo test
      - name: Test cleat-macro
        working-directory: crates/cleat-macro
        run: cargo test

  java-sdk:
    name: Java SDK Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Test Java SDK
        working-directory: crates/cleat-java
        run: gradle test

  assemblyscript-sdk:
    name: AssemblyScript SDK Integration
    # continue-on-error removed 2026-08-07, for the same reason as ci.yml's
    # AssemblyScript WASM Build: measured on develop, its only substantive step
    # ("Test AS SDK") reported success. The flag was forgiving a job that had nothing
    # to forgive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test AS SDK
        working-directory: packages/cleat-as
        run: |
          npm ci
          npm test
