# ---------------------------------------------------------------------------
# AI PR Review — first-pass automated code review before human review
#
# Runs on every PR. Posts an advisory review as a PR comment. The AI review
# catches obvious issues so human reviewers can focus on design and intent.
#
# The review is advisory, not blocking. Contributors may address feedback
# directly or respond with rationale.
#
# Requires:
#   - ANTHROPIC_API_KEY secret configured in the repository
#   - claude CLI available in the runner (or Anthropic SDK as fallback)
# ---------------------------------------------------------------------------
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        id: diff
        run: |
          git diff origin/main...HEAD > /tmp/pr.diff
          echo "diff_lines=$(wc -l < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"

      - name: AI Review
        id: ai-review
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');

            // Truncate very large diffs
            const MAX_DIFF = 50000;
            const truncated = diff.length > MAX_DIFF
              ? diff.slice(0, MAX_DIFF) + '\n\n[... diff truncated ...]'
              : diff;

            const prompt = `You are reviewing a pull request for the cleat project (Go workflow engine with WASM runtime and PostgreSQL storage).

          Review the following git diff. Focus on:
          1. Correctness bugs — logic errors, missing error handling, nil dereferences, race conditions
          2. Security issues — SQL injection, unsafe WASM operations, missing input validation
          3. Breaking changes — API surface changes, schema changes, wire format changes
          4. Missing tests — new behavior without corresponding tests
          5. Project conventions — style violations, missed interface implementations, import issues

          Respond with a concise review in this format:

          ## AI Review

          ### Summary
          [One paragraph summarizing the change and overall assessment]

          ### Issues found
          [List each issue as a bullet with severity: 🔴 Critical / 🟡 Warning / 🔵 Note]
          - **
          [file:line] **Severity** — Description. Suggestion if applicable.

          ### Unchecked
          [List anything the diff doesn't show that a human reviewer should verify]

          Keep it concise. No praise, no greeting, no closing — just findings. Skip if the diff is empty or contains only docs.`;

            // Call Anthropic API
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': '${{ secrets.ANTHROPIC_API_KEY }}',
                'anthropic-version': '2023-06-01',
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-6',
                max_tokens: 2000,
                messages: [{
                  role: 'user',
                  content: prompt + '\n\nHere is the diff to review:\n\n```diff\n' + truncated + '\n```'
                }]
              })
            });

            if (!response.ok) {
              const err = await response.text();
              console.error('Anthropic API error:', err);
              // Don't fail the build — AI review is advisory
              const fallback = `## AI Review\n\nAI review unavailable (API error). A human reviewer must review this PR.\n\n<sub>AI review failed: ${response.status}</sub>`;
              core.setOutput('review_body', fallback);
              core.setOutput('review_status', 'error');
              return;
            }

            const result = await response.json();
            const reviewBody = result.content[0].text;

            core.setOutput('review_body', reviewBody);
            core.setOutput('review_status', 'success');

      - name: Post review comment
        if: steps.ai-review.outputs.review_status != 'skipped'
        uses: actions/github-script@v8
        with:
          script: |
            const body = `${{ steps.ai-review.outputs.review_body }}`
              .replace(/\\n/g, '\n')
              .replace(/\\"/g, '"');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Update existing AI review comment or create new one
            const existingComment = comments.find(c =>
              c.body.startsWith('## AI Review') &&
              c.user.login === 'github-actions[bot]'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
