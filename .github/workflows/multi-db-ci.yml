# ---------------------------------------------------------------------------
# Multi-Database CI — WorkflowStore test suite against MySQL and SQL Server
#
# This workflow runs the WorkflowStore test suite (engine/...) against
# MySQL and SQL Server backends using service containers. It does not run the
# full CI suite — only the database-specific tests that are skipped when those
# backends are unavailable.
#
# It also runs the plugin migration smoke test against all three backends
# (PostgreSQL, MySQL, SQL Server) in a single job with all service containers.
#
# Backend detection (in Go tests):
#   CLEAT_TEST_POSTGRES — PostgreSQL connection string (fallback CLEAT_TEST_DB)
#   CLEAT_TEST_MYSQL    — MySQL connection string
#   CLEAT_TEST_MSSQL    — SQL Server connection string
#
# `Test MySQL` and `Test SQL Server` became required status checks on develop on
# 2026-08-07. Re-derive:
#
#   gh api repos/cleat-team/cleat/branches/develop/protection/required_status_checks \
#     --jq '.contexts[]' | grep -E 'MySQL|SQL Server'
#
# They had run on every PR since they were written and gated none of them. That
# is not the same as MySQL and SQL Server being unmeasured -- `Tier 1 Gate` and
# `Tier 2 Gate` are required and both run all three dialects -- but a failure
# named `Test SQL Server` says what broke, and the same failure inside a tier
# gate says a tier is red. This workflow's history at the time: 51 success,
# 2 failure, 7 cancelled over the last 60 runs. Neither failure was
# infrastructure -- one was a work-in-progress fix branch, the other is the
# timing assertion described below. Re-derive:
#
#   gh run list --workflow=multi-db-ci.yml --limit 60 \
#     --json conclusion,status --jq '[.[] | select(.status=="completed")] |
#     group_by(.conclusion) | map({conclusion: .[0].conclusion, n: length})'
#
# That second failure was a wall-clock-dependent assertion in
# TestConcurrencyKeyTTLKeepsSubSecondPrecision, not a defect in SQL Server
# support; it was fixed in #374 before these became required, because a required
# check that fails on a slow runner teaches everyone to re-run it.
#
# The push trigger covers main and develop only. It carried "feature/**" until
# 2026-08-07, which ran all three jobs a second time on every push to a feature
# branch that already had a PR open -- the pull_request trigger covers those, and
# the concurrency group keys on github.ref, which differs between the two events
# and so does not dedupe them. Measured before the change: 17 of the last 200
# runs were feature-branch pushes, at 200s + 216s + 95s of runner time apiece,
# each with its own MySQL and SQL Server service containers. Re-derive:
#
#   gh run list --workflow=multi-db-ci.yml --limit 200 --json event,headBranch \
#     --jq '[.[] | select(.event=="push" and (.headBranch|startswith("feature/")))] | length'
#
# The cost this trades away is pre-PR signal on a feature branch with no PR open
# yet -- accepted by the owner on 2026-08-07, on the same grounds as #372, which
# removed the identical trigger from e2e-cross-language.yml. The grounds are
# stronger here: two of these jobs now block a merge, so the run that matters is
# the pull_request one.
#
# `Plugin Migrations`, the third job here, is deliberately NOT required -- see
# the note above that job.
#
# Both jobs Fatal rather than skip when their database is unreachable
# (engine/testutil's MySQLTestDB and MSSQLTestDB ping and t.Fatalf), so a
# service container that fails to come up reads as a failure and not as a green
# that measured nothing. That is the property that makes requiring them worth
# anything; if either helper is ever changed to skip on a failed ping, these
# should stop being required on the same day.
# ---------------------------------------------------------------------------
name: Multi-DB CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # cleat#2483: `branches` filters on the PR's BASE branch, and a
    # release branch was absent -- so every PR targeting one ran none of
    # this workflow, and the release PR into main was the only gate left.
    branches: [main, develop, "release/**"]
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. EVERY required context on develop has to
  # report here. The list is tiers.yaml's `required_contexts` block; the count
  # is deliberately not repeated here, because it was -- in nine workflow files
  # at once -- and all nine said 32 while develop required 33 (cleat#1937).
  merge_group:
concurrency:
  # Every push gets its own group; PR runs share one per ref and supersede.
  #
  # `github.ref` is refs/heads/develop for EVERY merge, so keying the group on
  # it puts consecutive merges in one group. That discards a merge's own
  # verification, and `cancelled` is not `success` -- nothing downstream reads
  # it as a failure, so it disappears silently.
  #
  # `cancel-in-progress: false` is NOT enough to prevent that, which is the
  # part the first fix (#634) got wrong. It stops a *running* run being killed,
  # but GitHub still allows only one pending run per group: when a third push
  # enters an occupied group, the one waiting is cancelled before it ever
  # starts. Measured on develop after #634 merged (18:20:48Z on 2026-09-03),
  # 5 of 24 `Tier 1 Gate` push runs were cancelled -- every one with **zero
  # jobs**, killed within seconds of the next merge landing.
  #
  # The job count separates the two mechanisms, and does it cleanly. Of the 22
  # cancelled gate runs that day, the 17 before #634 have jobs=1 (killed
  # mid-run) with a single jobs=0 exception, and all 5 after it have jobs=0:
  #
  #   gh run view <cancelled-id> --json jobs --jq '.jobs | length'   # 0
  #   gh run view <success-id>   --json jobs --jq '.jobs | length'   # 1
  #
  # So #634 did exactly what it claimed and no more. The gate takes 20-40
  # minutes and merges land minutes apart, so the queue is almost always
  # occupied. Keying push runs on `github.sha` gives each merge a group of its
  # own: never queued, so never superseded.
  #
  # On a pull_request the group stays per-ref and cancellation is the setting's
  # real purpose: pushing twice to a branch should not run the suite twice.
  #
  # `scripts/check-workflow-concurrency.sh` guards both halves.
  # A BODY EDIT MUST NOT SUPERSEDE THE RUN IT RACES (cleat#1688).
  #
  # `edited` is subscribed above because a BASE CHANGE fires it and nothing
  # else does -- but it also fires for a title or body edit, and `github.ref`
  # is identical for every pull_request activity type. The edited run therefore
  # landed in this group and cancelled the synchronize run it followed, and a
  # superseded run renders as a failure rather than as "replaced".
  #
  # `github.run_id` is unique per run, so a no-op edited run shares a group
  # with nothing and cancels nothing. An `edited` that DID change the base
  # keeps the per-ref group: that is a real re-evaluation against a different
  # target and should supersede, which is why the activity type exists here.
  #
  # ONE LINE ON PURPOSE: check-workflow-concurrency.sh reads the single line
  # matching `^\s*group:` and looks for github.sha/run_id/ref in it. A folded
  # `>-` scalar hides the expression and the guard reports a false alarm.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' && !github.event.changes.base && github.run_id || github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CGO is load-bearing here, not incidental. Every step in this file used to run
# `CGO_ENABLED=0 go test`, which does not merely skip a check: `NewWasmtimeBackend`
# is behind `//go:build cgo`, so disabling CGO leaves the binary with NO WASM backend
# at all -- `cleat-worker` logs "wasmtime is the only WASM backend cleat has, there is
# no fallback" and exits 1, and engine tests fail rather than degrading quietly.
#
# This comment read "silently runs everything on wazero, the fallback with the known
# bug tail" until 2026-09-06. That was true when written and stopped being true when
# #459 (2026-08-10) deleted the wazero backend. It is worth correcting rather than
# leaving as a period detail, because it understates the reason for the pin: the risk
# is not a degraded run, it is no backend.
#
# Measured on 2026-08-04: `go test -list` reports 2401 tests in ./engine/ with
# CGO_ENABLED=0 against 2557 with CGO on. The 156-test difference is the entire
# TestClosure_* family -- the real WASM host-function execution paths -- plus 28
# wasmtime-specific tests. A workflow whose whole purpose is validating MySQL and
# SQL Server under workflow execution was compiling those tests out.
#
# Set explicitly rather than left to default. Go's default is 1 only when a C
# compiler is present and 0 otherwise, so the default silently reintroduces exactly
# the failure mode above on a runner without gcc. Pinned to 1, that case fails loudly.
env:
  CGO_ENABLED: 1

# Least-privilege token, added 2026-08-07. Without a `permissions:` key a
# workflow inherits the repository default, which can be read/write for every
# scope -- so a compromised action or dependency in any job here would hold a
# writable GITHUB_TOKEN. CodeQL flagged all 3 jobs in this file
# (actions/missing-workflow-permissions). Every job here only checks out code
# and runs tests, so read is all they need; re-derive with
#
#   grep -nE 'gh (pr|issue|api)|github-script|upload-artifact|packages:|id-token' .github/workflows/multi-db-ci.yml
#
# and widen this block, not the repository default, if that ever stops being
# true.
permissions:
  contents: read

# ===========================================================================
# JOBS
# ===========================================================================
jobs:
  # -------------------------------------------------------------------------
  # Test MySQL backend
  # -------------------------------------------------------------------------
  test-mysql:
    name: Test MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 60s
          --publish 3306:3306
    env:
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Java and Gradle, in a job about databases, because `./engine/...`
      # below is unfiltered and TestJavaWorkflowExecute lives in ./engine.
      #
      # It did not used to run here. It skipped unconditionally on a missing
      # toolchain until that skip was removed (#347), and ubuntu-latest ships
      # a gradle on PATH -- so the test went from never running to running in
      # every job that sweeps ./engine/..., none of which had ever set up
      # Java. This job and test-mssql are two of them. Each then resolved
      # org.teavm:* from Maven Central cold, on every push, and Maven Central
      # answered:
      #
      #   Could not GET '.../teavm-gradle-plugin-0.10.2.pom'.
      #   Received status code 429 from server: Too Many Requests
      #
      # Same defect #352 fixed in plugin-harness-ci.yml's Layer 2, in the two
      # jobs nobody thought to look at, because their names say MySQL and SQL
      # Server. Un-skipping a test changes which jobs pay for its toolchain,
      # and `./engine/...` is how it spreads -- so the fix belongs everywhere
      # that pattern appears, not only where the workflow name mentions the
      # language.
      #
      # test-plugin-migrations, the third job in this file, does not need it:
      # it filters with `-run TestPluginMigrations` and `-run MultiBackend`,
      # neither of which matches.
      #
      # setup-gradle restores ~/.gradle/caches and ~/.gradle/wrapper/dists.
      # Both matter: tests/plugin-harness/testdata/javaworkflow ships a
      # gradlew pinned to 7.6.4 and cmd/cleat/build_java.go prefers the
      # wrapper, so a cold run fetches the Gradle distribution as well as
      # every TeaVM artifact.
      #
      # This does not make a cold run immune -- a cache miss still resolves
      # from Maven Central and Gradle does not retry a 429. It takes the
      # request off the common path. The redundancy is real and deliberate for
      # now: e2e-cross-language.yml already covers the Java e2e and these two
      # jobs pay ~30s each to cover it again. Narrowing the -run pattern here
      # is the other fix, and it would also stop these jobs covering the rest
      # of ./engine against a real database, which is their whole point.
      #
      # Java 17 to match the five other jobs that build this SDK, rather than
      # inheriting the runner image's default, which can change without us.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ./migration/... alongside ./engine/...: this is the only job with a
      # live MySQL, and until IMPROVEMENT-PLAN 3.13 nothing anywhere had ever
      # applied migrations/mysql/*.sql. The Runner could not parse its own
      # shipped files, so no worker could bootstrap a MySQL schema, and every
      # MySQL test path built its schema from engine/testutil's Go copy
      # instead -- which is why nothing noticed. The regression test for that
      # lives in ./migration/ and needs a real MySQL to mean anything.
      #
      # -p 1 is retained, but NOT for the reason recorded here until
      # 2026-08-31. That reason -- "three database-backed packages, engine,
      # engine/testutil and migration, against one database" -- is not true of
      # this job, and the "3 failures in 8 runs" figure beside it cannot have
      # been measured here: engine/testutil has no MySQL test at all to
      # collide with. It was a PostgreSQL measurement (see ci.yml's engine
      # entry) copied across.
      #
      # What is actually true of MySQL and SQL Server, measured 2026-08-31:
      # engine/testutil's DB-backed tests are all PostgreSQL and skip in a job
      # with no PostgreSQL, and every MySQL and SQL Server test under
      # ./migration/ creates a scratch database of its own (newMySQLScratchDB,
      # newMSSQLScratchDB) and drops it in cleanup. `engine` is the only
      # package that touches the shared `cleat` database here, so there is no
      # cross-package collision for -p 1 to prevent.
      #
      # Probed directly rather than read: a sentinel row inserted into
      # cleat.workflow_defs on MySQL 8.4 survived
      # `go test ./engine/testutil/... ./migration/...` with CLEAT_TEST_MYSQL
      # set, and no scratch database was left behind.
      #
      # It stays because removing it buys nothing measurable -- ./migration/
      # runs in ~2s against ./engine/...'s minutes -- and dropping a
      # serialisation on a required check deserves a better reason than
      # tidiness. engine/testutil's TestBlanketNonPostgresCleanupHasOneCaller
      # fails if a second package starts wiping these databases, which is the
      # condition that would make -p 1 load-bearing. Change this comment when
      # it does.
      # -json, tee'd to a report rather than piped through -v: cleat#2444. This
      # is the only job that runs with exactly one non-PostgreSQL DSN set, so a
      # dialect-gated test that starts SKIPPING here (rather than running)
      # previously had nothing to notice -- `ok …/engine` prints identically
      # either way. set -o pipefail is required: without it, tee supplies the
      # exit status and a failing go test is reported as a green step.
      - name: Run tests
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout=900s -json ./engine/... ./migration/... 2>&1 | tee test-report.json

      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh multi-db/mysql test-report.json

  # -------------------------------------------------------------------------
  # Test SQL Server backend
  # -------------------------------------------------------------------------
  test-mssql:
    name: Test SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        # Pinned by digest 2026-08-07; `2022-latest` is a moving tag and this is
        # a required check. Full rationale, the re-derive commands, and why the
        # `ancestor=` filters had to move with it: tier1-gate.yml's mssql
        # service. Bump all six sites together or `Lint` fails the PR.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
          # SQL Server on Linux sizes its buffer pool to 80% of VISIBLE host
          # memory by default, with no awareness it shares a runner with
          # Postgres, MySQL and everything else in this job (cleat#2101).
          # 2048 is comfortably above what the tier1/multi-db fixtures need
          # and caps the worst case where several mssql services land on one
          # runner at once. Bump all six sites together, per the note above.
          MSSQL_MEMORY_LIMIT_MB: "2048"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433
    env:
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@localhost:1433?database=cleat
      # cleat#982: arm the row-disappearance audit (a test-only AFTER DELETE
      # trigger on workflow_instances) so a recurrence reports WHO deleted a
      # missing row instead of only that it is gone. No-op for every dialect
      # except SQL Server; see engine/testutil/mssql_row_disappearance.go.
      CLEAT_TEST_MSSQL_ROW_AUDIT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Create cleat database
        run: |
          docker exec $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89") /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C -Q "CREATE DATABASE cleat"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The second of the two jobs that sweep ./engine/... unfiltered, so the
      # same Java toolchain and the same Gradle cache. See the long note in
      # test-mysql above for why a SQL Server job builds a Java WASM
      # component at all.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # cleat#2438. The generated MSSQL baseline is a claim about the PROCESS
      # -- "these three files are what the emitter produces" -- and until this
      # step nothing checked it of the ARTIFACT, so a hand-edit to
      # 001_schema.sql or 003_procedures.sql would have gone unnoticed while
      # two guards in engine/ rested on the claim.
      #
      # -mode=verify builds a database from the committed migrations,
      # regenerates the baseline from it, and requires the result to be
      # byte-identical, naming the first differing line. It regenerates from
      # the sys.* catalogue, so it needs a live server -- which is why it lives
      # in this job rather than in the Lint job, and it adds no new service.
      #
      # ITS OWN EMPTY DATABASE, and this is not tidiness: verify BUILDS into the
      # database it is given, so pointing it at `cleat` would compare the
      # emitter's output for one database against the committed baseline for a
      # different one and report a difference that means nothing.
      #
      # The full acceptance -- A from the pre-compaction chain, B from these
      # files, catalogdiff plus the known-positive battery -- cannot run here:
      # its A side exists only in git history and this job checks out at
      # fetch-depth 1. That stays a documented operator procedure, like
      # scripts/gen-postgres-baseline.py. This step is the half that can be
      # enforced on every run.
      - name: Verify the committed MSSQL baseline is a fresh emit
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89")
          docker exec "$CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C \
            -Q "CREATE DATABASE cleat_baseline_verify"
          # No -migrations: verify builds from the three baseline files by
          # name, so a later numbered migration (the first 004_*.sql) cannot be
          # folded into the regenerated 001 and fail this on a correct tree.
          go run ./scripts/gen-mssql-baseline -mode=verify \
            -dsn 'sqlserver://sa:CleatTest123!@localhost:1433?database=cleat_baseline_verify' \
            -committed migrations/mssql

      # ./migration/... alongside ./engine/...: this is the only job with a
      # live SQL Server, and the migration tests that assert the shipped
      # .sql files can actually be applied (IMPROVEMENT-PLAN 3.10's upgrade
      # path, 3.13) need a real server to mean anything.
      #
      # -p 1 is retained, but NOT for the reason recorded here until
      # 2026-08-31 -- see the long note in test-mysql above, which applies
      # unchanged. `engine` is the only package in this invocation that
      # touches the shared `cleat` database: engine/testutil's DB-backed tests
      # are all PostgreSQL, and ./migration/'s SQL Server tests each create
      # and drop a scratch database (newMSSQLScratchDB, and the fixed
      # cleat_migration_admin_role_test).
      #
      # The equivalent of the MySQL sentinel probe was NOT run for SQL Server:
      # mcr.microsoft.com/mssql/server:2022-latest does not start under QEMU
      # on an arm64 Mac ("Invalid mapping of address ... in reserved address
      # space"), and azure-sql-edge, which does, cannot apply the shipped
      # migrations (011_json_scalar_payloads.sql needs isjson). The claim here
      # rests on the call sites plus this job, not on a local measurement.
      # Same treatment as test-mysql above, cleat#2444: this job runs with
      # exactly one non-PostgreSQL DSN set, so a dialect-gated test flipping
      # from running to skipping here was invisible until this budget step.
      - name: Run tests
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout=900s -json ./engine/... ./migration/... 2>&1 | tee test-report.json

      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh multi-db/mssql test-report.json

  # -------------------------------------------------------------------------
  # Plugin migration smoke test (all three backends)
  #
  # Runs TestPluginMigrations_AllDialects (and any other
  # TestPluginMigrations* tests) against PostgreSQL, MySQL, and SQL Server
  # simultaneously. All three service containers are started and all three
  # connection-string env vars are set, so the test can exercise every
  # backend in a single invocation.
  #
  # Unlike the per-backend jobs above (test-mysql, test-mssql), this job
  # does NOT run the full WorkflowStore suite — only plugin migration tests.
  #
  # NOT A REQUIRED CHECK: Plugin Migrations
# The two above are required, as of 2026-08-07. The
  # asymmetry is deliberate. Both of this job's steps are already gated
  # elsewhere on all three dialects: TestPluginMigrations lives in ./engine/,
  # a tier-1 package that the required `Tier 2 Gate`'s sibling `Tier 1 Gate`
  # sweeps with all three DSNs set and no matching entry in tiers.yaml's
  # exclude_tests, and ./plugins/... is a tier-2 package under `Tier 2 Gate`.
  # Requiring this job would gate the same assertions a second time.
  #
  # What test-mysql and test-mssql add over the tier gates is different: they run
  # with only ONE dialect's DSN set, which is the configuration a single-backend
  # deployment actually has. This job sets all three, exactly as the gates do.
  #
  # RUNS ONLY ON merge_group, as of cleat#2852. Since it isn't required and
  # both halves are already gated elsewhere on `pull_request`, running it on
  # every PR only pays the runtime cost a second time. It still has to run on
  # the queue ref: Tier 1 Gate is report-only in the merge queue, so this job
  # is what actually enforces the ./engine/ half there. The cost: a PR whose
  # Plugin Migrations would fail now finds out in the queue instead of on its
  # own head, i.e. a group rebuild instead of a red PR -- the same trade this
  # job's own asymmetry above already accepts for keeping test-mysql/
  # test-mssql required instead of folding into the tier gates.
  # -------------------------------------------------------------------------
  test-plugin-migrations:
    name: Plugin Migrations
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        # Required, and the only service here that was missing it. A job
        # running directly on the runner does not share the service
        # network, so without a published port the container is simply
        # unreachable. The mysql and mssql services below already
        # --publish in their options; postgres did not, so every
        # postgres subtest in this workflow skipped itself and the job
        # reported green without ever connecting.
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 60s
          --publish 3306:3306
      mssql:
        # Pinned by digest 2026-08-07; `2022-latest` is a moving tag and this is
        # a required check. Full rationale, the re-derive commands, and why the
        # `ancestor=` filters had to move with it: tier1-gate.yml's mssql
        # service. Bump all six sites together or `Lint` fails the PR.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
          # SQL Server on Linux sizes its buffer pool to 80% of VISIBLE host
          # memory by default, with no awareness it shares a runner with
          # Postgres, MySQL and everything else in this job (cleat#2101).
          # 2048 is comfortably above what the tier1/multi-db fixtures need
          # and caps the worst case where several mssql services land on one
          # runner at once. Bump all six sites together, per the note above.
          MSSQL_MEMORY_LIMIT_MB: "2048"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
          --publish 1433:1433
    env:
      CLEAT_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@127.0.0.1:1433?database=cleat
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The committed PostgreSQL baseline is a claim about the PROCESS -- "these
      # three files are exactly what the generator produces" -- and until this step
      # nothing checked it of the ARTIFACT. Two guards in engine/ were narrowed on
      # the strength of that claim, so a hand-edit to 001_schema.sql or
      # 003_procedures.sql would have gone unnoticed while they rested on it.
      #
      # NOT SHAPED LIKE THE MSSQL MODE, and it cannot be. The MSSQL emitter is a pure
      # function from the live catalogue to the files, so it is a fixed point of its
      # own input and self-application verifies it. gen-postgres-baseline.py is a
      # one-shot transform from a dump of the PRE-REBASELINE chain -- regenerating
      # from its own output is not defined and fails at the partition anchor. So this
      # checks the artifact against the tree it claims to come from.
      #
      # --prior-rebaseline IS THE PROVENANCE PIN: the commit whose chain produced the
      # committed baseline. It moves when, and only when, the baseline is regenerated
      # from a different tree. The mode prints it in full on every run, including a
      # passing one, so the evidence says what it was measured against. It must be a
      # FULL 40-char SHA: `git fetch --depth 1 origin 8f91b43a` fails with
      # `couldn't find remote ref` -- an exact-string miss, not a prefix resolve.
      # The mode fetches it itself (~3s, 18M); the job's shallow checkout is fine.
      #
      # FIRST IN THE JOB, and for PostgreSQL that is load-bearing rather than tidy:
      # the baseline creates cluster-wide ROLES (cleat_app, cleat_sweep,
      # cleat_dispatcher, and the cleat_tenant_% loop), and a scratch DATABASE does
      # not isolate those. A test step that ran first would leave a cluster this
      # check then reads. SQL Server has no equivalent exposure -- its roles are
      # database-scoped -- which is why the MSSQL mode has no ordering requirement.
      # Do not move this below the test steps.
      #
      # It needs the SERVER, not the test selection: this job is chosen because it
      # is the one with a PostgreSQL service, and the step adds no new service. It
      # creates its own database because the mode asserts the target is empty -- it
      # BUILDS INTO whatever it is given, so pointing it at `cleat` would compare
      # one database's output against another database's baseline.
      #
      # The container is found by PUBLISHED PORT, not by image digest. The digest is
      # already pinned in six places that Lint requires to move together; a seventh
      # here would be a site nothing checks, and it would break on the next bump.
      - name: Verify the committed PostgreSQL baseline is a fresh emit
        run: |
          CONTAINER=$(docker ps -q --filter "publish=5432")
          test -n "$CONTAINER" || { echo "no container publishing 5432"; exit 1; }
          docker exec "$CONTAINER" psql -U postgres -c "CREATE DATABASE cleat_baseline_verify"
          python3 scripts/verify-postgres-baseline.py \
            --dsn 'postgres://postgres:postgres@127.0.0.1:5432/cleat_baseline_verify?sslmode=disable' \
            --pg-container "$CONTAINER" \
            --prior-rebaseline 8f91b43a8e2259332c5bdbd2c47db15261927d10 \
            --committed migrations/postgres

      - name: Create cleat database on MSSQL
        run: |
          docker exec $(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89" -q) /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C -Q "CREATE DATABASE cleat"

      - name: Run plugin migration tests
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout=600s -json -run TestPluginMigrations ./engine/... 2>&1 | tee migration-test-report.json

      # cleat#2444: this job sets all three DSNs, so a passing budget here
      # means the filtered step above genuinely exercised every dialect
      # rather than a dialect's arm quietly skipping under an unfiltered "ok".
      - name: Skip budget (plugin migration tests)
        if: always()
        run: scripts/check-skip-budget.sh multi-db/plugin-migrations migration-test-report.json

      # Unfiltered, and -p 1. cleat#1203.
      #
      # This step ran `-run 'MultiBackend'` until 2026-09-10, which made the
      # job's coverage a naming convention rather than a scope. Six
      # `*_dialect_arms_multidb_test.go` entry points do not carry the
      # substring, so the only job with MySQL and SQL Server DSNs did not
      # select them, and the tests built to execute every dialect arm on a
      # real server of that dialect had only ever run on PostgreSQL.
      #
      # Dropping the filter rather than renaming the six ends the class: an
      # unmatched -run is not an error, so the next badly-named test would be
      # just as invisible. Measured 2026-09-10 with all three DSNs set, one
      # tree, one flag varied: filtered 13s, unfiltered with -p 1 31s, against
      # this step's 900s timeout.
      #
      # -p 1 is not optional once the filter is gone. testutil's
      # CleanupPostgresTestData issues an unqualified DELETE FROM over a list
      # that includes workflow_instances, so database-backed packages running
      # concurrently against one server delete each other's fixtures mid-test.
      # That serialisation is part of the 31s above, not an addition to it.
      - name: Run plugin behavioral tests (all backends)
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout=900s -json ./plugins/... 2>&1 | tee plugins-test-report.json

      # cleat#2444: this is the step the issue is about -- "ok …/plugins/
      # eventtriggers" prints identically whether a dialect-gated test ran or
      # skipped, and this unfiltered sweep is the ONLY place any plugin
      # package's MySQL and SQL Server arms execute at all (ci.yml's
      # test-go/plugins job sets CLEAT_TEST_DB for PostgreSQL only, no MySQL
      # or SQL Server DSN). The per-package -v step below is a convenience
      # once this exists, not the only evidence.
      - name: Skip budget (plugin behavioral tests)
        if: always()
        run: scripts/check-skip-budget.sh multi-db/plugins plugins-test-report.json

      # A NARROW, ADDITIONAL step -- not a replacement for the unfiltered run
      # above, which stays unfiltered for exactly the reason cleat#1203 gives
      # it. This one exists only so the log can show what the step above
      # cannot: "ok …/plugins/eventtriggers" prints identically whether a
      # test RAN or SKIPPED, so a green step there is not evidence the
      # dialect-gated tests cleat#2645 added actually exercised MySQL and SQL
      # Server rather than testutil.TestDB skipping them cleanly
      # (cleat-review's finding on that PR). -v makes each subtest's
      # RUN/PASS/SKIP its own line. Scoped to one package and one -run
      # pattern, so it re-runs in seconds and cannot hide a badly-named test
      # the way the removed job-wide filter did -- it adds visibility for
      # these specific tests, it does not stand in for the step above.
      #
      # cleat#2669 (cleat-review, reviewing #2675): the pattern was
      # '^TestAwaitEvent', which does not match TestVersion7ReplacesThe...,
      # TestClaimQueryPlanExcludesProcessedRowsOnPostgres or
      # TestClaimQueryIsSargableOnProcessedOnMySQL -- three tests added to
      # prove the same "ran vs skipped, both print ok" gap this step exists
      # to close, invisible to the one step that exists to close it. Widened
      # rather than renamed, because a second badly-matched pattern is the
      # same failure mode this step's own history already has one instance
      # of.
      #
      # cleat#2649: widened again, for TestClaimOrRegisterAwaiterSkippingBeforeCommitLosesCleat2654IsRealFinding
      # -- MSSQL-only, no subtests, the same shape as
      # TestAwaitEventMarshalFailureLeavesEventUnconsumed (which the
      # original pattern already covered by prefix coincidence, not by
      # deliberate inclusion), and exactly the "ran vs skipped, both print
      # ok" ambiguity this step exists to close.
      #
      # cleat#2697 (cleat-review): widened again, and the PACKAGE SET too --
      # for TestACorrelationKeyFieldMismatchIsRefused, in plugins/webhookingest,
      # not plugins/eventtriggers. Adding a package changes what an unqualified
      # pattern can match, so the pattern was re-checked against BOTH packages
      # together, not just re-checked in isolation and assumed to still be
      # scoped the same way. Re-derive what a pattern selects before trusting
      # it, and re-derive it against the exact package list this step uses:
      #   go test ./plugins/eventtriggers/... ./plugins/webhookingest/... -list \
      #     '^Test(AwaitEvent|ClaimQuery|Version7|ClaimOrRegisterAwaiter|ACorrelationKeyFieldMismatch)'
      - name: Verify the oldest-first and lock claim tests ran (not skipped) per dialect
        run: go test -count=1 -v -run '^Test(AwaitEvent|ClaimQuery|Version7|ClaimOrRegisterAwaiter|ACorrelationKeyFieldMismatch)' ./plugins/eventtriggers/... ./plugins/webhookingest/...

  # -------------------------------------------------------------------------
  # Crash shutdown scenarios on MySQL and SQL Server (cleat#2288)
  #
  # tests/crash is the only suite in this repo that runs the real cleat-worker
  # binary and signals it, and it ran on PostgreSQL only: the crash matrix entry
  # in ci.yml sets CLEAT_CRASH_DB and nothing else, and `grep '"--driver"'`
  # matched nothing anywhere in the tree before this job. So the shutdown path
  # cleat#2285 fixed -- drain, then release the run rather than fail it -- was
  # measured on one dialect, while the code it exercises (fenced finalize,
  # ContinueAsNew, fail, release) is per-dialect.
  #
  # Two scenarios, (a) and (b): a run that finishes inside the grace and repeats
  # no side effect, and a call that outlives the grace and is released for
  # another worker. The suite's other scenarios stay PostgreSQL-only -- they are
  # not what cleat#2288 asked for, and each would be its own dialect port.
  #
  # NOT A REQUIRED CHECK: Crash Shutdown Scenarios (MySQL, SQL Server)
# By owner decision on 2026-09-25. It runs and it
  # reports; it does not gate a merge. Promoting it is three changes that have
  # to land together: this job's `name:` into .github/required-checks.txt,
  # tiers.yaml's required_contexts block, and branch protection.
  #
  # Unlike its siblings above, this job has no "Create cleat database" step for
  # SQL Server and does not need one: the harness connects to `master` to create
  # its own database beside the one the DSN names, exactly as the PostgreSQL
  # side creates cleat_crash. MySQL's service below still needs MYSQL_DATABASE,
  # because that harness connection does use the database named in the DSN.
  #
  # The service containers mirror test-mysql and test-mssql above, digests
  # included. Bump them together with the other sites or `Lint` fails the PR.
  crash-shutdown-dialects:
    name: Crash Shutdown Scenarios (MySQL, SQL Server)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --publish 3306:3306
      mssql:
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
          MSSQL_MEMORY_LIMIT_MB: "2048"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433
    env:
      # 127.0.0.1, not localhost: a service container publishes its port on IPv4
      # only, and localhost resolves to ::1 first on GitHub runners. The same
      # note, and the green-that-measured-nothing it was written after, are in
      # ci.yml's test-go job.
      CLEAT_CRASH_MYSQL: "root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true&multiStatements=true"
      CLEAT_CRASH_MSSQL: "sqlserver://sa:CleatTest123!@127.0.0.1:1433?database=cleat"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CGO stays at its default (on). The harness builds cleat-worker itself,
      # and CGO_ENABLED=0 would replace NewWasmtimeBackend with the stub and
      # leave no WASM backend to run the fixture on -- a crash-recovery result
      # obtained that way would not be about the engine that ships.
      #
      # The -run filter is load-bearing: every other test in this package needs
      # CLEAT_CRASH_DB and Fatals without it, deliberately. It selects the
      # parent and its four dialect subtests; re-derive with -list.
      - name: Run the shutdown scenarios on MySQL and SQL Server
        run: |
          set -o pipefail
          go test -count=1 -timeout=900s -json ./tests/crash/ -run TestShutdownScenariosOnMySQLAndMSSQL 2>&1 | tee test-report.json

      # cleat#2444: both dialect DSNs are set here (CLEAT_CRASH_MYSQL,
      # CLEAT_CRASH_MSSQL), so the four selected subtests should never skip in
      # this job -- unlike test-go/crash's ledger entry for the SAME test
      # names in ci.yml's PostgreSQL-only crash matrix, where all four skip by
      # design. Budgeted at 0 here for exactly that reason.
      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh multi-db/crash-shutdown test-report.json
