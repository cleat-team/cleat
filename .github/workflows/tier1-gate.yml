# ---------------------------------------------------------------------------
# Tier 1 Gate
#
# Runs scripts/tier-gate.sh, which enforces tiers.yaml's tier-1 contract:
# must pass, on every dialect named there, and a skip is a failure.
#
# This is the job that turns tier 1 from a claim into a property. tiers.yaml's
# own header said so: "Nothing enforces this file until scripts/tier-gate.sh is
# wired into CI as a required check. Until then a tier here is a claim about
# what we intend to hold ourselves to, not a claim that anything is checking."
#
# Deliberately strict, and the strictness is the point:
#   - no continue-on-error. A tier-1 failure blocks.
#   - no known-failure list. Tier 1 has none by definition.
#   - the gate refuses to run at all when a precondition is missing, rather
#     than running and reporting a green that measured nothing. An unset DSN
#     takes ./engine/ from 3846 tests to 2544 and still prints "ok"; that
#     asymmetry is the whole reason this file exists.
#
# SHARDED (cleat#2081). One job running ./engine/...'s ~3500 top-level tests
# plus the rest of tier 1 took long enough that speeding it up mattered more
# than the modest coverage risk of running each shard's DB services
# separately. The split:
#
#   tier1-coverage   no DB, no toolchain: confirms the two engine buckets
#                    below union to exactly the full ./engine/... test list,
#                    via `go test -list` (never runs a test). Gates the three
#                    expensive jobs so a broken partition fails in seconds,
#                    not after burning DB-service minutes on bad shards.
#   tier1-engine     matrix of 2: ./engine/..., split by a stable hash of
#                    test name (scripts/tier-gate.sh --shard I/3). Each leg
#                    gets the full dialect + Python precondition set, because
#                    engine/python_wasm_e2e_test.go lives here.
#   tier1-rest       every other tier-1 package plus the cleat module,
#                    unsharded (--shard 3/3). Deliberately still the buggy
#                    8-of-12 package extraction (cleat#2085): this PR shards
#                    what tier-gate already runs, and does not change what
#                    that is. tests/crash's own instance (postgres-crash,
#                    5433) is provisioned here exactly as the old single job
#                    provisioned it -- unused today for the same reason (D2085),
#                    kept so nothing regresses and so it is already wired for
#                    whenever that extraction is fixed.
#   tier1            the aggregator. Named exactly "Tier 1 Gate" -- the
#                    required status context -- so branches/develop/protection
#                    needs no edit. `if: always()` and an explicit check of
#                    every dependency's result, rather than relying on
#                    "skipped" semantics: CLAUDE.md's own record of a
#                    condition that never decides anything is the reason this
#                    is spelled out instead of assumed.
#
# What each DB-backed job must provide, and why each one is here rather than
# optional:
#
#   postgres 5432    tier1.dialects
#   mysql    3306    tier1.dialects
#   mssql    1433    tier1.dialects
#   postgres 5433    ./tests/crash/... is a tier-1 package and uses none of the
#   (tier1-rest      CLEAT_TEST_* DSNs. It reads CLEAT_CRASH_DB, derives an
#    only)           unprivileged cleat_app role from it, and applies the
#                    shipped migrations itself. Its tests Fatal rather than
#                    skip when it is unreachable -- moot while cleat#2085
#                    keeps it out of the extracted package list, kept
#                    provisioned regardless (see above).
#   componentize-py  tier1.languages includes python (D2). Both it and
#   wasm-tools       wasm-tools are checked independently by the gate, because
#                    installing only the first leaves the engine tests skipping
#                    with a different message. Needed on every DB-backed shard:
#                    Python-using tests live in wasm/, cmd/cleat-worker/ and
#                    cmd/cleat/ as well as engine/.
#
# What these jobs deliberately do NOT provide: Rust, Node, a JDK or Gradle.
# Those are tier-2 languages, and D5 decided the gate filters their tests out
# rather than provisioning their toolchains -- see the note above
# tier1.exclude_tests in tiers.yaml. The short version is that tier 1's
# contract makes every registry it depends on a release blocker, and on
# 2026-08-06 alone Maven Central answered 429 and 403 on unrelated PRs and
# actions/setup-go changed a cache key in a way that made one PR permanently
# unmergeable. PyPI and the wasm-tools release are accepted here because
# python IS tier 1; crates.io, npm and Maven Central are not, because their
# languages are not.
#
# MERGE_GROUP IS REPORT-ONLY FOR tier1-engine AND tier1-rest (cleat#2080). The
# merge queue re-tests every required check against a temporary
# `gh-readonly-queue/...` ref, which means these two DB-backed, ~10-11 minute
# jobs used to re-provision three databases and a Python/wasm-tools toolchain
# to re-run test content the PR's own `pull_request` run had already proven
# green, on the critical path of every merge. Each now runs a single
# unconditional `echo` step on `merge_group` and skips everything else --
# same pattern as stream-trailer-check.yml. `tier1-coverage` is deliberately
# NOT report-only: it is cheap (~40s), needs no DB, and re-running it in the
# queue is free insurance that the shard partition itself did not change
# underneath the merge. The `tier1` aggregator below is unchanged; its
# `needs.*.result` check reads "success" for a report-only run exactly as it
# would for a real one.
#
# The tradeoff this accepts: a semantic conflict between two independently-
# green PRs (each fine alone, broken together) is no longer caught IN the
# queue for the engine/rest content -- only after merge, via develop's own
# push run and (for ./engine/... under -race) engine-race.yml's 4-hour
# schedule. No live branch-protection or required-check change was needed:
# job ids, names and the "Tier 1 Gate" required context are all unchanged.
# ---------------------------------------------------------------------------
name: Tier 1 Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. EVERY required context on develop has to
  # report here. The list is tiers.yaml's `required_contexts` block; the count
  # is deliberately not repeated here, because it was -- in nine workflow files
  # at once -- and all nine said 32 while develop required 33 (cleat#1937).
  merge_group:
concurrency:
  # Every push gets its own group; PR runs share one per ref and supersede.
  #
  # `github.ref` is refs/heads/develop for EVERY merge, so keying the group on
  # it puts consecutive merges in one group. That discards a merge's own
  # verification, and `cancelled` is not `success` -- nothing downstream reads
  # it as a failure, so it disappears silently.
  #
  # `cancel-in-progress: false` is NOT enough to prevent that, which is the
  # part the first fix (#634) got wrong. It stops a *running* run being killed,
  # but GitHub still allows only one pending run per group: when a third push
  # enters an occupied group, the one waiting is cancelled before it ever
  # starts. Measured on develop after #634 merged (18:20:48Z on 2026-09-03),
  # 5 of 24 `Tier 1 Gate` push runs were cancelled -- every one with **zero
  # jobs**, killed within seconds of the next merge landing.
  #
  # The job count separates the two mechanisms, and does it cleanly. Of the 22
  # cancelled gate runs that day, the 17 before #634 have jobs=1 (killed
  # mid-run) with a single jobs=0 exception, and all 5 after it have jobs=0:
  #
  #   gh run view <cancelled-id> --json jobs --jq '.jobs | length'   # 0
  #   gh run view <success-id>   --json jobs --jq '.jobs | length'   # 1
  #
  # So #634 did exactly what it claimed and no more. The gate takes 20-40
  # minutes and merges land minutes apart, so the queue is almost always
  # occupied. Keying push runs on `github.sha` gives each merge a group of its
  # own: never queued, so never superseded.
  #
  # On a pull_request the group stays per-ref and cancellation is the setting's
  # real purpose: pushing twice to a branch should not run the suite twice.
  #
  # `scripts/check-workflow-concurrency.sh` guards both halves.
  # A BODY EDIT MUST NOT SUPERSEDE THE RUN IT RACES (cleat#1688).
  #
  # `edited` is subscribed above because a BASE CHANGE fires it and nothing
  # else does -- but it also fires for a title or body edit, and `github.ref`
  # is identical for every pull_request activity type. The edited run therefore
  # landed in this group and cancelled the synchronize run it followed, and a
  # superseded run renders as a failure rather than as "replaced".
  #
  # `github.run_id` is unique per run, so a no-op edited run shares a group
  # with nothing and cancels nothing. An `edited` that DID change the base
  # keeps the per-ref group: that is a real re-evaluation against a different
  # target and should supersede, which is why the activity type exists here.
  #
  # ONE LINE ON PURPOSE: check-workflow-concurrency.sh reads the single line
  # matching `^\s*group:` and looks for github.sha/run_id/ref in it. A folded
  # `>-` scalar hides the expression and the guard reports a false alarm.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' && !github.event.changes.base && github.run_id || github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Classifies push/pull_request/merge_group as docs-only or not, so the
  # DB-backed shards below can skip their setup and report success without
  # burning DB-service and toolchain-install minutes on a change that could
  # not have broken the engine (cleat#2118).
  #
  # NO top-level `if:` on this job, deliberately. A job gated on `needs: [X]`
  # is SKIPPED, not run, when X itself is skipped by its own `if:` -- and a
  # skipped dependency does not read as "success" to branch protection any
  # more than a failed one does. `tier1`'s own aggregator, below, already
  # spells out exactly this hazard under CLAUDE.md's "a condition that never
  # decides anything cannot be observed to be wrong". This job sidesteps it by
  # construction: it always runs, on every event, and always succeeds; only
  # its OUTPUT varies. `needs: [changes]` therefore never itself causes a
  # downstream job to be skipped.
  #
  # docs_only is computed for BOTH pull_request (diff against the PR's base)
  # and merge_group (diff across the whole projected batch, base_sha to
  # head_sha) -- a queue batch that is entirely docs-only should not re-pay
  # DB/toolchain setup either, and the merge queue is this issue's own
  # motivating bottleneck. A plain push always gets docs_only=false: develop's
  # own push run must never be filtered, and diffing a push has no well-defined
  # "PR" or "batch" to diff against.
  #
  # FAILS CLOSED. Any place the diff cannot be computed -- an empty file list,
  # a missing base/head sha, an API error -- sets docs_only=false and falls
  # through to running everything, rather than erroring the step. A required
  # check whose steps are all skipped still reports success, so a classifier
  # bug that fails OPEN would merge untested code silently; failing closed
  # only costs the CI minutes this job exists to save.
  #
  # This exact job is duplicated in every workflow that gates a heavy suite on
  # it -- see cleat#2118's PR for the full list.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename') || files=""
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
            if [ -z "$base" ] || [ -z "$head" ]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "merge_group base_sha/head_sha unavailable -- failing closed as non-docs-only"
              exit 0
            fi
            files=$(gh api "repos/${{ github.repository }}/compare/${base}...${head}" --paginate --jq '.files[].filename') || files=""
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request or merge_group event (${{ github.event_name }}) -- never filtered"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "no changed files reported (or the API call failed) -- failing closed as non-docs-only"
            exit 0
          fi
          echo "$files"
          # `.md$|^docs/` is DELIBERATELY NOT in this pattern. At least 15
          # tests on develop read Markdown/docs content to hold documentation
          # to the code (cmd/cleat's documented_flags_and_codes_test.go and
          # documented_invocations_clear_flag_parsing_test.go each glob over
          # EVERY tracked *.md file, so no single .md path is provably safe to
          # skip); a docs-only PR that broke one of those would sail through as
          # green. `^\.claude/` isn't here either, for the same reason and by
          # the same discovery: 3 tests reference the literal `.claude/` --
          # not to assert anything about its content, but to EXCLUDE it while
          # walking the repo (it holds scratch agent worktrees, whole extra
          # copies of the tree). .claude/settings.local.json is tracked, so a
          # PR touching only it is real, and the guard below cannot tell
          # "excluded defensively" from "read for correctness" from a string
          # literal alone -- so it treats both as unsafe, which is the
          # conservative direction to be wrong in. specs/ has no reader of any
          # kind. scripts/check-workflow-guards.py's
          # guard_docs_only_skip_pattern_is_test_blind keeps this true: it fails
          # if any *_test.go path literal ever falls inside whatever this
          # pattern currently matches.
          if echo "$files" | grep -vqE '^specs/'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # No DB, no Python, no wasm-tools: `go test -list` compiles the package and
  # enumerates Test funcs, it never runs one. Gates the three expensive jobs
  # below so a broken partition (a bucket that lost a test, or double-counted
  # one) fails in seconds rather than after minutes of DB-backed test runs on
  # a shard split that was wrong from the start. Deliberately NOT gated on
  # `changes` -- it is cheap enough (~40s) that the coverage insurance is worth
  # keeping unconditional, and tier1-engine/tier1-rest below are what actually
  # skip.
  tier1-coverage:
    name: Tier 1 Shard Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Sharding self-test (offline)
        run: scripts/tier-gate.sh --self-test
      - name: Verify the 2 engine shards union to the full test list
        run: scripts/tier-gate.sh --verify-shard-coverage 3

  tier1-engine:
    name: Tier 1 Engine Shard ${{ matrix.shard }}/3
    needs: [tier1-coverage, changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Each shard runs roughly half of ./engine/...'s ~3500 top-level tests.
    # 45 carries the same buffer the pre-sharding single job had over its own
    # GO_TEST_TIMEOUT (tier-gate.sh defaults to 30m): the difference is setup
    # cost -- checkout, Python install, wasm-tools install, the SQL Server
    # database step -- which does not shrink with sharding.
    timeout-minutes: 45

    services:
      postgres:
        # PINNED 2026-08-08. `postgres:16` is a floating tag in exactly the way
        # `2022-latest` was for SQL Server below: it moved from 16.0 to 16.14
        # over the life of this repo, and every required check that touches a
        # database resolved whatever the registry served that morning.
        #
        # scripts/check-workflow-guards.py's floating-tag guard did NOT catch
        # this when the pin landed: it only rejected `:latest` and tags ending
        # in `-latest`, so a major-only tag walked straight through. Tightened
        # the same day to require a digest and nothing else, once mysql:8.4 was
        # pinned too -- so this is now enforced rather than merely done. See
        # is_floating() for why enumerating moving-tag spellings was the wrong
        # shape: no rule over tag TEXT separates `8.4` from `8.4.11` without
        # knowing the publisher's versioning policy, and Docker Hub tags are
        # mutable by design regardless.
        #
        # Re-derive the digest, and read the version it resolves to:
        #
        #   docker buildx imagetools inspect postgres:16      # Digest: sha256:...
        #   docker run --rm postgres:16 postgres --version    # -> 16.14
        #
        # The `:16.14@sha256:` form is redundant on purpose: Docker resolves by
        # digest and ignores the tag, so the tag is there for the reader. If
        # you bump one, bump both -- a tag that disagrees with its digest is
        # worse than no tag, because it is a claim nothing checks.
        #
        # ONE OF TWELVE SITES repo-wide. The others are in ci.yml, tier2-gate.yml,
        # multi-db-ci.yml, soak.yml, plugin-harness-ci.yml (x2), this file (now
        # three), and the four compose files at the repo root and in
        # .devcontainer/. cmd/cleat/templates/workflow/docker-compose.yml is
        # deliberately NOT pinned -- see the comment there.
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mssql:
        # Pinned by digest on 2026-08-07. THE RATIONALE FOR ALL SEVEN ORIGINAL
        # `image:` SITES LIVES HERE (now more, after sharding split this job in
        # two); every other site carries a one-line pointer back to this
        # comment.
        #
        # `2022-latest` is a moving tag. Microsoft republishes it on their own
        # schedule, so a republish can turn every open PR in the repo red for a
        # reason unrelated to anything the project did, and the failure lands on
        # whoever happens to have a PR open. Three of its uses are required
        # status checks -- Test SQL Server, Tier 1 Gate and Tier 2 Gate -- so
        # that is not a hypothetical inconvenience. Same class as the MinIO
        # `:latest` pinned in #377, and larger.
        #
        # The digest below is what `2022-latest` resolved to on 2026-08-07, so
        # this is the image these jobs were already green on: pinning it is a
        # no-op today and a guarantee tomorrow. It is SQL Server 16.0.4265.3 on
        # an ubuntu 22.04 base, linux/amd64. The tag carries a single manifest
        # rather than an index, so there is one digest and not one per platform
        # -- worth knowing before bumping it. Re-derive both:
        #
        #   docker manifest inspect -v mcr.microsoft.com/mssql/server:2022-latest
        #   curl -sL https://mcr.microsoft.com/v2/mssql/server/blobs/<config-digest> \
        #     | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["Labels"])'
        #
        # WHY THE `docker ps --filter ancestor=` LINE BELOW MOVED WITH IT.
        # Pinning `image:` on its own would have been worse than not pinning at
        # all. The step that creates the cleat database finds its container
        # with `docker ps -q --filter ancestor=<ref>`, and that filter matches
        # on the reference actually used to pull, not on the repository. So a
        # half-done pin leaves `docker exec` with an empty container ID.
        # Measured on 2026-08-07, against a container started from a digest ref:
        #
        #   docker ps -q --filter "ancestor=alpine@sha256:c64c687c..."  -> 1 match
        #   docker ps -q --filter "ancestor=alpine:3.20"                -> 0 matches
        #
        # All `image:` sites and all `ancestor=` filters name the same digest,
        # and they have to be bumped together. Enforced as of #399:
        # `scripts/check-workflow-guards.py` fails the required `Lint` job on
        # an `ancestor=` reference that is not also an `image:` in the same
        # file. Re-derive the set:
        #
        #   grep -rn 'mcr.microsoft.com/mssql/server' .github/workflows/ \
        #     docker-compose.cluster.yml docker-compose.dev.yml
        #
        # This is a pin to be bumped DELIBERATELY AND BY HAND, and nothing
        # automates it. No Renovate or Dependabot PR has ever touched a
        # workflow file in this repository.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433

    env:
      # Explicit, not inherited. Go defaults CGO_ENABLED to 1 only when a C
      # compiler is present and 0 otherwise, so relying on the default would
      # silently remove NewWasmtimeBackend on a runner without gcc -- leaving
      # NO backend at all, since the wazero one was deleted in #459. The gate
      # checks this too and fails on CGO_ENABLED=0; pinning it here means the
      # check never has to fire.
      CGO_ENABLED: "1"

      # Both PostgreSQL names. The tree carries two conventions for the same
      # DSN -- CLEAT_TEST_DB and CLEAT_TEST_POSTGRES -- and setting only one
      # silently skips everything keyed on the other. The gate requires both
      # and says so; converging on one name is the real fix.
      CLEAT_TEST_POSTGRES: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@localhost:1433?database=cleat
      # cleat#982: arm the row-disappearance audit (a test-only AFTER DELETE
      # trigger on workflow_instances) so a recurrence reports WHO deleted a
      # missing row instead of only that it is gone. No-op for every dialect
      # except SQL Server; see engine/testutil/mssql_row_disappearance.go.
      CLEAT_TEST_MSSQL_ROW_AUDIT: "1"

    steps:
      # cleat#2080: the merge queue re-runs this job's `pull_request` content
      # against a temporary `gh-readonly-queue/...` ref via the `merge_group`
      # trigger below. That content was already validated when the PR's own
      # `pull_request` run went green -- re-provisioning three databases and a
      # Python/wasm-tools toolchain to re-run the identical test shard is
      # ~10-11 wall-clock minutes spent re-proving something already proven.
      # See stream-trailer-check.yml for the established pattern this copies.
      #
      # This trades away in-queue detection of a semantic conflict between two
      # independently-green PRs (each fine alone, broken merged together) --
      # accepted per the issue: that case is now caught by develop's own push
      # run (and engine-race.yml's schedule) rather than in the queue.
      - name: Already checked on the pull request
        if: github.event_name == 'merge_group'
        run: echo "tier 1 gate -- engine shard ${{ matrix.shard }}/3 -- validated when the pull request was opened -- cleat#2080"

      - name: No relevant changes in this pull request
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only == 'true'
        run: |
          echo "tier 1 gate -- engine shard ${{ matrix.shard }}/3 -- skipped: this pull request touches only paths no Go test reads (specs/) -- cleat#2118"

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'

      - name: Setup Go
        uses: actions/setup-go@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"

      # componentize-py and the SDK it compiles against. python is tier 1
      # (D2), so this is a tier-1 precondition rather than a convenience --
      # without it TestPythonWasmEndToEnd and TestPythonComponentExecutionFence
      # skip, and the gate fails on the skip rather than letting the run go
      # quietly green.
      - name: Install componentize-py and the Python SDK
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: |
          pip install --upgrade pip
          pip install componentize-py
          pip install -e python-sdk

      # The prebuilt binary, not `cargo install wasm-tools`.
      #
      # Measured on the Cross-Language E2E job, which does use cargo: its
      # toolchain install step runs 2m20s, almost all of it compiling
      # wasm-tools from source. The release tarball is a download. It also
      # keeps a Rust toolchain out of a tier-1 job, which matters for more than
      # speed -- see this file's header on why tier 1 does not take
      # dependencies on tier-2 languages' registries.
      #
      # Pinned to the same version scripts/docker/python-toolchain.Dockerfile
      # installs, so the container a developer runs this gate in and the runner
      # agree. If those drift, a developer's green is not evidence about CI's.
      - name: Install wasm-tools
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        env:
          WASM_TOOLS_VERSION: "1.255.0"
        run: |
          set -euo pipefail
          # This exact fetch failed a required check with `curl: (22) ... error:
          # 503` on 2026-08-12, which read like a defect in the PR that hit it
          # (#472, an actions/github-script bump) and was not.
          #
          # --retry-all-errors rather than plain --retry, and to a file rather
          # than piped into tar. Both are load-bearing; see the same fetch in
          # ci.yml's "Install lint tools" for the measurements. Short version:
          # plain --retry does not retry a mid-transfer abort at all, and once
          # retrying does work, piping hands tar the first attempt's bytes
          # followed by a complete second copy.
          curl -sSLf --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          # This digest has real provenance, unlike ci.yml's shellcheck pin.
          # wasm-tools publishes SLSA build attestations, and this exact value
          # was verified against one before being written here (2026-08-30):
          #
          #   gh attestation verify wasm-tools-1.255.0-x86_64-linux.tar.gz \
          #     --repo bytecodealliance/wasm-tools --format json
          #
          #   builder : .../bytecodealliance/wasm-tools/.github/workflows/publish.yml@refs/heads/main
          #   subject : wasm-tools-1.255.0-x86_64-linux.tar.gz  (1 of 10 attested)
          #
          # The check here is an offline sha256 rather than a repeat of that
          # verification on purpose: `gh attestation verify` calls GitHub's API,
          # and this job is a required check that has already been failed once
          # by a transient fetch (503, 2026-08-12). Provenance is established
          # once, at pin time, by a human reading the attestation; CI then
          # enforces it with no network and no new way to flake.
          #
          # When bumping WASM_TOOLS_VERSION, re-run the command above on the new
          # artifact and paste its digest -- do not just compute a hash of
          # whatever downloaded.
          echo "a62237f4731c45f665f1115cad39acaeec02963cbc848c9473ab033eed837072  /tmp/wasm-tools.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      # SQL Server starts with no application database, and the DSN above names
      # one. Doing this in a step rather than in the service definition because
      # a service has no way to run SQL after it is healthy.
      - name: Create the cleat database on SQL Server
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: |
          docker exec "$(docker ps -q --filter 'ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C \
            -Q "IF DB_ID('cleat') IS NULL CREATE DATABASE cleat"

      # No `|| true`, no continue-on-error, and no attempt to summarise the
      # result here. The gate's own exit status is this job's exit status; its
      # stdout already names what it excluded, what it ran, and what failed.
      - name: Tier 1 gate -- engine shard ${{ matrix.shard }}/3
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: scripts/tier-gate.sh --shard ${{ matrix.shard }}/3

      # The log on failure, because the gate deliberately keeps it rather than
      # deleting its evidence -- re-running the whole shard to find out what
      # broke is not a debugging strategy. Guarded on merge_group too: the real
      # step above did not run, so tier-gate.log does not exist, and `always()`
      # alone would upload a missing-file failure on every queue run.
      - name: Upload the tier-1 log
        if: always() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tier-gate-log-engine-${{ matrix.shard }}-${{ github.sha }}
          path: tier-gate.log
          retention-days: 30

  tier1-rest:
    name: Tier 1 Gate -- rest
    needs: [tier1-coverage, changes]
    runs-on: ubuntu-latest
    # Same buffer as tier1-engine, over the same GO_TEST_TIMEOUT default.
    timeout-minutes: 45

    services:
      postgres:
        # See tier1-engine's postgres service for the full pin rationale.
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The crash suite's own instance. Not a second database on the first
      # server: this suite crashes and restarts workers against it and applies
      # migrations as an owner role, and WORKSTREAM.md's DSN table gives it
      # its own port for that reason. The DSN shape below matches the default in
      # tests/crash/harness_test.go's ownerDSN. Unused today (cleat#2085 keeps
      # ./tests/crash/... out of the extracted package list), provisioned
      # anyway because the pre-sharding job already did and nothing here
      # should regress that on a PR whose scope is sharding, not coverage.
      postgres-crash:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mssql:
        # See tier1-engine's mssql service for the full pin rationale.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433

    env:
      CGO_ENABLED: "1"
      CLEAT_TEST_POSTGRES: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@localhost:1433?database=cleat
      CLEAT_TEST_MSSQL_ROW_AUDIT: "1"
      CLEAT_CRASH_DB: postgres://cleat:cleat@127.0.0.1:5433/cleat?sslmode=disable

    steps:
      # See tier1-engine's identical step for the full rationale (cleat#2080).
      - name: Already checked on the pull request
        if: github.event_name == 'merge_group'
        run: echo "tier 1 gate -- rest shard 3/3 -- validated when the pull request was opened -- cleat#2080"

      - name: No relevant changes in this pull request
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only == 'true'
        run: |
          echo "tier 1 gate -- rest shard 3/3 -- skipped: this pull request touches only paths no Go test reads (specs/) -- cleat#2118"

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'

      - name: Setup Go
        uses: actions/setup-go@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v7
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"

      - name: Install componentize-py and the Python SDK
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: |
          pip install --upgrade pip
          pip install componentize-py
          pip install -e python-sdk

      - name: Install wasm-tools
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        env:
          WASM_TOOLS_VERSION: "1.255.0"
        run: |
          set -euo pipefail
          curl -sSLf --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          echo "a62237f4731c45f665f1115cad39acaeec02963cbc848c9473ab033eed837072  /tmp/wasm-tools.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Create the cleat database on SQL Server
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: |
          docker exec "$(docker ps -q --filter 'ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C \
            -Q "IF DB_ID('cleat') IS NULL CREATE DATABASE cleat"

      - name: Tier 1 gate -- rest shard 3/3
        if: github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        run: scripts/tier-gate.sh --shard 3/3

      - name: Upload the tier-1 log
        if: always() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tier-gate-log-rest-${{ github.sha }}
          path: tier-gate.log
          retention-days: 30

  # The required status context. Named exactly "Tier 1 Gate" so
  # branches/develop/protection needs no edit for the split above.
  #
  # `if: always()` plus an explicit check of every dependency's result, rather
  # than leaving this job to be skipped when a dependency fails. A job that is
  # SKIPPED because a `needs:` job failed does not read as "success" to branch
  # protection, but this repo's CLAUDE.md records, under "a condition that
  # never decides anything cannot be observed to be wrong", exactly how costly
  # it is to find out an assumption about GitHub's own semantics was wrong only
  # after relying on it silently. Spelling out the check here costs six lines
  # and removes that assumption entirely: this job always runs and always
  # states which dependency, if any, was not a success.
  tier1:
    name: Tier 1 Gate
    needs: [tier1-coverage, tier1-engine, tier1-rest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        run: |
          echo "tier1-coverage: ${{ needs.tier1-coverage.result }}"
          echo "tier1-engine:   ${{ needs.tier1-engine.result }}"
          echo "tier1-rest:     ${{ needs.tier1-rest.result }}"
          if [ "${{ needs.tier1-coverage.result }}" != "success" ] || \
             [ "${{ needs.tier1-engine.result }}" != "success" ] || \
             [ "${{ needs.tier1-rest.result }}" != "success" ]; then
            echo "::error::Tier 1 Gate: at least one shard did not succeed"
            exit 1
          fi
