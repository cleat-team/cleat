# ---------------------------------------------------------------------------
# Semantic Pull Request — validates PR titles follow conventional commit format
#
# Workstream 2 — Continuous Integration and Delivery
#
# Expected format:
#   type(scope): description       e.g. feat(engine): add retry logic
#   type: description              e.g. docs: update README (docs/chore/ci only)
#
# Valid types: feat, fix, docs, test, refactor, chore, ci, perf
# Valid scopes: engine, wasm, cli, worker, sdk, ui, plugins, docs, ci, deps, build
# ---------------------------------------------------------------------------
name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            ci
            perf

          # Allowed scopes (validated when present)
          scopes: |
            engine
            wasm
            cli
            worker
            sdk
            ui
            plugins
            docs
            ci
            deps
            build

          # Scope is optional globally, but the following convention
          # is documented in CONTRIBUTING.md:
          #   feat, fix, refactor, test, perf  — scope EXPECTED
          #   docs, chore, ci                  — scope OPTIONAL
          requireScope: false

          # Allow WIP / draft PRs to skip validation
          wip: true

          # Labels that bypass validation entirely
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

          # Validate the commit message for single-commit PRs instead
          # of the PR title (useful when the PR title isn't authoritative)
          validateSingleCommit: false
