# ---------------------------------------------------------------------------
# Stale issue and PR management
#
# Marks issues/PRs as stale after a period of inactivity, then closes them.
# Exempts items labelled security, pinned, or keep.
# ---------------------------------------------------------------------------
name: Stale

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further activity occurs.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
          days-before-issue-stale: 90
          days-before-issue-close: 7
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned,keep
          exempt-pr-labels: security,pinned,keep
          close-issue-label: wontfix
          close-pr-label: wontfix
