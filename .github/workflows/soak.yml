# ---------------------------------------------------------------------------
# Soak test
#
# tests/soak drives the real PostgresStore lifecycle continuously for hours and
# checks for leaks and degradation. It is gated behind the `soak_test` build
# tag, so `go vet ./tests/soak/...` reports no packages at all and
# `go test ./...` never compiles it -- it was unwired twice over, and had never
# run.
#
# Deliberately not a PR gate. An hour of wall-clock on every pull request would
# be absurd, and a leak detector is a trend instrument: a single noisy run
# should not block a merge.
# ---------------------------------------------------------------------------
name: Soak Test

on:
  schedule:
    # Mondays at 06:00 UTC, as the suite's own doc comment suggests.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration (Go duration string, e.g. 30m, 1h, 4h). Max ~4h on hosted runners."
        required: false
        default: "1h"

permissions:
  contents: read

jobs:
  soak:
    name: Soak
    runs-on: ubuntu-latest
    # A backstop on the runner, not the test's own budget: the step below
    # computes a -timeout from SOAK_DURATION, and the test refuses to start if
    # that timeout does not exceed its duration.
    #
    # 330 minutes because GitHub-hosted runners cap a job at 360 and silently
    # cancel past it. The duration input therefore cannot usefully exceed ~4h
    # here -- a 24h soak needs a self-hosted runner, and the step below refuses
    # to start one it knows the runner will kill rather than let it run for
    # hours and report as "cancelled".
    timeout-minutes: 330

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        # 127.0.0.1, not localhost: on GitHub runners localhost resolves to ::1
        # first while a service container publishes on IPv4 only. See the note
        # on the test-go job in ci.yml, where that cost the entire job its
        # coverage without anyone noticing.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLEAT_TEST_DB: postgres://postgres:postgres@127.0.0.1:5432/cleat?sslmode=disable
      SOAK_DURATION: ${{ inputs.duration || '1h' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run soak test
        shell: bash
        run: |
          set -o pipefail  # without it `tee` supplies the exit status and a
                           # failing `go test` reports as a green step.

          # The harness timeout must exceed SOAK_DURATION, with room for
          # teardown and the final assertions. The obvious spelling --
          # -timeout="${SOAK_DURATION}" -- kills the binary at exactly the
          # moment the test stops its workload, so the panic races the
          # assertions and a passing run can report as a hang. Computed here,
          # and independently rejected by the test itself if it is ever wrong.
          timeout=$(python3 -c "
          import re, sys
          units = {'ns':1e-9, 'us':1e-6, 'ms':1e-3, 's':1, 'm':60, 'h':3600}
          d = sys.argv[1]
          secs = sum(float(v) * units[u] for v, u in re.findall(r'([0-9.]+)(ns|us|ms|s|m|h)', d))
          if secs <= 0:
              raise SystemExit(f'cannot parse SOAK_DURATION={d!r}')
          budget = 330 * 60  # must track timeout-minutes on this job
          total = int(secs * 1.25) + 900  # +25% and 15 minutes
          if total > budget:
              raise SystemExit(
                  f'SOAK_DURATION={d} needs {total}s including teardown, over this '
                  f'job\'s {budget}s budget. GitHub-hosted runners cap a job at 360 '
                  f'minutes; use a self-hosted runner for anything longer.')
          print(f'{total}s')
          " "$SOAK_DURATION")
          echo "SOAK_DURATION=$SOAK_DURATION -> -timeout=$timeout"

          # -tags=soak_test, without which this package does not exist as far
          # as the toolchain is concerned and the step passes having compiled
          # nothing.
          go test -tags=soak_test -count=1 -v -json \
            -timeout="$timeout" \
            ./tests/soak/... 2>&1 | tee soak-report.json

      # 0: this job provisions the one thing the suite needs. A skip means the
      # PostgreSQL service did not arrive, or the build tag stopped selecting
      # the package -- either way the job ran for an hour and tested nothing.
      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh soak soak-report.json

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report-${{ github.sha }}-${{ github.run_attempt }}
          path: soak-report.json
          retention-days: 30

  # A failed soak must say so (cleat#3736). The weekly run failed on 2026-11-02 and 2026-11-09 and was
  # found eleven days later by someone reading the run history; nothing posted anywhere. This job opens
  # a tracking issue, or comments on the open one, when the soak job FAILS or is CANCELLED -- cancelled
  # because a job that exceeds its timeout-minutes is cancelled rather than failed, and the 90-minute
  # `go test` timeout failed the August runs the other way (a package FAIL, which is `failure`).
  #
  # Its own job, and not a step at the end of `soak`, so it still runs when the soak job is killed, and
  # so the write permission is scoped to a job that runs no test and no repository-controlled code from
  # a pull request: this workflow has only schedule and workflow_dispatch triggers. `soak` keeps the
  # workflow-level `contents: read`. GITHUB_TOKEN only -- no bot account, no PAT (owner decision).
  #
  # WHAT THE ISSUE SAYS is decided by scripts/soak-failure-report.py, whose --self-test is run by the Lint
  # job against three real soak logs (a failing run, the 90-minute timeout, a passing run). WHERE it goes
  # is the github-script step below, which has no unit test and is proved live: a deliberately failing
  # soak opened the issue, and a second one commented on it (cleat#3736).
  report-failure:
    name: Report a failed soak
    needs: soak
    if: ${{ always() && (needs.soak.result == 'failure' || needs.soak.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, never cancelled: two reports racing could each find no open issue and file two.
    concurrency:
      group: soak-failure-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # Absent when the soak job died before the test ran, and that is a state the script words for:
      # continue-on-error is what lets the report say "no artifact" instead of this step failing and
      # the report never being filed.
      - name: Fetch the soak report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: soak-report-${{ github.sha }}-${{ github.run_attempt }}
          path: soak-report

      - name: Render the issue text
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          DURATION: ${{ inputs.duration || '1h' }}
        run: |
          python3 scripts/soak-failure-report.py \
            --report soak-report/soak-report.json \
            --run-url "$RUN_URL" --attempt "$RUN_ATTEMPT" --sha "$HEAD_SHA" \
            --event "$EVENT" --duration "$DURATION" \
            --body-out soak-failure-body.md
          python3 scripts/soak-failure-report.py --print-title > soak-failure-title.txt

      - name: Open or update the tracking issue
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('soak-failure-title.txt', 'utf8').trim();
            const body = fs.readFileSync('soak-failure-body.md', 'utf8');

            // The same key as the Tier 1 notifier, and for the same reason (cleat#2906): a run URL is
            // identical across attempts of one run id, so a re-run that fails again must not read as
            // "already reported" from attempt 1.
            const reportKey = `${process.env.RUN_URL} (attempt ${process.env.RUN_ATTEMPT})`;

            // Every OPEN issue, matched on the exact title and nothing else: no label filter, because a
            // label someone removes would make the next failure open a second issue. Closed issues are
            // not matched on purpose: a closed soak issue means it was fixed, and a new failure is new.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title === title);

            if (existing) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100,
              });
              const already = (existing.body || '').includes(reportKey)
                || comments.some(c => (c.body || '').includes(reportKey));
              if (already) {
                core.notice(`${reportKey} is already reported on #${existing.number}, skipping`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again.\n\n${body}`,
              });
              core.notice(`Commented on #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['area/ci'],
            });
            core.notice(`Opened #${created.data.number}`);
