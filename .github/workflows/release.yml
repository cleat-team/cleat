# ---------------------------------------------------------------------------
# Release workflow
#
# Triggered by pushing a tag matching v*. Builds and publishes GitHub
# releases via GoReleaser.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # working-directory is `web`, not `cmd/cleat-worker/web`.
      #
      # It was the latter until 2026-08-09, and that directory contains only
      # dist/ -- no package.json -- so the `if [ -f package.json ]` below always
      # took the else branch and printed "using pre-built dist/". The dashboard
      # was never rebuilt for a release; every binary shipped whatever dist/ was
      # last committed by hand. Measured: rebuilding from the real source
      # produced entirely different assets (the committed build had two JS
      # chunks, a fresh one has a single 94 kB chunk), so the shipped dashboard
      # was genuinely older than the source, not merely re-hashed.
      #
      # web/vite.config.ts already writes to ../cmd/cleat-worker/web/dist, which
      # is what cmd/cleat-worker/server.go embeds, so building here lands in the
      # right place with no copy step.
      - name: Build Svelte UI
        working-directory: web
        run: |
          if [ ! -f package.json ]; then
            echo "::error::web/package.json is missing. The dashboard source has moved."
            echo "Refusing to release: the previous behaviour here was to fall back to"
            echo "the committed dist/, which is how a stale dashboard shipped unnoticed."
            exit 1
          fi
          npm ci
          npm run build

      # Now meaningful. While nothing rebuilt dist/, this could never be dirty,
      # so it passed every release without checking anything.
      - name: Validate no dirty dist/
        run: |
          if [ -n "$(git status --porcelain cmd/cleat-worker/web/dist/)" ]; then
            echo "::error::cmd/cleat-worker/web/dist/ differs from a fresh build of web/."
            echo "The committed dashboard is not what this source produces. Run:"
            echo "    cd web && npm ci && npm run build"
            echo "and commit cmd/cleat-worker/web/dist/."
            git status --porcelain cmd/cleat-worker/web/dist/
            git diff --stat cmd/cleat-worker/web/dist/
            exit 1
          fi

      # cleat-worker is built with CGO_ENABLED=1 -- wasmtime is the only WASM
      # backend, and a CGO-less worker exits 1 at startup. amd64 links with the
      # runner's own gcc; arm64 needs the cross compiler named by the CC
      # template in .goreleaser.yml.
      - name: Install the arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross
          aarch64-linux-gnu-gcc --version
          # libc6-arm64-cross supplies /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1.
          # gcc-aarch64-linux-gnu alone links the binary but does not install the
          # loader it needs, so qemu-aarch64 fails with
          #   Could not open '/lib/ld-linux-aarch64.so.1': No such file or directory
          # which reads as a backend failure but is a missing sysroot. QEMU_LD_PREFIX
          # below is what points qemu at it.
          test -e /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1

      # Registers binfmt_misc handlers so the linux/arm64 worker can be executed
      # on this amd64 runner. scripts/verify-release-worker.sh runs every
      # cleat-worker artifact with --verify-backend as a goreleaser post hook,
      # and has no skip branch: without this step the arm64 hook fails with
      # "Exec format error" and the release stops.
      #
      # That is deliberate. The bug this guards against -- CGO_ENABLED=0 in
      # .goreleaser.yml, shipping workers that exited 1 before reading a flag --
      # survived precisely because nothing ever executed the artifact.
      - name: Set up QEMU for cross-architecture verification
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Where qemu-aarch64 looks for the guest's dynamic loader and libc.
          # Without it the arm64 post hook dies with "Could not open
          # '/lib/ld-linux-aarch64.so.1'" before cleat-worker's main runs, and
          # the release aborts. Found by the Release Dry Run job on its first run.
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
