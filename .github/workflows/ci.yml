# ---------------------------------------------------------------------------
# CI/CD Pipeline for cleat
#
# Workstream 2 — Continuous Integration and Delivery
#
# Jobs:
#   lint              — go vet, ruff, shellcheck, clippy
#   lint-go           — golangci-lint: errcheck, gosimple, govet, ineffassign,
#                       staticcheck, unused, misspell, unconvert, gocyclo, gofmt
#   vulncheck         — govulncheck ./... (Go vulnerability scanner)
#   test-go           — matrix (go version x package group), race detector
#   test-python       — matrix (python 3.10 / 3.11 / 3.12)
#   test-java         — gradle test (TeaVM + JUnit 5)
#   test-assemblyscript — npm test (as-pect)
#   fuzz              — fuzz tests on internal/wasm/... (60s per fuzz func)
#   benchmarks        — push to main only; stores result + trend artifact
#   cluster-tests     — docker-compose cluster, integration tests, tear-down
#   build             — Go bin, Python SDK, Java, AssemblyScript, examples
# ---------------------------------------------------------------------------
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_STABLE: "1.26"

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write

# ===========================================================================
# JOBS
# ===========================================================================
jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install lint tools
        run: |
          pip install ruff
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Go vet
        run: go vet ./...

      - name: Ruff check
        continue-on-error: true
        run: ruff check python-sdk/

      - name: ShellCheck
        continue-on-error: true
        run: shellcheck scripts/*.sh benchmarks/*.sh

      - name: Clippy (cleat-macro)
        working-directory: crates/cleat-macro
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (cleat-sdk)
        working-directory: crates/cleat-sdk
        run: cargo clippy --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # Lint Go (golangci-lint — disabled: action doesn't support Go 1.26 yet)
  # -------------------------------------------------------------------------
  # lint-go:
  #   name: Go Lint (golangci-lint)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Setup Go
  #       uses: actions/setup-go@v5
  #       with:
  #         go-version: "1.26"
  #     - name: golangci-lint
  #       uses: golangci/golangci-lint-action@v6
  #       with:
  #         version: latest
  #         args: --timeout=5m ./...

  # -------------------------------------------------------------------------
  # Vulnerability check (govulncheck)
  # -------------------------------------------------------------------------
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # -------------------------------------------------------------------------
  # Test Go (matrix: Go version x package group)
  # -------------------------------------------------------------------------
  test-go:
    name: Test Go (${{ matrix.package.name }}) on ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEAT_TEST_DB: postgres://postgres:postgres@localhost:5432/cleat?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
        package:
          - name: core
            path: ./cleat/...
          - name: internal
            path: ./internal/...
          - name: plugins
            path: ./plugins/...
          - name: commands
            path: ./cmd/...
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install TinyGo (WASM compilation)
        if: matrix.package.name == 'internal' && matrix.go-version == '1.26'
        run: |
          TINYGO_VER=$(curl -sSfL https://api.github.com/repos/tinygo-org/tinygo/releases/latest | jq -r .tag_name)
          if [ -z "$TINYGO_VER" ] || [ "$TINYGO_VER" = "null" ]; then
            TINYGO_VER="v0.41.1"
          fi
          TINYGO_SHORT="${TINYGO_VER#v}"
          curl -sSfL "https://github.com/tinygo-org/tinygo/releases/download/${TINYGO_VER}/tinygo${TINYGO_SHORT}.linux-amd64.tar.gz" -o /tmp/tinygo.tar.gz && \
            sudo tar -C /usr/local -xzf /tmp/tinygo.tar.gz && \
            echo "/usr/local/tinygo/bin" >> $GITHUB_PATH

      - name: Setup Rust + wasm32-wasip1 (Rust WASM tests)
        if: matrix.package.name == 'internal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Run tests
        run: go test -race -count=1 -json "${{ matrix.package.path }}" 2>&1 | tee test-report.json

      - name: Warn on skipped tests
        if: always()
        run: |
          if [ -f test-report.json ]; then
            SKIP_COUNT=$(grep -c '"Action":"skip"' test-report.json || echo 0)
            if [ "$SKIP_COUNT" -gt 0 ]; then
              echo "::warning title=Skipped Tests (${{ matrix.package.name }})::${SKIP_COUNT} test(s) were skipped. Verify that all test dependencies (PostgreSQL, TinyGo, Rust/cargo) are available."
            fi
          fi

  # -------------------------------------------------------------------------
  # Test Go with TinyGo (dedicated job)
  #
  # Installs TinyGo and runs the full WASM test suite, including the
  # TinyGo compilation integration test in internal/host/. The job fails
  # if TinyGo is unavailable or the TinyGo build path breaks — tests that
  # would otherwise silently t.Skip() are forced to run.
  # -------------------------------------------------------------------------
  test-tinygo:
    if: false  # Temporarily skipped; Go version issues being explored on another branch
    name: Test Go with TinyGo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEAT_TEST_DB: postgres://postgres:postgres@localhost:5432/cleat?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install TinyGo
        run: |
          TINYGO_VER=$(curl -sSfL https://api.github.com/repos/tinygo-org/tinygo/releases/latest | jq -r .tag_name)
          if [ -z "$TINYGO_VER" ] || [ "$TINYGO_VER" = "null" ]; then
            TINYGO_VER="v0.41.1"
          fi
          TINYGO_SHORT="${TINYGO_VER#v}"
          curl -sSfL "https://github.com/tinygo-org/tinygo/releases/download/${TINYGO_VER}/tinygo${TINYGO_SHORT}.linux-amd64.tar.gz" -o /tmp/tinygo.tar.gz && \
            sudo tar -C /usr/local -xzf /tmp/tinygo.tar.gz && \
            echo "/usr/local/tinygo/bin" >> $GITHUB_PATH

      - name: Verify TinyGo
        run: tinygo version

      - name: Test WASM build pipeline (internal/wasm)
        run: go test -race -count=1 ./internal/wasm/...

      - name: Test WASM runtime + TinyGo compilation (internal/host)
        run: go test -race -count=1 -timeout=180s ./internal/host/...

      - name: Test closure validator (internal/closure)
        run: go test -race -count=1 ./internal/closure/...

      - name: Test analyzer (internal/analyzer)
        run: go test -race -count=1 ./internal/analyzer/...

  # -------------------------------------------------------------------------
  # Test Python (matrix: 3.10 / 3.11 / 3.12)
  # -------------------------------------------------------------------------
  test-python:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install "componentize-py>=0.12.0"

      - name: Run tests
        working-directory: python-sdk
        run: python -m pytest -v

  # -------------------------------------------------------------------------
  # Test Java
  # -------------------------------------------------------------------------
  test-java:
    name: Java Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Java tests
        working-directory: crates/cleat-java
        run: gradle test

  # -------------------------------------------------------------------------
  # Test AssemblyScript
  # -------------------------------------------------------------------------
  test-assemblyscript:
    name: AssemblyScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/cleat-as
        run: npm ci

      - name: Run tests
        working-directory: packages/cleat-as
        run: npm test

  # -------------------------------------------------------------------------
  # Test Rust
  # -------------------------------------------------------------------------
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Test cleat-macro
        working-directory: crates/cleat-macro
        run: cargo test

      - name: Test cleat-sdk
        working-directory: crates/cleat-sdk
        run: cargo test

      - name: Verify WASM compilation
        working-directory: crates/cleat-sdk
        run: cargo build --target wasm32-wasip1 --release

  # -------------------------------------------------------------------------
  # Test AssemblyScript WASM compilation
  # -------------------------------------------------------------------------
  test-assemblyscript-wasm:
    name: AssemblyScript WASM Build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK dependencies
        working-directory: packages/cleat-as
        run: npm ci

      - name: Install example dependencies
        working-directory: examples/as-workflow
        run: npm install

      - name: Build example WASM
        working-directory: examples/as-workflow
        run: npx asc assembly/index.ts --target release --transform ./node_modules/@cleat/transform/index.js

      - name: Verify WASM output exists and is non-empty
        working-directory: examples/as-workflow
        run: |
          if [ ! -f dist/workflow.wasm ]; then
            echo "ERROR: dist/workflow.wasm not found after build"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s dist/workflow.wasm)
          echo "WASM file size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -le 100 ]; then
            echo "ERROR: workflow.wasm is too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "workflow.wasm is valid (size: $FILE_SIZE bytes)"

      - name: Inspect WASM exports
        working-directory: examples/as-workflow
        run: |
          if command -v wasm-objdump &>/dev/null; then
            echo "=== WASM Exports ==="
            wasm-objdump -x dist/workflow.wasm 2>/dev/null | grep -A1 "Export\| - func\["
          elif command -v wasm2wat &>/dev/null; then
            echo "=== WASM exports (wasm2wat) ==="
            wasm2wat dist/workflow.wasm 2>/dev/null | grep "(export " | head -20
          else
            echo "No WASM inspection tools available. File size check passed."
          fi

  # -------------------------------------------------------------------------
  # Fuzz tests (WASM boundary)
  # -------------------------------------------------------------------------
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run fuzz tests
        run: |
          go test -fuzz=FuzzWASMMetadata -fuzztime=30s -run=^$ ./internal/wasm/...
          go test -fuzz=FuzzULEB128 -fuzztime=30s -run=^$ ./internal/wasm/...

      - name: Warn on skipped tests
        if: always()
        run: |
          SKIP_COUNT=$(go test -json -count=1 ./internal/wasm/... 2>/dev/null | grep -c '"Action":"skip"' || echo 0)
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo "::warning title=Skipped Tests (fuzz)::${SKIP_COUNT} test(s) were skipped."
          fi

  # -------------------------------------------------------------------------
  # Benchmarks (push to main only)
  # -------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history for benchmark comparison
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run benchmarks
        run: go test -bench=. -benchmem -benchtime=30s ./benchmarks/ | tee bench-output.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90

      - name: Store benchmark result (trend tracking)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true

  # -------------------------------------------------------------------------
  # Build all targets
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Go binaries
        run: |
          go build ./cmd/...
          echo "[+] Go binaries built successfully"

      - name: Build Rust crates
        run: |
          cd crates/cleat-macro && cargo build --all-targets
          cd ../cleat-sdk && cargo build --all-targets
          cargo build --target wasm32-wasip1 --release

      - name: Build AssemblyScript
        working-directory: packages/cleat-as
        run: |
          npm ci
          npm run build

      - name: Build Java
        working-directory: crates/cleat-java
        run: gradle build

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install .
          pip install "componentize-py>=0.12.0"

  # -------------------------------------------------------------------------
  # Coverage (informational, non-blocking)
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Go coverage check
        run: make coverage-check

      - name: Run Python coverage
        run: make coverage-python

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 30

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: python-sdk/tests/coverage
          retention-days: 30

  # -------------------------------------------------------------------------
  # Cluster integration tests (requires Docker)
  # -------------------------------------------------------------------------
  cluster-tests:
    name: Cluster Integration Tests
    runs-on: ubuntu-latest
    env:
      CLEAT_TEST_DB: postgres://cleat:cleat@localhost:5432/cleat?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build cleat-worker binary
        run: go build -o cleat-worker ./cmd/cleat-worker

      - name: Build Docker image
        run: docker build -t cleat-worker:latest .

      - name: Start cluster
        run: docker compose -f docker-compose.cluster.yml up -d

      - name: Wait for cluster readiness
        run: |
          echo "Waiting for Postgres to be healthy..."
          for i in $(seq 1 30); do
            if docker exec cleat-postgres pg_isready -U cleat -d cleat &>/dev/null; then
              echo "Postgres is ready."
              break
            fi
            sleep 2
          done
          echo "Waiting for workers to register..."
          sleep 10

      - name: Run integration tests
        run: go test -count=1 -timeout=120s -json ./internal/host/... 2>&1 | tee test-report.json

      - name: Warn on skipped tests
        if: always()
        run: |
          if [ -f test-report.json ]; then
            SKIP_COUNT=$(grep -c '"Action":"skip"' test-report.json || echo 0)
            if [ "$SKIP_COUNT" -gt 0 ]; then
              echo "::warning title=Skipped Tests (cluster)::${SKIP_COUNT} test(s) were skipped. Verify that CLEAT_TEST_DB and PostgreSQL are configured."
            fi
          fi

      - name: Cluster logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.cluster.yml logs --tail=100

      - name: Tear down cluster
        if: always()
        run: docker compose -f docker-compose.cluster.yml down -v
