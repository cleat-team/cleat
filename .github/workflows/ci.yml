# ---------------------------------------------------------------------------
# CI/CD Pipeline for cleat
#
# Workstream 2 — Continuous Integration and Delivery
#
# Jobs:
#   lint              — go vet, ruff, shellcheck, clippy
#   lint-go           — gofmt, then golangci-lint. As of 2026-08-08 that is
#                       six linters — govet, misspell, ineffassign, gosimple,
#                       staticcheck, unconvert — over every .go file in the
#                       repo, test files included. errcheck, gosec, gocyclo
#                       and unused stay disabled, with their measured backlogs
#                       and the reasoning in .golangci.yml.
#
#                       Do not restate that list here when it changes; say
#                       where it lives. This line has been wrong twice. It
#                       once claimed ten linters when one was running, was
#                       corrected to "govet only", and was still saying that
#                       three days after WS-3 enabled four more on 2026-08-05.
#                       Re-derive rather than trust it:
#
#                         golangci-lint linters | sed -n '/Enabled/,/Disabled/p'
#   vulncheck         — govulncheck ./... (Go vulnerability scanner)
#   test-go           — matrix (go version x package group), race detector
#   test-python       — matrix (python 3.10 / 3.11 / 3.12)
#   test-java         — gradle test (TeaVM + JUnit 5)
#   test-assemblyscript — npm test (as-pect)
#   fuzz              — fuzz tests on wasm/... (60s per fuzz func)
#   benchmarks        — push to main only; stores result + trend artifact
#   cluster-tests     — docker-compose cluster, integration tests, tear-down
#   build             — Go bin, Python SDK, Java, AssemblyScript, examples
# ---------------------------------------------------------------------------
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. EVERY required context on develop has to
  # report here. The list is tiers.yaml's `required_contexts` block; the count
  # is deliberately not repeated here, because it was -- in nine workflow files
  # at once -- and all nine said 32 while develop required 33 (cleat#1937).
  merge_group:
concurrency:
  # Every push gets its own group; PR runs share one per ref and supersede.
  #
  # `github.ref` is refs/heads/develop for EVERY merge, so keying the group on
  # it puts consecutive merges in one group. That discards a merge's own
  # verification, and `cancelled` is not `success` -- nothing downstream reads
  # it as a failure, so it disappears silently.
  #
  # `cancel-in-progress: false` is NOT enough to prevent that, which is the
  # part the first fix (#634) got wrong. It stops a *running* run being killed,
  # but GitHub still allows only one pending run per group: when a third push
  # enters an occupied group, the one waiting is cancelled before it ever
  # starts. Measured on develop after #634 merged (18:20:48Z on 2026-09-03),
  # 5 of 24 `Tier 1 Gate` push runs were cancelled -- every one with **zero
  # jobs**, killed within seconds of the next merge landing.
  #
  # The job count separates the two mechanisms, and does it cleanly. Of the 22
  # cancelled gate runs that day, the 17 before #634 have jobs=1 (killed
  # mid-run) with a single jobs=0 exception, and all 5 after it have jobs=0:
  #
  #   gh run view <cancelled-id> --json jobs --jq '.jobs | length'   # 0
  #   gh run view <success-id>   --json jobs --jq '.jobs | length'   # 1
  #
  # So #634 did exactly what it claimed and no more. The gate takes 20-40
  # minutes and merges land minutes apart, so the queue is almost always
  # occupied. Keying push runs on `github.sha` gives each merge a group of its
  # own: never queued, so never superseded.
  #
  # On a pull_request the group stays per-ref and cancellation is the setting's
  # real purpose: pushing twice to a branch should not run the suite twice.
  #
  # AND A BODY EDIT MUST NOT SUPERSEDE THE RUN IT RACES (cleat#1688).
  #
  # `edited` is subscribed above because a BASE CHANGE fires it and nothing
  # else does. But `edited` also fires for a title or body edit, and
  # `github.ref` is identical for EVERY pull_request activity type -- so the
  # edited run landed in the same group as the synchronize run it followed and
  # cancelled it. Editing a PR description while checks ran destroyed them, and
  # a superseded run renders as a failure rather than as "replaced", so the
  # symptom is a PR that looks broken because its author wrote a sentence.
  #
  # The fix is in the GROUP, not in a job-level `if:`. A conditional decides
  # whether JOBS execute; the cancellation happens when the RUN is created, so
  # a skipped-jobs run still supersedes. Giving the no-op edited run a group of
  # its own is what stops it cancelling anything.
  #
  # `github.run_id` is unique per run, so such a run shares a group with
  # nothing and cancels nothing. An `edited` that DID change the base keeps the
  # per-ref group: it is a real re-evaluation of a different target and should
  # supersede, which is the case the trigger exists for.
  #
  # WHY THE JOBS STILL RUN. Skipping them would need every one of the 33
  # required contexts to keep reporting while skipped, and cleat's contexts
  # come straight from their jobs with no aggregating gate. cleat-ports solves
  # exactly this with a `ports-gate` job carrying `if: always()` in front of
  # conditional work -- the pattern is known and it is a larger change than
  # this repo needs today. The cost here is bounded and smaller than it looks:
  # before, a body edit ran the suite once and threw away a partial run; now it
  # runs the suite once and KEEPS the run it used to destroy.
  #
  # `scripts/check-workflow-concurrency.sh` guards both halves.
  #
  # KEPT ON ONE LINE DELIBERATELY. check-workflow-concurrency.sh reads the
  # single line matching `^\s*group:` and asks whether it contains github.sha,
  # github.run_id or github.ref. A folded `>-` scalar hides the expression from
  # that grep, and the guard then reports this file as sharing one group across
  # pushes -- a false alarm, but a loud one. Fails in the safe direction; still
  # not worth triggering.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' && !github.event.changes.base && github.run_id || github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION_STABLE: "1.26"

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write

# ===========================================================================
# JOBS
# ===========================================================================
jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: CI package-coverage guard
        run: scripts/check-ci-package-coverage.sh

      # Two migrations sharing a version number are ONE row in
      # schema_migrations, because migration/runner.go takes the version from
      # the filename prefix. Both apply to a fresh database -- so CI is green
      # and stays green -- but a database that already recorded that version
      # never receives the other file, and the failures look exactly like the
      # stale-test-database case CLAUDE.md tells you to expect after a
      # migration lands. Three landed at once across three dialects (cleat#1071)
      # because everyone numbers against the develop they can see.
      #
      # Pure text, no Go needed, so it belongs here rather than in a test job.
      - name: Migration version-number guard
        # --self-test FIRST, and it is not ceremony. On a clean tree with no
        # exemptions, "no new collisions" is the same output a check that does
        # nothing would print, so passing proves only that the guard did not
        # false-alarm. The self-test builds a doctored tree and requires the
        # guard to REPORT a duplicate, pass a clean fixture, and ignore an
        # untracked worktree copy -- the three properties it would otherwise
        # only have claimed in a PR description, about a tree that no longer
        # exists.
        run: |
          python3 scripts/check_migration_numbers.py --self-test
          python3 scripts/check_migration_numbers.py

      # Required-context guard. Distinct from the package-coverage guard above,
      # which checks the test-go matrix against the FILESYSTEM: this one checks
      # the required-status-context list against tiers.yaml, so it catches a
      # tier-2 package that has quietly become a merge blocker. Five had.
      #
      # --self-test first, and it is load-bearing rather than decorative: it
      # already caught a gap in its own third check, which can only see
      # `Test Go (...)` contexts. A guard that cannot see the state it looks
      # for prints a confident green.
      - name: Required-context guard
        run: |
          scripts/check-required-contexts.py --self-test
          scripts/check-required-contexts.py

      # go.work's `go` directive must be >= every module it uses, and dependabot
      # raises those module directives while having no updater for go.work. So
      # every Go bump that moves the floor arrives with the workspace one
      # version behind, and `go build` refuses before compiling a line --
      # surfacing as eight red jobs whose logs each say something different,
      # none of them named for the two files that disagree. cleat#1708.
      #
      # --self-test first, for the same reason as the guard above: this check's
      # "OK" and a check that cannot fail look identical from the outside. Its
      # known-positive is the real #1607 state, and its parse failures exit 2
      # rather than 0, so a use block this script cannot read is reported
      # instead of being read as a clean workspace.
      - name: go.work floor guard
        run: |
          scripts/check-go-work-floor.sh --self-test
          scripts/check-go-work-floor.sh

      # go.mod's `go` directive is the project's real Go minimum. Two
      # onboarding files restate it in prose instead of reading it --
      # docs/tutorials/quick-start.md's "Go X+" line and
      # .devcontainer/devcontainer.json's image tag -- and both had drifted
      # a minor version behind go.mod before anyone noticed (cleat#2070).
      # Neither drift breaks a build, so nothing else catches it.
      - name: Onboarding Go version guard
        run: |
          scripts/check-onboarding-go-version.sh --self-test
          scripts/check-onboarding-go-version.sh

      # Secret scanning. Nothing in this repo looked for credentials until
      # 2026-09-05: gosec's G101 is not that tool (it fired 3 times here and was
      # wrong all 3), and #731 excluded G306 and every _test.go from gosec, both
      # of which carry a written note that they stop catching a committed secret.
      #
      # `gitleaks dir`, NOT `gitleaks git` -- the working tree, never the history.
      # The reason is measured and load-bearing; it is written out in full in
      # .gitleaks.toml. Short version: history holds one real, KNOWN, closed
      # credential that the project has deliberately decided not to rewrite, so a
      # history scan is permanently red on something nobody intends to fix.
      #
      # Pinned, like golangci-lint in lint-go, so a new upstream rule cannot turn
      # this red on a commit that changed nothing.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          # Invoked by absolute path, not by name. `go install` writes to
          # $(go env GOPATH)/bin, and that is NOT on PATH in this job -- the
          # first version of this step ran bare `gitleaks` and died with
          # "gitleaks: command not found", exit 127, AFTER the install had
          # succeeded. lint-go gets away with a bare `golangci-lint`, which is
          # what made this look safe; whatever the difference is between the two
          # jobs, the absolute path does not depend on it. It also matches how
          # the binary is invoked locally, so a local run and CI exercise the
          # same command.
          #
          # The path is resolved into a VARIABLE first, and that is the whole
          # of cleat#1674. A command substitution used as part of a word has
          # its exit status DISCARDED -- only the outer command's status
          # counts -- so `set -euo pipefail` could not see `go env GOPATH`
          # fail. On cleat#1673 its toolchain download failed transiently, the
          # substitution produced nothing, and the step tried to run
          # `/bin/gitleaks`. Measured, bash 3.2:
          #
          #   set -euo pipefail; "$(false)/bin/nope"   -> reaches the exec
          #   set -euo pipefail; x=$(false)            -> aborts, rc=1
          #   set -euo pipefail; x=$(sh -c 'exit 3')   -> aborts, rc=3
          #
          # The -n test is NOT belt-and-braces for the same failure, it is a
          # SECOND one: the assignment aborts only when `go env` exits
          # non-zero. If it ever exits 0 and prints an empty line, the
          # assignment succeeds and the path degenerates exactly as before.
          #   set -euo pipefail; x=$(printf '')        -> continues, x=""
          #
          # Why this is worth a guard rather than a re-run: the symptom is
          # exit 127, "binary not found" -- indistinguishable at a glance from
          # the failure the comment above describes as already fixed, which
          # gives a reader a documented, plausible, locally-correct story to
          # stop at. The discriminator is the path in the message:
          # `/bin/gitleaks` means GOPATH was empty; `gitleaks: command not
          # found` means the bare-name bug is back. The message below says so
          # rather than leaving it to be rediscovered.
          #
          # And exit 127 is loud today only because nothing follows it. Any
          # future `|| true`, `continue-on-error`, or tolerate-a-missing-tool
          # wrapper turns this into a green Lint with NO SECRET SCAN RUN,
          # which is the checks-never-started shape.
          gopath="$(go env GOPATH)"
          if [ -z "$gopath" ]; then
            echo "go env GOPATH returned empty, so the gitleaks path would" >&2
            echo "degenerate to /bin/gitleaks and the secret scan would not" >&2
            echo "run. This is cleat#1674, NOT the bare-name bug: that one" >&2
            echo "reports 'gitleaks: command not found'." >&2
            exit 1
          fi
          "$gopath/bin/gitleaks" dir . \
            --config .gitleaks.toml --no-banner --exit-code 1

      # A t.Skip is reported by `go test` as neither a pass nor a failure, and
      # so is read as a pass. That mechanism hid four separate defects found in
      # one session: a Postgres service with no published port (twice), a
      # renamed DURABLE_TEST_DB, and a compose cluster whose workers were all
      # crash-looping while the job reported success. The baseline records
      # every skip that exists today; a new one, or a growing one, fails here.
      - name: Conditional-skip guard
        # --self-test FIRST, and it is not ceremony here -- it is the thing
        # whose absence let cleat#1740 live in the committed baseline. This
        # guard compares its own scan against a baseline generated from that
        # same scan, so until now nothing asserted what it ATTRIBUTES a skip
        # to. Four skips were credited to two functions containing none, the
        # totals balanced, and `--update` reproduced the error faithfully on
        # every regeneration.
        #
        # The self-test scans a fixture whose correct answer is known
        # independently of this script, and asserts the attribution by name in
        # both directions: a skip inside a method belongs to that method, and
        # no skip may be credited to the plain function above it.
        run: |
          scripts/check-skips.sh --self-test
          scripts/check-skips.sh

      # A test double that never reads the parameter its test is named after
      # cannot fail for the reason the test exists. That is not hypothetical:
      # reprocess never read Idempotency-Key (cleat#1167), and the two tests
      # asserting idempotency passed on the broken code because their double
      # returned "already started" whatever it was handed. Sabotaging the start
      # path -- the one that WORKED -- left them green too.
      #
      # This is a ratchet over a baseline, not a defect detector: some flagged
      # doubles ignore the argument deliberately, and the script's header says
      # which. It also cannot see a double whose test is named for the concept
      # rather than the parameter, so it does not replace sabotaging the read
      # and running the suite. CONTRIBUTING.md carries that procedure.
      - name: Blind test-double guard
        # --self-test FIRST, same as the guards below. Nothing asserted what
        # findblinddoubles.go attributes until cleat#1764: the baseline is
        # regenerated from its own scan, so a rule that silently stopped
        # matching would shrink the baseline and report OK. The self-test drives
        # the real scanner over a fixture holding both directions -- a double
        # blind to the parameter its test is named for, and one that reads it --
        # and neither "reports everything" nor "reports nothing" survives it.
        run: |
          scripts/check-blind-doubles.sh --self-test
          scripts/check-blind-doubles.sh

      # Added by WS-1 rather than WS-3, who own this file, because an unwired
      # guard is worse than none -- it reads as coverage nobody has. Said here
      # rather than only in the PR, per WORKSTREAM.md's protocol for this file.
      #
      # Fails when a host call stops being exercised by any workflow fixture.
      # A call no fixture makes is one no test compiles and no test runs, which
      # is how four Go host calls shipped uncompilable (IMPROVEMENT-PLAN 3.204)
      # and how the Python end-to-end test's coverage stayed one method wide
      # (3.205). The baseline can only shrink; a rise is reported, not failed.
      - name: SDK host-call coverage guard
        run: scripts/sdk-host-call-coverage.py --check

      # The EXECUTED half, which is a different question and the one that
      # matters. The guard above is at 100% on all five SDKs and says only that
      # a fixture compiles the call; every binding defect found on 2026-09-04
      # and 09-05 compiles. This one counts calls a fixture some test BUILDS
      # AND RUNS, and it reads 26/37/10/8/7 -- so the two numbers must never be
      # allowed to substitute for each other, which is why they sit in separate
      # baseline keys and separate steps.
      #
      # It also checks WIRING in both directions, because a declared list with
      # no check is worth nothing:
      #   * a declared fixture's test exists and some job's -run selects it
      #     (3.211: a harness sat in the tree, green, selected by no pattern);
      #   * every -run pattern in every workflow selects a test that exists
      #     (a pattern matching nothing prints "ok ... [no tests to run]" and
      #     exits 0 -- CLAUDE.md's TestTenantIsolationAcrossDialects case).
      # Same file-ownership note as above: this is WS-3's file, and the guard
      # is unwired without the step.
      - name: SDK host-call EXECUTED coverage guard
        # The negative control runs in CI, every time, deliberately.
        #
        # This step names a mode in a YAML file nobody re-reads. Until
        # 2026-09-05 an unrecognised mode fell through to the report path and
        # exited 0, so one transposed character here would have turned the
        # guard into a report with the job still green (WS-3). The script now
        # rejects an unknown mode, and this asserts that it does -- because a
        # guard whose own invocation cannot be shown to fail is the thing this
        # step exists to prevent.
        run: |
          if scripts/sdk-host-call-coverage.py --a-mode-that-does-not-exist >/dev/null 2>&1; then
            echo "argument validation is broken: an unknown mode exited 0," >&2
            echo "so a typo in the line below would pass silently." >&2
            exit 1
          fi
          scripts/sdk-host-call-coverage.py --check-executed

      - name: ABI doc/code consistency guard
        run: scripts/check-doc-consistency.sh

      # The Python SDK's own surface, which the guard above deliberately
      # excludes: an SDK states a different denominator from the engine's and
      # is allowed to differ from it. Five sites stated a number for it and
      # nothing checked any (cleat#1418). --self-test first, because on a
      # correct tree "every number agrees" and "the extractor matched nothing"
      # print the same kind of success.
      - name: Python SDK surface guard
        run: |
          scripts/check-python-sdk-surface.py --self-test
          scripts/check-python-sdk-surface.py

      # Plugin tables share one flat, unqualified namespace, and CREATE TABLE
      # IF NOT EXISTS checks the NAME, not the shape -- so a second plugin
      # claiming a name is a silent no-op recorded as a successful migration,
      # surfacing much later as "column does not exist" (cleat#1288).
      # --self-test first: on a clean tree "no collisions" and "the scan is
      # broken" print the same kind of success.
      - name: Plugin table namespace guard
        run: |
          scripts/check-plugin-table-namespace.py --self-test
          scripts/check-plugin-table-namespace.py

      # Three workstreams append sections to IMPROVEMENT-PLAN.md at once, each
      # picking the next free number against a develop that has already moved.
      # The collision exists only in the merge, and a duplicate heading renders
      # perfectly. Four of them landed on 2026-09-02 alone (1.3, 2.70, 3.77,
      # 3.78); the damage is the cross-references that rot around them.
      #
      # Since 2026-09-04 the numbers are allocated in per-stream blocks
      # (scripts/section-blocks.sh), which makes the collision impossible rather
      # than merely detected. The self-test runs first and is not optional: the
      # block check is a classifier, and a classifier that returned "fine" for
      # every input would pass the real check silently forever.
      - name: Plan section-number guard
        run: |
          scripts/check-section-numbers.sh --self-test
          scripts/check-section-numbers.sh

      # IMPROVEMENT-PLAN.md's status markers are read by hand, by the archiver,
      # and by the scan CLAUDE.md publishes. The scan was two clauses joined by
      # OR that matched ZERO headings in common for its whole history -- the word
      # clause allowed nothing between the em-dash and the marker word, so any
      # symbol defeated it, which meant the fallback was guaranteed to be absent
      # in exactly the case it existed for. Measured 2026-09-16 over 295
      # headings: 0 overlap, now 238.
      #
      # Only the self-test runs here, and deliberately. The reporting mode lists
      # headings carrying no status at all, and two on develop (2.8, 2.12) have
      # carried none since 2026-09-08 -- gating on it would turn this into a red
      # that this change is not the one to fix. The self-test is the part with a
      # known-positive behind it: six fixtures, each of which fails if ONE clause
      # is reverted rather than being rescued by the other, plus a check that the
      # copy of the scan published in CLAUDE.md still agrees with the script.
      - name: Plan status-marker guard
        run: scripts/check-plan-markers.py --self-test


      # Plan cross-references, after cleat#1727 split the open sections into
      # IMPROVEMENT-PLAN.d/. R3 exists because breaking a §N.M is the failure
      # that made "delete the closed sections" unimplementable, so the split is
      # only safe while every reference still lands somewhere.
      #
      # THE SELF-TEST IS THE GATED HALF, for the same reason as the marker guard
      # above rather than by analogy with it: the full check reports five
      # references that resolve to nothing on develop TODAY -- §2.59, §3.93,
      # §3.170, §3.889, §7.4 -- and all five predate the split. Measured by
      # running the identical checker against the pre-split tree in a worktree:
      # 18 dangling before, 17 after, and ZERO introduced. Two of them (§3.170,
      # §3.889) look like a duplicated digit for sections that do exist (3.17,
      # 3.89), but fixing a reference means knowing where its author meant it to
      # point, and guessing would invent a link rather than repair one.
      #
      # The self-test is not a weaker check, it is a different one: it asserts
      # the checker can still tell the plan's TWO namespaces apart. A §N.M does
      # not always name a `### N.M` heading -- the Phase 2 table carries rows in
      # the same shape, and §2.4/§2.5/§2.7 are cited from code and resolve to
      # rows. It drives a deliberately headings-only reading and FAILS if that
      # reading stops disagreeing, so a regression to one namespace cannot pass.
      - name: Plan cross-reference guard (self-test only, see above)
        run: scripts/check-plan-references.py --self-test


      # Two migration files in one dialect must not share a version number.
      # The runner keys schema_migrations on the filename's numeric prefix, so
      # they collapse to one row: a fresh database applies both (which is why
      # every other job here stays green), and a database that already recorded
      # that version never receives the other file -- silently, exit 0. See
      # cleat#1071 and the measurements in the script.
      #
      # Self-test first and not optional, for the reason the section-number
      # guard states: on a clean tree "no duplicates found" and "the check does
      # not work" are the same output, so this needs a KNOWN-POSITIVE rather
      # than only a negative control.
      - name: Migration version guard
        run: |
          scripts/check-migration-versions.sh --self-test
          scripts/check-migration-versions.sh

      # Nothing refused a large tracked blob on SIZE. `.gitignore` gained
      # `bin/` on 2026-08-09 after 332MB of tracked build products; cleat#1838
      # then wrote `go build -o .bin/cleat` and committed 62,095,458 bytes
      # straight past that rule, one character off it (`.bin/` != `bin/`).
      # Two gitignore rules now exist and the next output directory will pick
      # a third -- enumerating paths cannot catch a path nobody has thought
      # of yet. 25 MiB, chosen against a clean tree (the 62MB blob is gone,
      # #1858), admits this repo's two deliberate 19.3MB fixtures and would
      # have refused the accident by more than 2x. cleat#1859.
      - name: Tracked blob size guard
        run: |
          scripts/check-tracked-blob-size.sh --self-test
          scripts/check-tracked-blob-size.sh

      # A declaration inserted between a doc comment and the declaration it
      # documents. Go attaches doc comments by ADJACENCY, so the whole block
      # silently becomes the newcomer's documentation and the original is left
      # with none -- and nothing complains: gofmt accepts it, `go vet` accepts
      # it, and the golangci-lint config here enables no doc-comment linter
      # (measured 2026-09-16 with an unused variable as the known-positive, so
      # the silence is a result rather than a vacuous run).
      #
      # It is invisible in review -- the diff shows a function being added, with
      # correct content, in a plausible place -- and invisible in `git log`,
      # because the comment's text does not change. What changes is what it sits
      # above. Two instances: cleat#1717's PR, caught by hand, and
      # `wasm/exports.go` in f01e3973, which this guard found and which shipped.
      #
      # PULL REQUESTS ONLY, and that is a real limit rather than a convenience:
      # the check is a comparison, so a push build has no base to compare
      # against. A defect already on the base branch is invisible by
      # construction. Run it over history to find those.
      #
      # The base SHA is fetched explicitly because this job's checkout is
      # shallow (depth 1, the merge commit), so `origin/develop` does not exist
      # here and the guard would report UNMEASURED for every PR.
      - name: Doc-comment reattachment guard
        if: github.event_name == 'pull_request'
        run: |
          # --self-test first, and it is the half that matters. On a tree where
          # nothing moved, "no declaration lost its doc comment" is the same
          # output a guard that did nothing would print, so the self-test is
          # what distinguishes them: it requires the detector to REPORT a
          # planted defect, stay quiet on the control, key a method on its own
          # name, and not read a `func` inside a raw string literal as a
          # declaration. That last case was written as a limitation to document
          # and turned out to be a bug -- it was dropping 169 phantom
          # declarations' worth of noise from cmd/cleat-gen's code templates.
          python3 scripts/check-doc-comment-reattachment.py --self-test
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          python3 scripts/check-doc-comment-reattachment.py \
            ${{ github.event.pull_request.base.sha }} HEAD

      # The readiness scorecard is the document that answers "is cleat ready",
      # and it was the only doc-vs-reality surface with no guard. Measured on
      # 2026-09-18: 125 commits stale, still claiming four of ten bars missed
      # while nine of its ten gaps had closed.
      #
      # --self-test first, and it is the half that matters: on a document that
      # already agrees with the tracker, "OK" is what a guard that did nothing
      # would print. The self-test requires it to REPORT a closed gap presented
      # as open, a declined gap presented as open, an open gap claimed shipped,
      # and a link whose text and target disagree -- and to stay quiet on the
      # rows that are correct.
      - name: Readiness scorecard agrees with the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-readiness-doc.py --self-test
          python3 scripts/check-readiness-doc.py

      # The guard above can only ever run against a pre-merge base, so the
      # post-merge run on develop is the only place a merge-created collision
      # is visible. This one keeps that run from being cancelled by the next
      # merge -- see scripts/check-workflow-concurrency.sh for the measurement.
      - name: Workflow concurrency guard
        run: scripts/check-workflow-concurrency.sh

      # The concurrency guard above keeps a run from being DISCARDED. This one
      # keeps a run from never being CREATED: a workflow that filters
      # pull_request by branch and does not trigger on `edited` never runs for a
      # PR retargeted onto that branch, and such a PR reports CLEAN with only
      # the unfiltered workflows' checks. Checks that never registered are not
      # pending, so no downstream count can see it.
      - name: Workflow PR-trigger guard
        run: scripts/check-workflow-pr-triggers.sh

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # Must run after Setup Go (it shells out to `go mod tidy -diff`), unlike
      # the package-coverage guard above, which is pure bash.
      - name: Cross-module go.mod tidiness guard
        run: scripts/check-go-mod-tidy.sh

      # One contract for the non-workflow entities (cleat#1702): created_at,
      # updated_at, disabled_at, and none of the four older spellings of
      # "retired". Members convert one at a time, so most clauses are still
      # grandfathered; the list may only shrink.
      #
      # Since cleat#1719 it also reads migrations/mysql/ and migrations/mssql/
      # for MEMBERSHIP -- a table defined in only one dialect was invisible to a
      # Postgres-only scan rather than unclassified, which was the one place
      # total coverage still had a hole. Clause checks stay single-dialect,
      # because TIMESTAMPTZ is Postgres's spelling.
      #
      # --self-test FIRST, and here it is the only thing that means anything.
      # Today's schema is non-conforming BY CONSTRUCTION -- 23 of 40 clauses are
      # grandfathered -- so a green real run is equally consistent with "the
      # guard works" and "the grandfather list is carrying all of it". The
      # self-test builds a synthetic entity that breaks each clause separately
      # and requires a separate red for each.
      - name: Entity contract guard
        run: |
          python3 scripts/check-entity-contract.py --self-test
          python3 scripts/check-entity-contract.py

      # Catches code that is written, tested, passing, and wired to nothing --
      # which a test suite cannot catch, because the tests pass precisely
      # because they are the only callers. The baseline records the existing
      # backlog; only new additions fail. The size of that backlog moves with
      # ordinary work, so carry the command rather than the number -- this said
      # "69" from 2026-08-30 and was 60 when checked on 2026-09-16:
      #   grep -c . scripts/deadcode-baseline.txt
      - name: Test-only code guard
        # --self-test FIRST, same as the guards above, and for the reason this
        # step itself demonstrated: until cleat#1707 this guard printed
        #   ERROR: could not install honnef.co/go/tools/cmd/staticcheck@...
        #   OK: no new test-only code (0 known entries in the baseline).
        # and exited 0. A green step here meant "the tool ran and found
        # nothing new" OR "the tool was never installed", with nothing in the
        # exit status to tell them apart. The self-test asserts the second case
        # now fails.
        run: |
          scripts/check-test-only-code.sh --self-test
          scripts/check-test-only-code.sh

      # Sibling to the guard above: that one catches code called only from
      # tests (staticcheck U1000, -tests=false), but U1000 never reports
      # exported identifiers in a non-main package at all -- it assumes a
      # library's public API may have external callers. True for cleat/ and
      # pluginapi/; false for engine/, plugin/, wasm/, and friends, which
      # nothing outside this repo imports. engine/batch_flush.go and
      # plugin/audit.go both survived the guard above for exactly that
      # reason -- U1000 never even saw them as findings to baseline. This
      # step greps for exported func/method names declared in those
      # internal-only roots and flags the ones nothing in the tree, test or
      # production, ever spells. Baseline records the existing backlog (20
      # entries, all verified by hand -- see the commit that added it).
      - name: Dead-export code guard
        run: scripts/check-dead-exports.sh

      # Third sibling, and it closes the one shape the other two structurally
      # cannot see. U1000 skips EXPORTED identifiers -- correct for a library,
      # meaningless for `package main`, where nothing can import the package and
      # "exported" carries no information. An exported, test-only function in
      # cmd/ is therefore invisible to both guards above.
      #
      # Not hypothetical: #829 records StartAPIServer -- exported, package main,
      # called only by two tests, and the sole caller of registerRoutes, which is
      # why seven API routes were unreachable from the shipped binary. The
      # test-only guard reported "OK" on that tree.
      #
      # Measured 2026-09-06 with a matched pair in cmd/cleat-worker: an
      # unexported test-only func is caught by the guard above; the identical
      # exported one is not, and is caught here.
      #
      # deadcode computes reachability from main(), so exportedness never enters
      # into it. Baseline is 14 entries -- findings in cmd/'s OWN files only; the
      # whole-program set is ~400 and is the other two guards' ground.
      - name: Unreachable-from-main guard
        run: scripts/check-unreachable-main.sh

      # cleat#1412. The script has existed since #618 on 2026-09-03 and no
      # workflow had ever invoked it -- `git log -S 'check-hostfunc-budget'
      # -- .github/` was empty -- while
      # engine/wasmtime_hostbudget.go:138 and IMPROVEMENT-PLAN 3.90's A3 row
      # both named it, present tense, as the thing that enforces the rule.
      #
      # It catches a regression nothing else can see. A wasmtime host function
      # registered with a raw linker.FuncWrap WORKS: it registers, the guest
      # calls it, nothing errors. The only consequence is that time the host
      # spends on the guest's behalf is charged to the guest's epoch budget, so
      # a guest doing nothing wrong is killed early under load. No test fails.
      #
      # Verified in both directions before wiring, because a guard that passes a
      # clean tree is satisfied by every broken version of itself:
      #   clean                                      -> OK, 63 host functions, exit 0
      #   one raw linker.FuncWrap in wasmtime_wasi.go -> FAIL naming the line, exit 1
      - name: Host-function epoch-budget guard
        run: scripts/check-hostfunc-budget.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A workflow file that does not parse produces a run with *no jobs* --
      # a "startup failure" that reports red but cannot report why, and that
      # no step inside that workflow can ever catch. ai-pr-review.yml and
      # release-notes-check.yml were both in that state: an unindented block
      # inside a `script:`/`run:` scalar ended it early, so neither check had
      # ever actually run on any PR. This step catches the next one, from a
      # workflow that does parse.
      #
      # (Both files were deleted on 2026-08-07: parsing turned out to be the
      # first of four reasons release-notes-check.yml gated nothing, and
      # ai-pr-review.yml ran for months posting only "AI review unavailable".
      # See IMPROVEMENT-PLAN 1.12a and 1.12b. The guard below is unaffected;
      # it walks whatever files are present. Worth keeping in mind when it
      # next fires: a startup failure hides every other defect in the file
      # behind it, so making a workflow parse is where the investigation
      # starts, not where it ends.)
      - name: Workflow files parse
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              sys.exit("no workflow files found -- this check would pass vacuously")
          for path in files:
              try:
                  doc = yaml.safe_load(open(path))
              except yaml.YAMLError as e:
                  bad.append(f"{path}: {e}")
                  continue
              # `on:` parses as the boolean True in YAML 1.1, which is why it
              # is checked by identity rather than by name.
              if not isinstance(doc, dict) or "jobs" not in doc:
                  bad.append(f"{path}: parsed but has no top-level 'jobs:' key")
          for b in bad:
              print(f"::error title=Unparseable workflow::{b}")
          print(f"checked {len(files)} workflow files, {len(bad)} broken")
          sys.exit(1 if bad else 0)
          PY

      # Four structural guards over the workflows, each catching a CLASS that
      # has already cost a session to find one instance of by hand:
      #
      #   1. every context in .github/required-checks.txt resolves to a job
      #      that exists -- a context naming a job that is gone blocks every
      #      PR forever, and a job renamed out from under its context stops
      #      gating silently;
      #   2. no required job, and no step of one, waives its own failure --
      #      #370 and #373's shape;
      #   3. no `services:` image on a floating tag -- #377's shape;
      #   4. every `--filter ancestor=<ref>` names an image pinned in the same
      #      file -- the trap found while pinning SQL Server, where that filter
      #      matches on the pull reference, so pinning `image:` alone leaves
      #      `docker exec` with an empty container ID.
      #
      # The script fails on anything it cannot analyse -- an unexpandable
      # matrix, an unresolvable expression, an empty context list -- rather
      # than passing. Every guard was verified by breaking what it guards and
      # reading the message; see the PR that added it.
      #
      # It does NOT verify required-checks.txt against the live branch
      # protection: that needs an admin token, which GITHUB_TOKEN is not.
      # `scripts/check-workflow-guards.py --verify-against-api` does, for a
      # human with one. A green Lint is not evidence that the file matches the
      # API, and the file says so at the top.
      #
      # pyyaml comes from the "Workflow files parse" step above; this step must
      # stay after it.
      - name: Workflow integrity guards
        run: scripts/check-workflow-guards.py

      # Dependabot coverage. Two directions, both silent without this: an entry
      # naming a directory that does not exist is skipped by Dependabot with no
      # error at all, and a manifest in no entry gets security updates only.
      # `renovate.json` sat in this repository configuring a bot that had opened
      # zero PRs here, which is the first failure mode at whole-file scale
      # (cleat#1321).
      #
      # Placed HERE, after "Workflow files parse", for the reason the step above
      # gives: that step installs pyyaml and this guard imports it. Note the
      # Required-context guard at step 4 also imports yaml and passes today, so
      # pyyaml is evidently preinstalled on ubuntu-latest -- but the install is
      # the only thing in this file that GUARANTEES it, and depending on a
      # runner image's contents is how a guard stops running without failing.
      #
      # --self-test first, and it is two KNOWN-POSITIVES rather than a clean
      # run: doctored configs the guard must report. A guard that passes a good
      # tree has demonstrated nothing, because every broken version does that.
      - name: Dependabot coverage guard
        run: |
          python3 scripts/check_dependabot_coverage.py --self-test
          python3 scripts/check_dependabot_coverage.py

      # The skip-budget guard's own controls. It runs per test job against that
      # job's report; this runs its two KNOWN CASES -- a build failure must be
      # reported as one, and a healthy report must still report a ledger
      # shortfall -- so that a change breaking either is caught here rather
      # than by a confusing message on someone else's PR (cleat#1388).
      - name: Skip budget guard self-test
        run: scripts/check-skip-budget.sh --self-test

      # Ruff, promoted back into this required job on 2026-08-08. It ran here
      # before under `continue-on-error: true`, which meant it could not fail a
      # build and -- worse -- reported `success` in the REST jobs API, so the
      # waiver looked like a passing tool. It was moved to `Lint (advisory)`
      # while its backlog was worked off, and the backlog is now zero.
      #
      # Pinned, and must match `required-version` in python-sdk/pyproject.toml.
      # Ruff's default rule set moves between releases, so an unpinned install
      # silently changes what this required check means; on the same tree,
      # 0.6.9 reported 3 findings and 0.16.2 reported 260. ruff itself refuses
      # to run on a mismatch, so the two cannot drift silently -- but bump them
      # in the same PR, deliberately, reading the release's rule-set changes.
      #
      # No `continue-on-error` here, and guard 2 in check-workflow-guards.py
      # above now fails this job if anyone adds one to a required job or any of
      # its steps.
      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Ruff check
        run: ruff check python-sdk/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Pinned to a released binary rather than apt, because ShellCheck's
      # findings differ by version and apt's version floats with the runner
      # image. This was not theoretical: the promotion below failed its first
      # CI run on two findings that shellcheck 0.11.0 does not report at all --
      # SC2317 and SC2015, in files that already carried suppressions written
      # against the newer code names (SC2317 was split into SC2329 in 0.10). So
      # the repo passed locally and failed in CI on the same source, which is
      # the ruff problem fixed in #403 wearing different clothes: a linter whose
      # strictness is set by whoever built the runner image.
      #
      # Bump deliberately, reading the release notes for new checks, rather than
      # inheriting one from an image refresh.
      - name: Install lint tools
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          # Downloaded to a file, not piped into tar, and --retry-all-errors is
          # not optional. Both halves matter; measured with curl 8.7.1 against a
          # server that aborts the first request mid-body:
          #
          #   --retry, piped        -> tar gets 4096 of 8192 bytes, no retry at all
          #   --retry, to a file    -> exit 18 (PARTIAL_FILE), no retry at all
          #   +all-errors, piped    -> tar gets 12288 bytes: the first attempt's
          #                            partial body followed by a whole second copy
          #   +all-errors, to file  -> exit 0, 8192 bytes  <- this
          #
          # Plain --retry only covers transient HTTP status codes (408, 429, 5xx)
          # and connection failures, so it would not have retried the mid-transfer
          # aborts this repo actually hits. And once retrying works, piping is
          # unsafe: curl restarts from byte 0 while tar has already consumed the
          # first attempt.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          # TRUST ON FIRST USE, and weaker than it looks -- say so rather than
          # let the next reader assume this is verification.
          #
          # koalaman/shellcheck publishes no checksum file and no build
          # attestation (`gh attestation verify` -> HTTP 404, measured
          # 2026-08-30), so there is no upstream value to check against. This
          # digest is simply what the release served when the pin was written.
          # It cannot tell you the artifact is what upstream intended; it can
          # only tell you it has not CHANGED since, which is the actual threat
          # for a mutable GitHub release asset.
          #
          # Contrast tier1-gate.yml's wasm-tools pin, which is attested, and
          # #474's Gradle wrapper, whose checksum gradle.org publishes.
          # If shellcheck ever ships attestations, replace this with
          # `gh attestation verify`.
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # ShellCheck, promoted into this required job on 2026-08-08 -- the last
      # of the two linters that ran here under `continue-on-error: true`. Its 7
      # findings are fixed; four were SC2164, `cd "$REPO_ROOT"` with no failure
      # branch, in guard scripts whose whole job is to inspect a particular
      # tree.
      #
      # Must stay after "Install lint tools" above, which is what apt-gets
      # shellcheck. Placed before it on the first attempt, where it failed with
      # `shellcheck: command not found` -- a step ordered before its own
      # dependency fails loudly, which is the good case; the bad case is the
      # one this file is otherwise about.
      - name: ShellCheck
        # .githooks/* included since 2026-09-04: the pre-commit hook shipped in
        # #706 with a defect and nothing linted it. It sources
        # scripts/section-blocks.sh, which is an input here, so SC1091 resolves.
        #
        # benchmarks/*.sh was dropped here when benchmarks/compare.sh -- the only
        # shell script that directory ever had -- moved to cleat-bench. Left in
        # place it does not degrade to "lints nothing": with no match the literal
        # `benchmarks/*.sh` reaches shellcheck, which exits 2 and fails this job.
        # That is the loud failure and it is the good case. The quiet one was that
        # the list was hand-maintained: four tracked .sh files had never been in
        # it -- deploy/postgres/{100-apply-migrations,900-app-role}.sh,
        # examples/python-langchain/crash_demo.sh, and
        # crates/cleat-java/scripts/inject-metadata.sh. Fixed here (#768): the
        # set is now derived from git rather than typed, so a new script is
        # covered the moment it is tracked and nobody has to remember this line.
        #
        # git ls-files, not a glob or `find`: a glob does not recurse and `find`
        # descends into .claude/worktrees/, a second copy of the repo. Same
        # reason CLAUDE.md gives for preferring it in anything that reasons about
        # "the repo".
        run: git ls-files '*.sh' '.githooks/*' | xargs shellcheck

      # CGO on. With CGO_ENABLED=0 this step analysed a build that is not the
      # one we ship: `//go:build cgo` takes eight files out of ./engine/,
      # including backend_wasmtime.go -- the backend of record -- and all four
      # wasmtime_hostfuncs*.go, the ABI boundary CLAUDE.md names as the source
      # of four real defects. backend_wasmtime_stub.go was vetted in its place.
      #
      #   comm -13 <(CGO_ENABLED=0 go list -f '{{$d:=.Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}' ./... | sort) \
      #            <(CGO_ENABLED=1 go list -f '{{$d:=.Dir}}{{range .GoFiles}}{{$d}}/{{.}}{{"\n"}}{{end}}' ./... | sort)
      #
      # Verified 2026-08-07 by injecting `fmt.Sprintf("%d", "not-an-int")` into
      # backend_wasmtime.go: CGO_ENABLED=0 vet reported nothing, CGO_ENABLED=1
      # reported it. Vet is clean across ./... with CGO on, so this costs
      # nothing to switch on.
      - name: Go vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Clippy (cleat-macro)
        working-directory: crates/cleat-macro
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (cleat-sdk)
        working-directory: crates/cleat-sdk
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (cleat-test)
        working-directory: crates/cleat-test
        run: cargo clippy --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # The `Lint (advisory)` job stood here from 2026-08-07 to 2026-08-08.
  #
  # It existed because Ruff and ShellCheck ran inside the required `Lint` job
  # under `continue-on-error: true` -- a required check running two linters
  # whose verdict was discarded, which is #370 and #373's shape one level
  # down. Worse, the REST jobs API reports `steps[].conclusion: success` for
  # any step carrying that waiver, so reading it showed two passing tools. It
  # did not; running them showed 260 and 7 findings respectively.
  #
  # A separate non-required job was the honest interim: it goes red visibly on
  # the PR rather than hiding inside a green required check, while its backlog
  # is worked off. Both backlogs are now zero and both linters are steps in
  # `Lint` above, so the job is deleted rather than left as a permanent green
  # -- a job with nothing left to advise is the same defect in a new costume.
  # (It had in fact gone permanently RED on develop while ShellCheck's 7 sat
  # unfixed, which is equally uninformative and is what prompted finishing it.)
  #
  # Kept as a comment rather than deleted outright because `git log` does not
  # answer "why is there no advisory job" for someone about to add one back.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Lint Go (golangci-lint)
  # -------------------------------------------------------------------------
  lint-go:
    runs-on: ubuntu-latest
    env:
      # CGO on, for the reason given on the Go vet step above: at 0, the eight
      # `//go:build cgo` files in ./engine/ are not part of the build, so
      # golangci-lint never reads the wasmtime backend or its host functions.
      # This is a required status check, and it was reporting on a build that
      # does not ship.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Derived from go.work rather than pinned to a literal. This job was
          # the last place asserting a 1.25 floor -- eleven required contexts
          # are named "on 1.26" and two workflows set 1.26 in an env var -- so
          # the literal was not holding a supported minimum, it was drifting
          # from one. cleat#1708: it also meant the obvious repair for a
          # go.work/go.mod skew (raise go.work) moved this job from green to
          # red, which is how a one-line fix turned into a policy question.
          go-version-file: 'go.work'
      # gofmt as its own step, not as a golangci-lint linter.
      #
      # This file's header comment has listed gofmt among the enabled linters
      # for as long as it has existed, and it was never enabled: .golangci.yml
      # only ever *disables* linters, and gofmt is not in golangci-lint's
      # default set (errcheck, gosimple, govet, ineffassign, staticcheck,
      # unused). So the gate did not exist, and cmd/cleat-worker/config.go sat
      # unformatted on develop with CI green.
      #
      # Run directly rather than by adding gofmt to .golangci.yml, because
      # that config excludes ".*_test\.go$" from every linter -- which would
      # leave the majority of the repo's Go files outside the check that is
      # being added to catch exactly this.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '/testdata/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            echo >&2
            echo "Run: gofmt -w <file>" >&2
            exit 1
          fi
          echo "OK: all Go files are gofmt-clean."

      # --timeout, because golangci-lint's default is one minute and this job
      # has been finishing inside it only by virtue of a warm build cache.
      #
      # Measured 2026-08-06. On develop the whole job -- checkout, setup-go,
      # gofmt, `go install`, and the run -- takes 75s, because
      # actions/setup-go restores GOCACHE and golangci-lint re-analyses almost
      # nothing. On a cold cache, on this runner, it does not finish:
      #
      #   level=error msg="Timeout exceeded: try increasing it by passing --timeout option"
      #   ##[error]Process completed with exit code 4.
      #
      # "On this runner" is load-bearing and was checked rather than assumed.
      # The same cold run on an M-series Mac takes 16s:
      #
      #   GOCACHE=$(mktemp -d) CGO_ENABLED=0 GOTOOLCHAIN=local \
      #     golangci-lint run ./...        # 16s, exit 0
      #
      # So the margin is a property of ubuntu-latest, not of the tree, and no
      # local run can tell you whether this job is close to its limit. That is
      # itself the argument for not leaving the limit at the default.
      #
      # The way it surfaced is the reason this is worth fixing rather than
      # working around. PR #325 bumps
      # actions/setup-go from v5 to v7, and v7 computes a different cache key,
      # so it cannot read what v5 wrote. Same runner, same Go 1.25.12, same
      # `cache: true`:
      #
      #   v5:  Cache hit for: setup-go-Linux-x64-ubuntu24-go-1.25.12-f850121d...
      #   v7:  Cache is not found
      #
      # GitHub Actions only writes a cache from the default branch, so a PR run
      # cannot seed the v7 key -- and lint-go is a required check, so the bump
      # cannot land to seed it either. The bump was therefore permanently
      # unmergeable, failing on a check that says nothing about its diff, and
      # the failure reads exactly like a flake: re-running produced the same
      # error twice, which is the only reason it was not treated as one.
      #
      # 5m is chosen against the observed cold run rather than as a round
      # number: it exceeded 60s and the step as a whole ran 112s including
      # `go install`, so 5m leaves room for a slower runner without being so
      # large that a genuinely hung lint sits there for the job's full budget.
      #
      # The deeper point is that a lint gate whose pass depends on a cache hit
      # is one eviction away from a red build on an unchanged tree. The timeout
      # should bound the analysis, not the cache.
      # `./...` STOPS AT MODULE BOUNDARIES, which is why this loops.
      #
      # This step ran `golangci-lint run ./...` from the repo root until
      # 2026-08-08, and Go's `./...` does not descend into a nested module. So
      # `cleat/` -- the PUBLIC SDK module, the one external users import -- and
      # `cleat/backendkit` had never been linted by anything, while a required
      # check called `lint-go` went green. Exactly the gap #408 fixed for
      # govulncheck, in the job whose entire purpose is linting.
      #
      # The module list is derived the same way `scripts/check-go-mod-tidy.sh`
      # and the govulncheck step below derive theirs. Three copies of one find
      # is one too many, but making them agree by construction is a refactor of
      # its own; what matters here is that this one does not invent a fourth
      # set of exclusions.
      #
      # Cost, measured 2026-08-08 on an M-series Mac with a cold lint cache:
      # cleat/ 3.5s (47 files), cleat/backendkit 1.6s (6 files), against the
      # root module's 764 files. The --timeout is per-invocation, so the loop
      # does not eat into the root module's budget.
      - name: golangci-lint (all first-party modules)
        run: |
          set -uo pipefail
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.7
          cfg="$PWD/.golangci.yml"
          mods="$(find . -name go.mod \
                    -not -path './node_modules/*' -not -path '*/node_modules/*' \
                    -not -path './.claude/*' |
                  sed 's|/go\.mod$||; s|^\./||; s|^$|.|' | sort)"
          if [ -z "$mods" ]; then
            echo "::error title=lint-go::found no go.mod at all -- this lint would pass vacuously" >&2
            exit 1
          fi
          echo "linting modules:"; echo "$mods" | sed 's/^/  /'
          rc=0
          for m in $mods; do
            echo "::group::golangci-lint $m"
            ( cd "$m" && golangci-lint run --timeout=5m -c "$cfg" ./... ) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # -------------------------------------------------------------------------
  # Vulnerability check (govulncheck)
  # -------------------------------------------------------------------------
  build-documented-examples:
    name: Documented example builds
    runs-on: ubuntu-latest
    # Every `cleat build` an example README documents is run, and must succeed.
    # cleat#1814.
    #
    # Measured 2026-09-17: 18 example directories, 10 documenting a `cleat
    # build`, ZERO built by any workflow -- every `cleat build` string in this
    # file was inside a comment. So the commands we tell users to run were the
    # commands nothing ran, and that was load-bearing twice in one day: two
    # independent implementations of the Python determinism gate both refused
    # examples/python-langchain's documented command (cleat#1813), and cleat#1809
    # reached 51 passing checks with one unrelated lint failure between it and
    # develop.
    #
    # All 10 of 10 now. cleat#1854: the two Python examples' documented command
    # already worked (cleat#1836 fixed the relative --entry) -- this job just
    # installed no Python toolchain to run them. `pip install .` puts cleat_sdk
    # on the interpreter's own path, which the determinism gate (cleat#1833)
    # imports before componentize-py is ever consulted -- no PYTHONPATH needed.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install .
          pip install "componentize-py>=0.12.0"

      - name: Build the cleat CLI
        run: go build -o .bin/cleat ./cmd/cleat

      - name: Run every documented example build
        run: scripts/build-documented-examples.sh

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # CGO on, as above. A vulnerability scan that excludes the CGo path is
      # scanning something other than what ships -- and wasmtime is reached
      # through CGo, so at 0 this never traced a call into it.
      #
      # Measured 2026-08-07 on ./engine/: CGO_ENABLED=0 and CGO_ENABLED=1 give
      # identical output today, so this changes no current finding. It is
      # preventive rather than a fix for a live miss, and worth saying so
      # rather than implying it caught something.
      # EVERY first-party module, not just the root one. `./...` stops at a
      # module boundary, so `govulncheck ./...` run from the repo root reached
      # 0 of the 8 packages in cleat/ and 0 of the 1 in cleat/backendkit --
      # both of which have their own go.mod and their own dependency sets.
      # Verified 2026-08-08:
      #
      #   go list ./... | grep -c 'cleat-team/cleat/cleat'   -> 0
      #
      # This is the shape tiers.yaml grew a `modules:` list for, and the same
      # one that let wasm-demo sit un-compiled for three months (item 2 of
      # plans/ci-integrity-followup-plan.md): a separate module is invisible to
      # every command that walks the root one, and nothing says so.
      #
      # PREVENTIVE, NOT A CATCH -- stated plainly, the same way the CGO note
      # above is. Running it against the two uncovered modules on 2026-08-08
      # found only GO-2026-5856 (crypto/tls, fixed in go1.26.5), which is a
      # standard-library finding the root module reports too and which CI's
      # `go-version: stable` toolchain does not have. No module-specific
      # vulnerability was hiding here today. What was missing was the coverage.
      #
      # The loop fails if it finds no modules at all, because a scan that
      # silently covers nothing is what this whole job exists to not be.
      - name: govulncheck (all first-party modules)
        env:
          CGO_ENABLED: "1"
        run: |
          set -uo pipefail
          mods="$(find . -name go.mod \
                    -not -path './node_modules/*' -not -path '*/node_modules/*' \
                    -not -path './.claude/*' |
                  sed 's|/go\.mod$||; s|^\./||; s|^$|.|' | sort)"
          if [ -z "$mods" ]; then
            echo "::error title=govulncheck::found no go.mod at all -- this scan would pass vacuously" >&2
            exit 1
          fi
          echo "scanning modules:"; echo "$mods" | sed 's/^/  /'
          rc=0
          for m in $mods; do
            echo "::group::govulncheck $m"
            ( cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@latest ./... ) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # -------------------------------------------------------------------------
  # Test Go (matrix: Go version x package group)
  # -------------------------------------------------------------------------
  test-go:
    name: Test Go (${{ matrix.package.name }}) on ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        # Required. This job runs directly on the runner, not inside a
        # container, so the service's network is not shared with it -- without
        # an explicit host port mapping the container is simply unreachable,
        # and no amount of fixing the DSN helps. Combined with the localhost
        # -> ::1 issue and testutil.TestDB's t.Skipf, this job declared a
        # Postgres service, never once connected to it, and reported green for
        # its entire existence.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 127.0.0.1, NOT localhost. On GitHub runners localhost resolves to ::1
      # first, while a service container publishes its port on IPv4 only, so
      # the connection is refused. testutil.TestDB used to turn that refusal
      # into a t.Skipf -- so this job spun up a Postgres service, never reached
      # it, skipped every Postgres-backed test, and reported green.
      #
      # TestDB now makes that distinction itself, per dialect: unconfigured is
      # a skip, configured-but-unreachable is a failure naming the redacted
      # DSN. (The requireBackendReachable preflight that f9bce35 bolted onto
      # one file was made redundant by that and has been removed.) Because this
      # variable is set here, a Postgres that stops being reachable now fails
      # this job instead of emptying it.
      CLEAT_TEST_DB: postgres://postgres:postgres@127.0.0.1:5432/cleat?sslmode=disable
      # tests/crash needs the owner DSN explicitly: it applies the migrations
      # itself (including 005_app_role.sql) and grants cleat_app a login, then
      # points the worker at cleat_app.
      #
      # This is the *base* DSN, and the suite does not run in the database it
      # names. It creates cleat_crash beside it -- and cleat_crash_migrate_target
      # for one test -- because engine/testutil's unqualified DELETEs would
      # otherwise reach a live worker's rows mid-test (see ensureCrashDatabase).
      # So the role here needs CREATEDB as well as CREATE/ALTER ROLE. Reading
      # this variable as "the database tests/crash uses" is what put the wrong
      # value behind --migrate-db until 2026-08-31.
      CLEAT_CRASH_DB: postgres://postgres:postgres@127.0.0.1:5432/cleat?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
        package:
          # cleat/ is a SEPARATE Go module (see the replace directive in
          # go.mod), so `go test ./cleat/...` from the repo root fails with
          # "main module does not contain package". It must run from inside
          # that module. This entry silently failed at setup for its entire
          # existence, masked by the missing pipefail.
          - name: core
            dir: cleat
            path: ./...
          # engine was here (-race, -p 1, postgres only) until cleat#2082
          # (2026-09-23). Measured 2026-09-21 through 2026-09-23: 7 PR
          # failures of this leg, 0 data races -- every catch was
          # skip-ledger bookkeeping (4) or a real test failure that Tier 1
          # Gate (required, all three dialects, no -race) also caught or
          # would have caught. It cost ~21 runner-minutes per PR for a check
          # Tier 1 Gate already makes, on the critical path, without
          # shortening it (Tier 1 Gate is equally long). ./engine/... under
          # -race now runs on a schedule instead -- see
          # .github/workflows/engine-race.yml, which uses the identical
          # env/service/flags this entry used and reports skips under the
          # same job-key ('test-go/engine') so scripts/skip-ledger.d/'s
          # existing engine lines keep meaning what they said. Per PR,
          # ./engine/... still runs -- via Tier 1 Gate, against postgres,
          # mysql and mssql, without -race.
          - name: wasm
            path: ./wasm/... ./wasmrw/...
          - name: internal
            path: ./internal/...
          - name: plugins
            path: ./plugins/...
            # -p 1 for the same reason the engine and support entries above
            # carry it (cleat#2063). At least 13 of the packages under
            # plugins/ are database-backed (auditlog, blobstore,
            # datadogexport, eventstore, eventtriggers, featureflags,
            # jobqueue, kafkaconnect, kvstore, notifications, ratelimiter,
            # scheduler, webhookingest), all pointed at the one PostgreSQL
            # service this job provides, and `go test` runs packages in
            # parallel by default. Measured 2026-09-23 on a merge_group run
            # (35878274795, job 107239811455): plugins/featureflags failed
            # cleat#982's foreign-session guard 1.8ms after plugins/eventtriggers
            # finished, with its still-open pool as the foreign session --
            # exactly the overlap CLAUDE.md's "-p 1" rule exists to prevent.
            # That failure dropped a CLEAN PR from the merge queue.
            flags: -p 1
          # packaging/ holds no production code -- only the Homebrew formula and
          # the guards that keep it internally consistent (that url names a tag,
          # that CGO_ENABLED=1 wraps the cleat-worker build, that the test block
          # runs --verify-backend). Cheap, needs nothing but a Go toolchain, and
          # unwired it would be a test suite no job runs, which is exactly what
          # check-ci-package-coverage.sh exists to refuse.
          - name: support
            path: ./plugin/... ./pluginapi/... ./auth/... ./migration/... ./migrations/... ./monitoring/... ./packaging/...
            # -p 1 for the same reason the engine entry above carries it, and
            # this entry did not until cleat#1666. THREE of these packages are
            # database-backed -- plugin, auth and migration -- and they point at
            # the one PostgreSQL service this job provides. `go test` runs
            # packages in parallel by default, so plugin and migration overlapped
            # for migration's entire 6.36s life in run 35047859194, and migration
            # failed at ~4.5s into that window with `tuple concurrently updated`
            # while applying 005_app_role.sql -- on a PR whose diff touched only
            # wasm/ and two testdata READMEs.
            #
            # CLAUDE.md states the rule: "Use -p 1 when running more than one
            # database-backed package in one invocation."
            #
            # NECESSARY, NOT SUFFICIENT. cleat#1599 already records that -p 1
            # does nothing across two `go test` PROCESSES; the cluster-wide
            # advisory lock is what covers that, and cleat#1666 is the half of it
            # that ./migration/ was missing. Both layers, or neither works.
            flags: -p 1
          - name: commands
            path: ./cmd/...
            # -p 1 for the same reason as the plugins entry above (cleat#2063).
            # Three of the nine packages under cmd/ are database-backed --
            # cleat, cleat-worker and cleatctl -- and this job provides one
            # PostgreSQL service they'd all share in parallel otherwise.
            flags: -p 1
          # tests/ is otherwise not in this matrix -- cluster/scale/soak need
          # infrastructure and plugin-harness and cross-language have their own
          # workflows. manifests needs nothing but a Go toolchain, and it is the
          # only thing that checks the shipped deployment manifests against the
          # binary they start.
          - name: manifests
            path: ./tests/manifests/...
          # integrity needs exactly what this job already provides: a
          # PostgreSQL service (CLEAT_TEST_DB, above) and CGO for the wasmtime
          # backend, which -race turns on anyway. It is where replay
          # determinism, checksum-chain verification, WAL corruption detection
          # and the durable-call ambiguity detector are tested -- 68 tests that
          # no job had ever run. Its budget is 0: everything in it runs here.
          - name: integrity
            path: ./tests/integrity/...
          # upgrade needs the same PostgreSQL service and nothing else. Its
          # subject is what survives a version change: schema migration without
          # data loss, an in-flight workflow keeping its old WASM version, and a
          # rolling worker restart neither losing work nor executing anything
          # twice.
          - name: upgrade
            path: ./tests/upgrade/...
          # scale needs the same PostgreSQL service. It is not a benchmark
          # gate -- it asserts correctness under concurrency (every workflow
          # reaches a terminal state, no workflow is claimed twice), and its
          # throughput numbers are logged, not asserted, so it does not fail on
          # a slow runner.
          - name: scale
            path: ./tests/scale/...
          # crash is §2.4. It needs the same PostgreSQL service, plus the
          # ability to CREATE/ALTER a role: it runs a real cleat-worker
          # subprocess on the shipped two-DSN configuration (--db as the
          # unprivileged cleat_app, --migrate-db as the owner) and SIGKILLs it
          # mid-DurableCall. Running it as the owner instead would silently
          # disable RLS, which is the class of defect it exists to catch.
          #
          # NOTE (WS-2 -> WS-3): .github/workflows/ is WS-3's under
          # WORKSTREAM.md's shared-files table. Added here rather than left unwired,
          # because check-ci-package-coverage.sh correctly refuses a suite no
          # job runs and UNWIRED_SUITES is how the last set of dead suites
          # accumulated. Move or restructure it freely.
          - name: crash
            path: ./tests/crash/...
          # NOTE (cleat-review -> WS-3): .github/workflows/ is WS-3's under
          # WORKSTREAM.md's shared-files table. Added here rather than left
          # unwired for the same reason the crash entry above gives -- a suite
          # no job runs is not coverage, and UNWIRED_SUITES is how the last set
          # of dead suites accumulated. Move or restructure it freely.
          #
          # hooks needs a Go toolchain and git, and nothing else: it runs
          # .githooks/prepare-commit-msg against throwaway repositories it
          # creates with `git init`, because the hook reads `git config` and
          # running it against this checkout would pass or fail according to
          # whose machine it ran on.
          - name: hooks
            path: ./tests/hooks/...
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Rust + wasm32-wasip1 (Rust WASM tests)
        if: matrix.package.name == 'internal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Run tests
        shell: bash
        working-directory: ${{ matrix.package.dir || '.' }}
        run: |
          # pipefail is required: without it `tee` supplies the exit status and
          # a failing `go test` is silently reported as a green step.
          set -o pipefail
          # Unquoted on purpose: some matrix entries list several package patterns
          # and rely on word splitting. Values are controlled by this file only.
          # -timeout 30m, not Go's 10-minute default. The Tier 1 Gate hit that
          # default on 2026-09-03 -- ran=6546 pass=6543 fail=0, then "panic:
          # test timed out after 10m0s" -- because it configures all three
          # DSNs. This job configures PostgreSQL only and still finishes well
          # inside 10m, so this is insurance rather than a fix: the number that
          # matters is the one the suite grows into, and -race makes this job
          # the slower of the two per test.
          go test -race -count=1 -timeout 30m ${{ matrix.package.flags }} -json ${{ matrix.package.path }} 2>&1 | tee test-report.json

      # A warning here was not enough. This job spun up a Postgres service it
      # could not reach, skipped every Postgres-backed test, emitted exactly
      # this warning, and reported green for its entire existence -- nobody
      # reads a warning on a green job. The budget makes it a failure.
      #
      # Budgets are derived from scripts/skip-ledger.tsv, which holds one line
      # per REASON a test may skip; a job's budget is the sum of its lines, so
      # no stream ever edits a shared total. The
      # check also fails when the report is missing or contains no test results
      # at all, because a test step that died before producing output has
      # skipped everything, which is the strongest form of the same bug.
      - name: Skip budget
        if: always()
        working-directory: ${{ matrix.package.dir || '.' }}
        run: ${{ github.workspace }}/scripts/check-skip-budget.sh 'test-go/${{ matrix.package.name }}' test-report.json

  # -------------------------------------------------------------------------
  # Test Python (matrix: 3.10 / 3.11 / 3.12)
  # -------------------------------------------------------------------------
  test-python:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # No continue-on-error. With it, this job could not fail the build, so the
    # Python SDK's own unit tests were advisory across all three versions -- and
    # they are the only thing that tests the SDK's Python-side behaviour at all.
    # The Cross-Language E2E job proves that a Python workflow compiles and
    # executes on wasmtime; it does not run this suite.
    #
    # Measured 2026-08-06 on a clean checkout: 442 passed, 1 skipped. The one
    # skip is tests/test_wasm_compilation.py's "componentize-py not installed",
    # and this job installs componentize-py -- so on the runner it should be 443
    # passed, 0 skipped. Re-derive (note: measured under 3.14, since that is
    # what this machine has; the matrix below is 3.10-3.12):
    #   python3 -m venv /tmp/v && /tmp/v/bin/pip install -q "./python-sdk[dev]"
    #   cd python-sdk && /tmp/v/bin/python -m pytest -q -rs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install "componentize-py>=0.12.0"

      - name: Run tests
        working-directory: python-sdk
        run: python -m pytest -v

  # -------------------------------------------------------------------------
  # Test Java
  # -------------------------------------------------------------------------
  test-java:
    name: Java Tests
    runs-on: ubuntu-latest
    # No continue-on-error. It was here, so this job could not fail the build,
    # and nobody had reason to look at it: measured 2026-08-06 on a clean
    # checkout, `gradle test` in crates/cleat-java runs 280 tests with 0
    # failures and 0 skips, so the exemption was protecting nothing. Re-derive:
    #   cd crates/cleat-java && gradle test --no-daemon
    #   grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml |
    #     awk -F'"' '{s+=$2} END{print s}'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Java tests
        working-directory: crates/cleat-java
        run: gradle test

  # -------------------------------------------------------------------------
  # Test AssemblyScript
  # -------------------------------------------------------------------------
  test-assemblyscript:
    name: AssemblyScript Tests
    # No continue-on-error. Measured 2026-08-06 on a clean checkout, `npm test`
    # in packages/cleat-as runs 106 assertions across three spec files, 106
    # passing -- so the exemption was protecting nothing, and meanwhile the one
    # job that could report an AssemblyScript regression could not fail. Note
    # `npm ci` has to run first: as-pect is a devDependency and `asp` is not on
    # PATH without it, which is why this cannot be reproduced by running npm
    # test alone in a checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/cleat-as
        run: npm ci

      - name: Run tests
        working-directory: packages/cleat-as
        run: npm test

  # -------------------------------------------------------------------------
  # Web Dashboard
  #
  # NOTHING RAN THIS BEFORE 2026-08-08. `grep -ln web .github/workflows/*.yml`
  # matched exactly one file, release.yml, and its step is a no-op -- it does
  # `cd cmd/cleat-worker/web && if [ -f package.json ]`, and that directory
  # contains only a prebuilt `dist/`, so it has always taken the else branch.
  # So the Svelte admin dashboard shipped with no build, no test and no type
  # check of any kind, while `web/` carried 4 test files and 79 real tests that
  # nobody ran.
  #
  # Two defects were sitting in it, both found the moment anything looked:
  #
  #   * src/App.svelte referenced `{id1}`/`{id2}` in markup. Svelte parses
  #     `{...}` as a live expression, so that was not placeholder text -- it
  #     named two variables that do not exist. svelte-check: 2 errors.
  #   * vite.config.ts built into `../cmd/durable-worker/web/dist`, a
  #     directory that does not exist in this repo. The real one is
  #     cmd/cleat-worker. `npm run build` created the wrong tree and left the
  #     shipped one untouched.
  #
  # Both fixed in the same PR as this job. Measured cost of the whole job:
  # under 15s (npm ci ~7s cold, check ~1.5s, test ~1s, build ~0.4s).
  #
  # WHAT THIS JOB DOES NOT DO, STATED SO IT IS NOT MISTAKEN FOR MORE:
  #
  #   * It builds to a THROWAWAY directory, not to cmd/cleat-worker/web/dist.
  #     That bundle is committed and has not been regenerated since 2026-06-06
  #     (fbaf7506, the same commit that broke outDir). Whether CI should
  #     rebuild and diff it is a release-process decision, not a lint one, and
  #     release.yml already has the cleanliness check that would enforce it
  #     once its build step is made real. Left alone deliberately.
  #   * 5 of 25 source files have any test coverage (cost.ts, api.ts,
  #     StatusBadge, SummaryCard). This job catches build breaks, type errors
  #     and regressions in those four. It would pass through a runtime
  #     regression in Dashboard, WorkflowDetail, ScheduleManagement or
  #     WorkflowCompare -- there is no browser or e2e test.
  #   * svelte-check reports 13 a11y warnings today. `npm run check` fails on
  #     errors, not warnings, so those do not gate. They are real and unfixed.
  # -------------------------------------------------------------------------
  test-web:
    name: Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 22, not 20: the web toolchain's own engines require it.
          # undici 8.10.2 (pulled by jsdom 30) declares node >=22.19.0; jsdom
          # 30.0.1 declares ^22.22.2 || ^24.15.0 || >=26.0.0; vitest 5.0.1
          # declares ^22.12.0 || ^24.0.0 || >=26.0.0. npm does NOT enforce
          # `engines` unless engine-strict is set, so on Node 20 all three
          # install happily and fail at runtime with
          # `webidl.util.markAsUncloneable is not a function` -- cleat#1359's
          # exact symptom, which persisted here after the version bumps because
          # the blocker was never the package pairing. cleat#1709.
          #
          # Bumped for this job only. The other three setup-node jobs
          # (AssemblyScript, AssemblyScript WASM, Build) do not use this
          # toolchain and are left on 20 rather than moved speculatively.
          node-version: "22"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Before build and test, because it is the one that found a real defect
      # and its failures are the most specific.
      - name: Type check (svelte-check)
        working-directory: web
        run: npm run check

      - name: Test
        working-directory: web
        run: npm test

      # Into RUNNER_TEMP rather than the configured outDir: this step asks
      # "does the dashboard build", and answering it must not entangle the
      # committed cmd/cleat-worker/web/dist bundle. See the note above.
      - name: Build
        working-directory: web
        run: npx vite build --outDir "$RUNNER_TEMP/web-dist" --emptyOutDir

      # A build that emits nothing exits 0. Cheapest possible guard against
      # this job going green on an empty output.
      - name: Build produced something
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/web-dist/index.html" \
            || { echo "::error title=Web Dashboard::build produced no index.html" >&2; exit 1; }
          echo "built: $(find "$RUNNER_TEMP/web-dist" -type f | wc -l) files"

  # -------------------------------------------------------------------------
  # Test Rust
  # -------------------------------------------------------------------------
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Test cleat-macro
        working-directory: crates/cleat-macro
        run: cargo test

      - name: Test cleat-sdk
        working-directory: crates/cleat-sdk
        run: cargo test

      # crates/cleat-test had no CI coverage of any kind before 2026-08-07 -- not this
      # job, and no clippy step either -- despite carrying 57 passing tests. That is how
      # an absurd_extreme_comparisons defect (`Duration::as_millis() <= 0`, where the
      # return type is u128) survived in it: nothing in CI ever compiled the crate.
      #
      #   grep -rn "cleat-test" .github/workflows/
      - name: Test cleat-test
        working-directory: crates/cleat-test
        run: cargo test

      - name: Verify WASM compilation
        working-directory: crates/cleat-sdk
        run: cargo build --target wasm32-wasip1 --release

  # -------------------------------------------------------------------------
  # Test AssemblyScript WASM compilation
  # -------------------------------------------------------------------------
  test-assemblyscript-wasm:
    name: AssemblyScript WASM Build
    runs-on: ubuntu-latest
    # continue-on-error removed 2026-08-07. It was protecting nothing: measured on
    # develop run 31193028xxx, every one of this job's steps -- Install SDK
    # dependencies, Install example dependencies, Build example WASM, Verify WASM output
    # exists and is non-empty, Inspect WASM exports -- reported success. A job that
    # cannot fail while passing anyway is indistinguishable from one that is broken and
    # forgiven, which is the whole reason nobody could tell what this repo tested.
    #
    #   gh run view <id> --json jobs \
    #     --jq '.jobs[]|select(.name=="AssemblyScript WASM Build")|.steps[]|"\(.conclusion)\t\(.name)"'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install SDK dependencies
        working-directory: packages/cleat-as
        run: npm ci

      - name: Install example dependencies
        working-directory: examples/as-workflow
        run: npm install

      - name: Build example WASM
        working-directory: examples/as-workflow
        run: npx asc assembly/index.ts --target release --transform ./node_modules/@cleat/transform/index.js

      - name: Verify WASM output exists and is non-empty
        working-directory: examples/as-workflow
        run: |
          if [ ! -f dist/workflow.wasm ]; then
            echo "ERROR: dist/workflow.wasm not found after build"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s dist/workflow.wasm)
          echo "WASM file size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -le 100 ]; then
            echo "ERROR: workflow.wasm is too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "workflow.wasm is valid (size: $FILE_SIZE bytes)"

      - name: Inspect WASM exports
        working-directory: examples/as-workflow
        run: |
          if command -v wasm-objdump &>/dev/null; then
            echo "=== WASM Exports ==="
            wasm-objdump -x dist/workflow.wasm 2>/dev/null | grep -A1 "Export\| - func\["
          elif command -v wasm2wat &>/dev/null; then
            echo "=== WASM exports (wasm2wat) ==="
            wasm2wat dist/workflow.wasm 2>/dev/null | grep "(export " | head -20
          else
            echo "No WASM inspection tools available. File size check passed."
          fi

  # -------------------------------------------------------------------------
  # Fuzz tests (WASM boundary)
  # -------------------------------------------------------------------------
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run fuzz tests
        run: |
          go test -fuzz=FuzzWASMMetadata -fuzztime=30s -run=^$ ./wasm/...
          go test -fuzz=FuzzULEB128 -fuzztime=30s -run=^$ ./wasm/...

      # 2>&1 rather than the warn-only version's 2>/dev/null, which discarded
      # the very output that would explain why a run produced no tests and then
      # reported "0 skipped". The budget check treats a report with no test
      # results at all as a failure, so that output has to be kept.
      #
      # Two steps, not one: a single `run:` block aborts on the first failing
      # command, so a failing go test would skip the check entirely. Splitting
      # them lets `if: always()` guarantee the budget is evaluated either way,
      # without `|| true` throwing away the exit status.
      - name: Collect wasm test report
        if: always()
        run: go test -json -count=1 ./wasm/... > fuzz-report.json 2>&1

      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh fuzz fuzz-report.json

  # -------------------------------------------------------------------------
  # Benchmarks (push to main only)
  # -------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch enough history for benchmark comparison
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run benchmarks
        run: go test -bench=. -benchmem -benchtime=30s ./benchmarks/ | tee bench-output.txt

      # benchmarks/workflows is its own module (github.com/cleat-team/cleat/
      # benchmarks/workflows) -- it imports the cleat/ SDK, which the root
      # module does not (see CLAUDE.md on the module cycle) -- so `go test
      # ./benchmarks/...` from the root no longer reaches it; `...` stops at
      # a nested module boundary the same way it already did for cleat/.
      # This is where BenchmarkSimpleWorkflow, BenchmarkFanOutWorkflow,
      # BenchmarkSagaWorkflow and BenchmarkLLMCallWorkflow moved when
      # cleat_bench_test.go moved out of the root module's benchmarks/ dir.
      # Appended (tee -a) to the same bench-output.txt so both halves land in
      # one trend-tracking upload.
      - name: Run SDK workflow benchmarks (benchmarks/workflows module)
        working-directory: benchmarks/workflows
        run: go test -bench=. -benchmem -benchtime=30s ./... | tee -a ../../bench-output.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90

      - name: Store benchmark result (trend tracking)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true

  # -------------------------------------------------------------------------
  # Build all targets
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Release Dry Run — exercise the release build on every PR, not first at a tag
  # -------------------------------------------------------------------------
  #
  # The release path had never executed. #514 fixed cleat-worker's build
  # (CGO_ENABLED=0 produced binaries that exited 1 at startup, because wasmtime
  # is the only WASM backend and the no-cgo stub returns
  # ErrWasmtimeCGOUnavailable) and added scripts/verify-release-worker.sh as a
  # goreleaser post-build hook. But `Release` only runs on a v* tag, so the two
  # genuinely new pieces -- the aarch64 cross-compile and running an arm64
  # binary under qemu -- would first have been exercised during an actual
  # release, where the failure mode is a broken or blocked release rather than
  # a red check on a PR.
  #
  # `goreleaser build` runs the same builds and the same post hooks as
  # `goreleaser release`, without publishing anything, so this is the release
  # path minus the upload.
  #
  # NOT a required check: .github/required-checks.txt mirrors branch protection,
  # and adding a line there without changing the repository setting would be a
  # doc that lies. Making this blocking is a settings change for a maintainer.
  release-dryrun:
    name: Release Dry Run
    # ubuntu-26.04, matching release.yml (cleat#2069) -- the .deb-install
    # step below needs to run on the same base the real release job pins to,
    # not whatever ubuntu-latest happens to mean this week.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # Must match the CC template in .goreleaser.yml's cleat-worker build. If
      # they drift, the arm64 link fails here rather than at the tag.
      - name: Install the arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross
          aarch64-linux-gnu-gcc --version
          # libc6-arm64-cross supplies /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1.
          # gcc-aarch64-linux-gnu alone links the binary but does not install the
          # loader it needs, so qemu-aarch64 fails with
          #   Could not open '/lib/ld-linux-aarch64.so.1': No such file or directory
          # which reads as a backend failure but is a missing sysroot. QEMU_LD_PREFIX
          # below is what points qemu at it.
          test -e /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1

      # scripts/verify-release-worker.sh executes every cleat-worker artifact
      # and has no skip branch, so the arm64 one needs binfmt to run at all.
      # Without this step it fails with "Exec format error" -- which is the
      # intended behaviour, not a reason to add a skip.
      - name: Set up QEMU for cross-architecture verification
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: GoReleaser build (no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
        env:
          # Where qemu-aarch64 looks for the guest's dynamic loader and libc.
          # Without it the arm64 post hook dies with "Could not open
          # '/lib/ld-linux-aarch64.so.1'" before cleat-worker's main runs.
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu

      # The post hook already ran --verify-backend on both workers, which is the
      # assertion that matters. This is the cheap independent confirmation that
      # the arm64 build is genuinely arm64 -- a cross-compile silently producing
      # x86-64 would pass a hook executed on an x86-64 runner.
      - name: Confirm the worker binaries are the architectures they claim
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r bin; do
            printf '%s\n  %s\n' "$bin" "$(file -b "$bin")"
            case "$bin" in
              *linux_arm64*) file -b "$bin" | grep -q 'ARM aarch64' ;;
              *linux_amd64*) file -b "$bin" | grep -q 'x86-64' ;;
              *) echo "::error::unexpected cleat-worker target: $bin"; exit 1 ;;
            esac
            found=$((found + 1))
          done < <(find dist -type f -name cleat-worker)

          # Without this the loop matching nothing would exit 0 -- the
          # "checks never started" shape CLAUDE.md is about.
          if [ "$found" -ne 2 ]; then
            echo "::error::expected 2 cleat-worker binaries (linux amd64 + arm64), found $found"
            exit 1
          fi

      # cleat#2064: release.yml also publishes a multi-arch cleat-worker image
      # to ghcr.io on a v* tag. amd64 only here, deliberately: measured on
      # #2076, the linux/amd64+linux/arm64 pair took 18m56s (16:27:42Z ->
      # 16:46:38Z) against this job's ~3.2min median on develop since
      # 09-21, because arm64 under QEMU emulates the whole build -- go
      # build, apt-get, the lot -- not just the final binary the way
      # goreleaser's cross-compiled arm64 verify above does. That is 6x this
      # job's normal cost on every PR and every queue batch, for an
      # architecture this job cannot push anyway (no ghcr credentials here,
      # correctly). amd64 alone still proves the Dockerfile builds and that
      # `RUN /cleat-worker --verify-backend` (see Dockerfile and
      # scripts/verify-release-worker.sh) passes -- the same assertion, on
      # the architecture this runner is native on. The arm64 leg is proven
      # weekly instead, in release-image-dryrun-arm64.yml, and for real on
      # every tag by release.yml itself.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build cleat-worker (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      # cleat#2069: install the .deb goreleaser just built and prove the
      # unit systemd sees is the one this PR shipped -- on a hosted runner,
      # not a container, so systemctl is the real thing rather than a
      # container-PID-1 workaround.
      - name: Install the cleat-worker .deb
        run: |
          set -euo pipefail
          deb=$(find dist -maxdepth 1 -name 'cleat-worker_*_linux_amd64.deb')
          if [ -z "$deb" ]; then
            echo "::error::no linux_amd64 .deb in dist/ -- nfpms didn't produce one"
            exit 1
          fi
          echo "installing $deb"
          sudo dpkg -i "$deb"

      - name: The package creates its own user, group and config, and the binary proves its backend
        run: |
          set -euo pipefail
          getent passwd cleat
          getent group cleat
          test -x /usr/bin/cleat-worker
          /usr/bin/cleat-worker --verify-backend

          stat -c '%U:%G %a' /etc/cleat/cleat-worker.env
          [ "$(stat -c '%U:%G %a' /etc/cleat/cleat-worker.env)" = "root:cleat 640" ] || {
            echo "::error::/etc/cleat/cleat-worker.env has unexpected owner/perms"
            exit 1
          }

      # Disabled by default is the acceptance criterion (cleat#2069) -- a
      # bare install must not leave a worker pointed at nothing running.
      - name: The unit is installed and disabled, not running
        run: |
          set -euo pipefail
          systemctl cat cleat-worker.service >/dev/null
          state=$(systemctl is-enabled cleat-worker.service || true)
          echo "is-enabled: $state"
          [ "$state" = "disabled" ] || { echo "::error::expected disabled, got $state"; exit 1; }
          systemctl is-active --quiet cleat-worker.service && {
            echo "::error::unit is active immediately after install"; exit 1;
          } || true

      # Proves systemd can actually invoke the binary end to end -- User=cleat,
      # EnvironmentFile parsing, the works -- not just that the unit file
      # parses. No real database is configured, so the worker is expected to
      # exit non-zero shortly after start; what this checks is that it GOT
      # to run (a log line from the worker itself, not a systemd unit error
      # like "bad configuration" or "permission denied").
      - name: Enabling and starting the unit actually invokes the binary
        run: |
          set -euo pipefail
          echo 'CLEAT_DATABASE_URL=postgres://cleat:cleat@127.0.0.1:1/nonexistent?connect_timeout=1'             | sudo tee /etc/cleat/cleat-worker.env >/dev/null
          sudo systemctl enable --now cleat-worker.service
          sleep 3
          sudo journalctl -u cleat-worker.service --no-pager | tail -40
          sudo journalctl -u cleat-worker.service --no-pager | grep -qi 'cleat' || {
            echo "::error::no cleat-worker output in the journal -- systemd never ran the binary"
            exit 1
          }
          sudo systemctl disable --now cleat-worker.service

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Go binaries
        run: |
          CGO_ENABLED=0 go build ./cmd/...
          echo "[+] Go binaries built successfully"

      - name: Build Rust crates
        run: |
          cd crates/cleat-macro && cargo build --all-targets
          cd ../cleat-sdk && cargo build --all-targets
          cargo build --target wasm32-wasip1 --release

      - name: Build AssemblyScript
        working-directory: packages/cleat-as
        run: |
          npm ci
          npm run build

      # `|| echo "non-blocking"` used to swallow the exit status here, which
      # made this step incapable of reporting anything but success. The Java
      # build is not flaky -- it is the same `gradle build` the Java Tests job
      # runs green -- so the escape hatch only served to hide a real break.
      - name: Build Java
        working-directory: crates/cleat-java
        run: gradle build

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install .
          pip install "componentize-py>=0.12.0"

  # -------------------------------------------------------------------------
  # Coverage (informational, non-blocking)
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Go coverage check
        run: make coverage-check

      - name: Run Python coverage
        run: make coverage-python

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 30

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ github.sha }}
          path: python-sdk/tests/coverage
          retention-days: 30

  # -------------------------------------------------------------------------
  # Cluster integration tests (requires Docker)
  # -------------------------------------------------------------------------
  cluster-tests:
    name: Cluster Integration Tests
    runs-on: ubuntu-latest
    env:
      # A database of the tests' own -- and, as of cleat#2012, a SERVER of its
      # own too.
      #
      # This job's purpose is to prove the cluster comes up and stays up. It
      # was also pointing `go test ./engine/...` at the cluster's own
      # database, so the store tests -- which create rows and then assert on
      # exactly those rows -- shared a table with four live workers claiming
      # from it. TestClaimWorkflow found its ready workflow already `running`;
      # TestListWorkflows_ByStatus found nothing ready; TestClaimSkipLocked
      # asked for 3 and got 10. Those tests are correct and the setup was not:
      # they assume exclusive ownership of the table, which no test sharing a
      # database with a running cluster can have.
      #
      # Giving it a separate DATABASE on cleat-postgres (below, historically)
      # fixed that, but not a sibling bug of the same shape one level up:
      # PostgreSQL's max_connections is a SERVER-wide ceiling, not a
      # per-database one, so TestForeignSessionsAnswersUnderPostgresConnectionExhaustion
      # -- which deliberately exhausts that ceiling to test a connection-
      # reservation fallback -- was exhausting a budget the live cluster's own
      # workers were also drawing from. cleat#2012: the cluster's pools set
      # SetConnMaxLifetime(5*time.Minute), so database/sql closes and reopens
      # worker connections in the background throughout a run this long,
      # independent of load; whenever that happened to land inside this
      # test's exhaust-then-probe window, a slot the test was relying on
      # staying occupied came free and its assertion that a fresh connection
      # must fail went straight through instead. The dedicated "Test Go"
      # matrix job never sees this: it gets its own service container with no
      # cluster anywhere near it. This job needs the same exclusivity, and a
      # second database on a shared server cannot give it that -- only a
      # second server can. See the "Start a dedicated Postgres for
      # ./engine/..." step below.
      CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5433/cleat_tests?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # The third job that sweeps ./engine/... unfiltered -- see "Run
      # integration tests" below -- and therefore the third that builds a Java
      # WASM component it has no interest in. The other two are multi-db-ci's
      # test-mysql and test-mssql, where the reasoning is written out in full.
      #
      # Worth stating for this one specifically: it is a required check whose
      # name is Cluster Integration Tests, so a Maven Central 429 fails the
      # branch on something with no relationship to clusters, integration, or
      # the diff. That is what makes the cache worth adding rather than
      # shrugging at.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # No host-binary build step here. It produced ./cleat-worker with
      # CGO_ENABLED=0 and nothing in this job ever ran it -- the cluster runs
      # containers. Worse, sitting directly above the image build it read as
      # though CGO_ENABLED=0 were the shipped configuration, which is the
      # belief that let 2.28 survive. The image build below is the real one.
      - name: Build Docker image
        run: docker build -t cleat-worker:latest .

      - name: Start Postgres and apply the schema
        run: docker compose -f docker-compose.cluster.yml up -d postgres

      # cleat#2012. A plain, throwaway server -- not a service on
      # docker-compose.cluster.yml, and not a second database on
      # cleat-postgres -- solely so `go test ./engine/...` (the "Run
      # integration tests" step below) has a max_connections ceiling nothing
      # else on this runner can move. schema and rows are handled by
      # engine/testutil itself on first use, so this needs no volume mount and
      # no migrations.
      - name: Start a dedicated Postgres for ./engine/... (isolated from the cluster's connection budget)
        run: |
          docker run -d --name cleat-test-postgres \
            -e POSTGRES_USER=cleat \
            -e POSTGRES_PASSWORD=cleat \
            -e POSTGRES_DB=cleat_tests \
            -p 5433:5432 \
            postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b

      - name: Wait for the dedicated Postgres to be ready
        shell: bash
        run: |
          # The official postgres image starts twice (initdb, then the real
          # server); pg_isready can answer success during the first instance.
          # Measured and fixed the same way for the fullstack-template sandbox
          # in cleat#1969 -- wait for the "ready" log line twice, not once.
          deadline=$((SECONDS + 60))
          ready_count=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            ready_count=$(docker logs cleat-test-postgres 2>&1 | grep -c "database system is ready to accept connections" || true)
            if [ "$ready_count" -ge 2 ] && docker exec cleat-test-postgres pg_isready -U cleat >/dev/null 2>&1; then
              echo "Dedicated test Postgres is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Dedicated test Postgres not ready::cleat-test-postgres did not become ready within 60s (ready_count=$ready_count)."
          docker logs --tail=80 cleat-test-postgres 2>&1 || true
          exit 1

      - name: Wait for cluster readiness
        shell: bash
        run: |
          # pg_isready alone is not a readiness signal for this job. During
          # initialisation the postgres entrypoint runs a temporary server on
          # a local socket to execute /docker-entrypoint-initdb.d, so
          # `docker exec ... pg_isready` reports ready while the schema is
          # still being applied -- or was never applied at all. The tests then
          # fail with a bare "relation \"workflow_defs\" does not exist",
          # which says nothing about why.
          #
          # So wait on the actual precondition: the schema exists.
          # No pg_isready pre-loop: it returns ready within a fraction of a
          # second because the entrypoint's temporary init-time server is
          # already listening, so it buys nothing and reads as a real check.
          # The schema poll below subsumes it -- psql simply fails until the
          # server is genuinely up.
          #
          # 180s, not 60s. Applying the full migration set takes appreciably
          # longer than the single small schema.sql this job used to mount,
          # and a 60s budget expired while 003/004 were still executing.
          echo "Waiting for the initdb migrations to produce a usable schema..."
          ok=""
          probe_out=""
          for i in $(seq 1 90); do
            # Exit status, not output matching. psql exits non-zero if the
            # relation or function is missing, so there is no dependence on how
            # to_regclass/to_regproc spell "absent" (both return NULL rather
            # than erroring, including for an ambiguous name -- which made an
            # earlier `IS NOT NULL` formulation silently never become true).
            if probe_out="$(docker exec cleat-postgres psql -U cleat -d cleat \
                 -v ON_ERROR_STOP=1 -tAc \
                 "SELECT count(*) FROM workflow_defs;
                  SELECT 'finalize_workflow_status'::regproc;" 2>&1)"; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error title=Cluster schema missing::Postgres came up without the cleat schema."
            echo
            echo "docker-compose.cluster.yml mounts ./deploy/postgres into"
            echo "/docker-entrypoint-initdb.d, and ./migrations/postgres into"
            echo "/opt/cleat/migrations; 100-apply-migrations.sh applies the latter. The"
            echo "entrypoint only runs initdb.d on a FIRST initialisation of an empty data"
            echo "directory, and if a script fails it exits -- with restart:"
            echo "unless-stopped the container then comes back up on the now-non-empty"
            echo "directory and skips them entirely, which looks like a database that"
            echo "started fine and has no tables."
            echo
            echo "--- last probe output ---"
            echo "${probe_out:-(no output captured)}"
            echo
            echo "--- what the container sees in /docker-entrypoint-initdb.d ---"
            docker exec cleat-postgres ls -la /docker-entrypoint-initdb.d/ || true
            echo
            echo "--- and in /opt/cleat/migrations ---"
            docker exec cleat-postgres ls -la /opt/cleat/migrations/ || true
            echo
            echo "--- postgres container log ---"
            docker logs cleat-postgres 2>&1 | tail -80 || true
            exit 1
          fi
          echo "Schema is present."

          # Only now start the workers. Previously the whole cluster came up at
          # once, so the workers connected while initdb was still running and
          # raced it -- the postgres log filled with "relation
          # \"tenant_api_keys\" does not exist" and duplicate-key errors on
          # pg_type from concurrent DDL, and their contention slowed the
          # migrations further.
          docker compose -f docker-compose.cluster.yml up -d

          # Assert the cluster actually came up.
          #
          # This step used to be `sleep 10` and nothing else, so the job called
          # itself "Cluster Integration Tests" while every worker was in a
          # crash-restart loop, and the only symptom was three unrelated-looking
          # store tests failing. A job that cannot tell the difference between a
          # running cluster and no cluster at all is not testing a cluster.
          #
          # Each service has a healthcheck in docker-compose.cluster.yml; wait
          # for every one of them to reach "healthy" rather than assuming a
          # fixed delay is enough.
          #
          # No cleat_tests creation step here any more (cleat#2012): the test
          # database now lives on its own dedicated server (see CLEAT_TEST_DB
          # and "Start a dedicated Postgres for ./engine/..." above), created
          # there via POSTGRES_DB at container start. Left empty otherwise:
          # engine/testutil builds the schema from migrations/postgres/ on
          # first use.

          echo "Waiting for workers to become healthy..."
          SERVICES="cleat-worker-1 cleat-worker-2 cleat-worker-3 cleat-dashboard"
          DEADLINE=$(( SECONDS + 120 ))
          while :; do
            UNHEALTHY=""
            for svc in $SERVICES; do
              STATE="$(docker inspect -f '{{.State.Status}}:{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$svc" 2>/dev/null || echo "missing:missing")"
              case "$STATE" in
                running:healthy) ;;
                *) UNHEALTHY="$UNHEALTHY $svc($STATE)" ;;
              esac
            done
            [ -z "$UNHEALTHY" ] && break
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error title=Cluster workers unhealthy::Not healthy after 120s:$UNHEALTHY"
              echo
              echo "Worker logs follow. A worker that exits at boot is usually a"
              echo "schema or migration problem, not a test problem."
              for svc in $SERVICES; do
                echo "--- $svc ---"
                docker logs --tail=60 "$svc" 2>&1 || true
              done
              exit 1
            fi
            sleep 3
          done
          echo "All workers healthy."

          # Assert the property, do not infer it. --rls-check=auto refuses to
          # start when --require-auth is set and the connection bypasses
          # row-level security, so a healthy worker implies RLS is enforced --
          # but that is a chain of reasoning through two defaults, either of
          # which could change. The worker says so directly; check that it did.
          #
          # This is the whole point of the deployment: the compose file
          # connects workers as cleat_app rather than the superuser that owns
          # the schema, because PostgreSQL never applies RLS to a superuser and
          # RLS is the only tenant isolation GetWorkflowByID and ListWorkflows
          # have (IMPROVEMENT-PLAN 1.10).
          # Retried, because a single `docker logs` read is not a reliable
          # witness. Observed twice on 2026-08-03: the grep below reported
          # cleat-worker-3 had not logged the line at 14:05:53.445, and the
          # `docker logs --tail=40` dump in this very failure branch printed
          # that exact line 9ms later, from a write timestamped 14:05:46.992 --
          # six seconds before the grep. The same flake hit cleat-dashboard on
          # develop (99543da0). Whether docker logs returned truncated output
          # or failed outright, piping it straight into grep cannot tell the
          # difference between "the line is absent" and "the read did not work"
          # -- an error message on stderr just fails to match.
          #
          # So: capture the output, so a failed read is a failed read, and give
          # it a bounded number of attempts. A worker that genuinely never
          # reports RLS still fails the job, roughly 20s later than before.
          for svc in $SERVICES; do
            RLS_OK=0
            for _ in $(seq 1 10); do
              if LOGS="$(docker logs "$svc" 2>&1)" &&
                 printf '%s' "$LOGS" | grep -q "row-level security is enforced on this connection"; then
                RLS_OK=1
                break
              fi
              sleep 2
            done
            if [ "$RLS_OK" -ne 1 ]; then
              echo "::error title=RLS not enforced::$svc did not report row-level security as enforced."
              echo "The worker is on a connection exempt from the tenant isolation policies,"
              echo "so GetWorkflowByID and ListWorkflows return every tenant's data."
              echo "Checked 10 times over ~20s, so this is not the log-read race"
              echo "that produced false failures before 2026-08-03."
              docker logs --tail=40 "$svc" 2>&1 || true
              exit 1
            fi
          done
          echo "All workers report row-level security enforced."

          # A worker that boots, dies and is restarted by `restart:
          # unless-stopped` can be momentarily healthy. Restarts mean the
          # cluster is not stable, so fail on any.
          for svc in $SERVICES; do
            RESTARTS="$(docker inspect -f '{{.RestartCount}}' "$svc")"
            if [ "$RESTARTS" -ne 0 ]; then
              echo "::error title=Worker restarting::$svc has restarted $RESTARTS time(s); it is crash-looping."
              docker logs --tail=60 "$svc" 2>&1 || true
              exit 1
            fi
          done

      # IMPROVEMENT-PLAN 2.5, and the end-to-end regression test for 2.28.
      # Runs before the integration tests because it is the only step in this
      # job that puts real work through the running containers -- everything
      # else proves the cluster comes up, not that it executes anything.
      #
      # CLEAT_TEST_DB, overriding the job-wide value, for the same reason the
      # "Cluster suite" step below overrides it: clusterDB() in
      # exhaustion_test.go now reads CLEAT_TEST_POSTGRES / CLEAT_TEST_DB with
      # the same precedence as engine/testutil.TestDB, so without this
      # override it would inherit the job-wide cleat_tests database -- a
      # database with no worker consuming its queue, against which the test
      # would just time out. It has to point at the database the cluster's
      # own workers actually serve.
      #
      # -json, teed to its own report: this suite gets its own skip-budget
      # check below, separate from the ./engine/... one. Because a DSN is
      # always configured here, clusterDB() can only Fatal on an unreachable
      # database, never skip -- so the budget is 0, and a skip appearing
      # under it means the override above stopped taking effect.
      - name: Resource exhaustion — runaway workflow is terminated
        shell: bash
        env:
          CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -timeout=300s -json ./tests/exhaustion/... 2>&1 | tee exhaustion-report.json

      - name: Skip budget — resource exhaustion
        if: always()
        run: scripts/check-skip-budget.sh cluster/exhaustion exhaustion-report.json

      # After the exhaustion step, not before: TestKillPostgresAndRestart stops
      # and restarts the postgres container, and TestFullClusterRestart releases
      # and re-claims work. Both restore what they touch, but there is no reason
      # to run them upstream of a test that depends on a settled cluster.
      #
      # The suite claims on queue-cluster-tests-{1,2,3}, which no worker in
      # docker-compose.cluster.yml serves, so it does not race the live workers
      # for the rows it inserts.
      - name: Cluster suite — claiming, failover and replay against the live cluster
        # The cluster's OWN database, overriding the job-wide CLEAT_TEST_DB.
        #
        # That variable points at cleat_tests, a separate database this job
        # keeps for ./engine/... precisely so those tests do not share a table
        # with four live workers. This suite wants the opposite: it restarts the
        # postgres container, kills workers and asserts on failover, so it has
        # to be looking at the database the cluster actually runs on. Against
        # cleat_tests every test failed with `relation "workflow_defs" does not
        # exist` -- nothing builds a schema there until engine/testutil does,
        # and this package does not use it.
        env:
          CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
        run: go test -count=1 -timeout=300s ./tests/cluster/...

      - name: Run integration tests
        shell: bash
        run: |
          # pipefail is required: without it `tee` supplies the exit status and
          # a failing `go test` is silently reported as a green step.
          set -o pipefail
          # -p 1: ./engine/... is two packages, engine and engine/testutil,
          # and `go test` runs packages in parallel by default. Both build
          # their schema in, and wipe rows from, the one database this job
          # gives them -- so in parallel they race on the DDL in
          # 001_schema.sql (observed: a duplicate key on pg_extension_name_index,
          # and a deadlock) and delete each other's fixtures mid-test. That
          # was invisible while they shared the cluster's already-migrated
          # database and only appeared once this job got one of its own.
          #
          # 300s, raised from 180s on 2026-08-30. Measured on three runs of the
          # same package that day:
          #
          #   #468   99.754s   pass
          #   #470  107.664s   pass
          #   #472  180.017s   KILLED by the old budget, four CI runs concurrent
          #
          # ~100s typical against a 180s ceiling is 1.8x headroom, and one slow
          # runner spent it. 300s is ~3x, and matches the two other Postgres
          # steps in this file (./tests/exhaustion/... and ./tests/cluster/...),
          # which makes 180s the outlier rather than this the exception.
          #
          # Raising it is worth more than it looks, because of HOW this fails.
          # A timeout kills the test binary, so no individual test ever reports
          # failure: `go test -json` emits every test passing, no FAIL line and
          # no ::error, and the only evidence is a package-level
          # `FAIL github.com/cleat-team/cleat/engine 180.017s` whose elapsed
          # time equals the budget. On #472 that read like a defect in an
          # unrelated actions/github-script bump and cost a full diagnosis.
          #
          # So if this ever goes red again with no named failing test, check the
          # elapsed time against the number below before looking for a bug:
          #
          #   gh run view --job <id> --log | grep -E '^FAIL\s+.*/engine'
          #
          # Re-derive the typical duration from a passing run's JSON:
          #
          #   jq -r 'select(.Action=="pass" and .Test==null and
          #          (.Package|endswith("/engine"))) | .Elapsed' test-report.json
          #
          # 2026-09-03: 300s ran out, and the paragraphs above are the reason
          # this took a diagnosis rather than a glance. Measured across the
          # Cluster Integration Tests job's own runs on the same day, all
          # PostgreSQL-only, oldest first:
          #
          #   241.891s  pass
          #   250.137s  pass
          #   286.239s  pass
          #   291.460s  pass
          #   287.100s  pass
          #   300.034s  KILLED
          #
          # Fifty seconds of growth in about two and a half hours of merges,
          # which left 9-14s of margin, and then none. Note what the failure
          # looked like: it landed on a PR that touched IMPROVEMENT-PLAN.md and
          # some comment text, and the log had no failing test in it at all --
          # exactly the shape the #472 paragraph above warns about, arriving
          # again because the ceiling moved into range rather than because a
          # runner was slow.
          #
          # 900s, which is ~3x the current typical duration -- the same
          # multiple the 180s -> 300s note reasoned to, applied to the number
          # the suite now actually takes. This is deliberately not matched to
          # the other two Postgres steps in this file (./tests/exhaustion/...
          # and ./tests/cluster/...): they still have their headroom, and
          # raising a ceiling nothing is pressing against buys nothing.
          #
          # What this does NOT decide: whether the cluster job should be
          # running the whole engine suite at all. It exists here to exercise
          # the engine against a real four-worker cluster, and 290 seconds of
          # it is mostly tests that do not need one. Narrowing the package set
          # would cut the job rather than just survive it, but it is a change
          # to what this job covers and belongs to whoever owns that decision.
          go test -p 1 -count=1 -timeout=900s -json ./engine/... 2>&1 | tee test-report.json

      # This job brings up a real four-worker cluster and a real database, so
      # it has asked for everything its tests need: any skip here means
      # something it provisioned did not arrive. That is a failure, not a
      # warning -- this job previously reported success while every worker in
      # the compose file was crash-looping.
      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh cluster test-report.json

      - name: Cluster logs (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.cluster.yml logs --tail=100
          echo "--- cleat-test-postgres ---"
          docker logs --tail=100 cleat-test-postgres 2>&1 || true

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f docker-compose.cluster.yml down -v
          docker rm -f cleat-test-postgres 2>/dev/null || true
