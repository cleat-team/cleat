# ---------------------------------------------------------------------------
# CI/CD Pipeline for cleat
#
# Workstream 2 — Continuous Integration and Delivery
#
# Jobs:
#   lint              — go vet, ruff, shellcheck, clippy
#   lint-go           — golangci-lint: errcheck, gosimple, govet, ineffassign,
#                       staticcheck, unused, misspell, unconvert, gocyclo, gofmt
#   vulncheck         — govulncheck ./... (Go vulnerability scanner)
#   test-go           — matrix (go version x package group), race detector
#   test-python       — matrix (python 3.10 / 3.11 / 3.12)
#   test-java         — gradle test (TeaVM + JUnit 5)
#   test-assemblyscript — npm test (as-pect)
#   fuzz              — fuzz tests on internal/wasm/... (60s per fuzz func)
#   benchmarks        — push to main only; stores result + trend artifact
#   cluster-tests     — docker-compose cluster, integration tests, tear-down
#   build             — Go bin, Python SDK, Java, AssemblyScript, examples
# ---------------------------------------------------------------------------
name: CI/CD Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_STABLE: "1.24"

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write

# ===========================================================================
# JOBS
# ===========================================================================
jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install lint tools
        run: |
          pip install ruff
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Go vet
        run: go vet ./...

      - name: Ruff check
        run: ruff check python-sdk/

      - name: ShellCheck
        run: shellcheck scripts/*.sh benchmarks/*.sh

      - name: Clippy (cleat-macro)
        working-directory: crates/cleat-macro
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (cleat-sdk)
        working-directory: crates/cleat-sdk
        run: cargo clippy --all-targets -- -D warnings

  # -------------------------------------------------------------------------
  # Lint Go (golangci-lint with extended linters)
  # -------------------------------------------------------------------------
  lint-go:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

  # -------------------------------------------------------------------------
  # Vulnerability check (govulncheck)
  # -------------------------------------------------------------------------
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # -------------------------------------------------------------------------
  # Test Go (matrix: Go version x package group)
  # -------------------------------------------------------------------------
  test-go:
    name: Test Go (${{ matrix.package.name }}) on ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEAT_TEST_DB: postgres://postgres:postgres@localhost:5432/cleat?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "1.23", "1.24"]
        package:
          - name: core
            path: ./durable/...
          - name: internal
            path: ./internal/...
          - name: plugins
            path: ./plugins/...
          - name: commands
            path: ./cmd/...
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install TinyGo (WASM compilation)
        if: matrix.package.name == 'internal' && matrix.go-version == '1.24'
        run: |
          curl -sSfL https://github.com/tinygo-org/tinygo/releases/download/v0.36.0/tinygo_0.36.0_linux_amd64.tar.gz -o /tmp/tinygo.tar.gz
          sudo tar -C /usr/local -xzf /tmp/tinygo.tar.gz
          echo "/usr/local/tinygo/bin" >> $GITHUB_PATH

      - name: Setup Rust + wasm32-wasip1 (Rust WASM tests)
        if: matrix.package.name == 'internal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Run tests
        run: go test -race -count=1 -json "${{ matrix.package.path }}" 2>&1 | tee test-report.json

      - name: Warn on skipped tests
        if: always()
        run: |
          if [ -f test-report.json ]; then
            SKIP_COUNT=$(grep -c '"Action":"skip"' test-report.json || echo 0)
            if [ "$SKIP_COUNT" -gt 0 ]; then
              echo "::warning title=Skipped Tests (${{ matrix.package.name }})::${SKIP_COUNT} test(s) were skipped. Verify that all test dependencies (PostgreSQL, TinyGo, Rust/cargo) are available."
            fi
          fi

  # -------------------------------------------------------------------------
  # Test Python (matrix: 3.10 / 3.11 / 3.12)
  # -------------------------------------------------------------------------
  test-python:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        working-directory: python-sdk
        run: python -m pytest -v

  # -------------------------------------------------------------------------
  # Test Java
  # -------------------------------------------------------------------------
  test-java:
    name: Java Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Java tests
        working-directory: crates/cleat-java
        run: gradle test

  # -------------------------------------------------------------------------
  # Test AssemblyScript
  # -------------------------------------------------------------------------
  test-assemblyscript:
    name: AssemblyScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/cleat-as
        run: npm ci

      - name: Run tests
        working-directory: packages/cleat-as
        run: npm test

  # -------------------------------------------------------------------------
  # Fuzz tests (WASM boundary)
  # -------------------------------------------------------------------------
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run fuzz tests
        run: go test -fuzz=. -fuzztime=60s ./internal/wasm/...

      - name: Warn on skipped tests
        if: always()
        run: |
          SKIP_COUNT=$(go test -json -count=1 ./internal/wasm/... 2>/dev/null | grep -c '"Action":"skip"' || echo 0)
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo "::warning title=Skipped Tests (fuzz)::${SKIP_COUNT} test(s) were skipped."
          fi

  # -------------------------------------------------------------------------
  # Benchmarks (push to main only)
  # -------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history for benchmark comparison
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run benchmarks
        run: go test -bench=. -benchmem -benchtime=30s ./benchmarks/ | tee bench-output.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90

      - name: Store benchmark result (trend tracking)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "120%"
          comment-on-alert: true
          fail-on-alert: true

  # -------------------------------------------------------------------------
  # Build all targets
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Go binaries
        run: |
          go build ./cmd/...
          echo "[+] Go binaries built successfully"

      - name: Build Go examples (wasm-demo)
        working-directory: wasm-demo
        run: go build ./...

      - name: Build Rust crates
        run: |
          cd crates/cleat-macro && cargo build --all-targets
          cd ../cleat-sdk && cargo build --all-targets

      - name: Build AssemblyScript
        working-directory: packages/cleat-as
        run: |
          npm ci
          npm run build

      - name: Build Java
        working-directory: crates/cleat-java
        run: gradle build

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install .

  # -------------------------------------------------------------------------
  # Coverage (informational, non-blocking)
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK
        working-directory: python-sdk
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Go coverage
        run: make coverage-go

      - name: Run Python coverage
        run: make coverage-python

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 30

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: python-sdk/tests/coverage
          retention-days: 30

  # -------------------------------------------------------------------------
  # Cluster integration tests (requires Docker)
  # -------------------------------------------------------------------------
  cluster-tests:
    name: Cluster Integration Tests
    runs-on: ubuntu-latest
    env:
      CLEAT_TEST_DB: postgres://cleat:cleat@localhost:5432/cleat?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build cleat-worker binary
        run: go build -o cleat-worker ./cmd/cleat-worker

      - name: Build Docker image
        run: docker build -t cleat-worker:latest .

      - name: Start cluster
        run: docker compose -f docker-compose.cluster.yml up -d

      - name: Wait for cluster readiness
        run: |
          echo "Waiting for Postgres to be healthy..."
          for i in $(seq 1 30); do
            if docker exec cleat-postgres pg_isready -U cleat -d cleat &>/dev/null; then
              echo "Postgres is ready."
              break
            fi
            sleep 2
          done
          echo "Waiting for workers to register..."
          sleep 10

      - name: Run integration tests
        run: go test -count=1 -timeout=120s -json ./internal/host/... 2>&1 | tee test-report.json

      - name: Warn on skipped tests
        if: always()
        run: |
          if [ -f test-report.json ]; then
            SKIP_COUNT=$(grep -c '"Action":"skip"' test-report.json || echo 0)
            if [ "$SKIP_COUNT" -gt 0 ]; then
              echo "::warning title=Skipped Tests (cluster)::${SKIP_COUNT} test(s) were skipped. Verify that CLEAT_TEST_DB and PostgreSQL are configured."
            fi
          fi

      - name: Cluster logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.cluster.yml logs --tail=100

      - name: Tear down cluster
        if: always()
        run: docker compose -f docker-compose.cluster.yml down -v
