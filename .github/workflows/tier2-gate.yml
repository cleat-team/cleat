# ---------------------------------------------------------------------------
# Tier 2 Gate
#
# Runs scripts/tier2-gate.sh, which enforces tiers.yaml's tier-2 contract:
# "Must run. May fail, against known_failures -- a list that can only shrink."
#
# Until 2026-08-07 nothing ran tier 2 at all:
#
#   grep -rn "tier2" .github/workflows/   ->  only comments inside tier1-gate.yml
#
# Its components were prose -- id, why, open_items -- with no packages field, so there
# was nothing a script could execute. WORKSTREAM.md sets out three states and says the
# point is "to be able to say which is which and have it be true"; tier 1 became true on
# 2026-08-07, and this is the same move for tier 2.
#
# ---------------------------------------------------------------------------
# Why this is NOT modelled on tier1-gate.yml's strictness, and why that is correct:
#
# Tier 1 forbids known failures, so its gate fails on any failure at all. Tier 2 permits
# them against a list, so this gate asks three different questions -- did every declared
# pattern run anything, is every failure already known, and does every known failure
# still fail. That third one is what makes "can only shrink" real rather than
# aspirational: an entry that starts passing fails the gate until it is deleted, because
# a stale entry is a false statement in the manifest that hides the next regression in
# the same test.
#
# All three were falsified before this shipped, on ./examples/... :
#   delete a known_failure entry  -> "NEW failures, not in tier2.known_failures"
#   list a test that passes       -> "stale ... (now passes)"
#   declare ./monitoring/...      -> "declared patterns that ran ZERO tests"
#
# ---------------------------------------------------------------------------
# Why tier 2 MAY take toolchain dependencies that D5 forbade tier 1:
#
# D5 kept Rust, Node, a JDK and Gradle out of the tier-1 job because tier 1's contract
# ("must pass; a skip is a failure; that is a release blocker") turns every registry it
# touches into a release blocker -- and on 2026-08-06 alone, Maven Central answered 429
# and 403 on unrelated PRs. Tier 2's contract does not: it may fail. So the risk that was
# disqualifying at tier 1 is acceptable here. That is the reason a tier-2 job is a
# different proposition from the one D5 rejected, rather than a reversal of it.
#
# This job covers the Go surface. tests/cross-language and tests/plugin-harness are
# deliberately NOT here -- see tier2.gated_by in tiers.yaml. Dedicated jobs already run
# both under a skip budget of ZERO, which is stricter than this gate can be, since
# tier2.rules.skips_allowed is true. Those jobs were made required status checks on
# 2026-08-07; the gap was never that the suites do not run, it was that nothing blocked
# on the result.
# ---------------------------------------------------------------------------
name: Tier 2 Gate

# cleat#3073: surfaces the triggering activity type in the run's display
# title, so a PR body edit's run set is distinguishable from the one it
# shares a SHA with. Full rationale in ci.yml, next to the same expression.
run-name: >-
  ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}${{ github.event.action && format(' [{0}]', github.event.action) || '' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    # cleat#2483: `branches` filters on the PR's BASE branch, and a
    # release branch was absent -- so every PR targeting one ran none of
    # this workflow, and the release PR into main was the only gate left.
    branches: [main, develop, "release/**"]
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. EVERY required context on develop has to
  # report here. The list is tiers.yaml's `required_contexts` block; the count
  # is deliberately not repeated here, because it was -- in nine workflow files
  # at once -- and all nine said 32 while develop required 33 (cleat#1937).
  merge_group:
concurrency:
  # Every push gets its own group; PR runs share one per ref and supersede.
  #
  # `github.ref` is refs/heads/develop for EVERY merge, so keying the group on
  # it puts consecutive merges in one group. That discards a merge's own
  # verification, and `cancelled` is not `success` -- nothing downstream reads
  # it as a failure, so it disappears silently.
  #
  # `cancel-in-progress: false` is NOT enough to prevent that, which is the
  # part the first fix (#634) got wrong. It stops a *running* run being killed,
  # but GitHub still allows only one pending run per group: when a third push
  # enters an occupied group, the one waiting is cancelled before it ever
  # starts. Measured on develop after #634 merged (18:20:48Z on 2026-09-03),
  # 5 of 24 `Tier 1 Gate` push runs were cancelled -- every one with **zero
  # jobs**, killed within seconds of the next merge landing.
  #
  # The job count separates the two mechanisms, and does it cleanly. Of the 22
  # cancelled gate runs that day, the 17 before #634 have jobs=1 (killed
  # mid-run) with a single jobs=0 exception, and all 5 after it have jobs=0:
  #
  #   gh run view <cancelled-id> --json jobs --jq '.jobs | length'   # 0
  #   gh run view <success-id>   --json jobs --jq '.jobs | length'   # 1
  #
  # So #634 did exactly what it claimed and no more. The gate takes 20-40
  # minutes and merges land minutes apart, so the queue is almost always
  # occupied. Keying push runs on `github.sha` gives each merge a group of its
  # own: never queued, so never superseded.
  #
  # On a pull_request the group stays per-ref and cancellation is the setting's
  # real purpose: pushing twice to a branch should not run the suite twice.
  #
  # `scripts/check-workflow-concurrency.sh` guards both halves.
  # A BODY EDIT MUST NOT SUPERSEDE THE RUN IT RACES (cleat#1688).
  #
  # `edited` is subscribed above because a BASE CHANGE fires it and nothing
  # else does -- but it also fires for a title or body edit, and `github.ref`
  # is identical for every pull_request activity type. The edited run therefore
  # landed in this group and cancelled the synchronize run it followed, and a
  # superseded run renders as a failure rather than as "replaced".
  #
  # `github.run_id` is unique per run, so a no-op edited run shares a group
  # with nothing and cancels nothing. An `edited` that DID change the base
  # keeps the per-ref group: that is a real re-evaluation against a different
  # target and should supersede, which is why the activity type exists here.
  #
  # ONE LINE ON PURPOSE: check-workflow-concurrency.sh reads the single line
  # matching `^\s*group:` and looks for github.sha/run_id/ref in it. A folded
  # `>-` scalar hides the expression and the guard reports a false alarm.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' && !github.event.changes.base && github.run_id || github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # SPLIT INTO A WORKER JOB (this one) AND A SEPARATE AGGREGATOR (`tier2`,
  # below) named `Tier 2 Gate` -- cleat#2847. Until this split, this single
  # job WAS the required context `Tier 2 Gate`, so its "Upload the tier-2
  # log" step could not be given `continue-on-error` the way tier1-gate.yml's
  # equivalent step was in #2846: scripts/check-workflow-guards.py's
  # `guard_no_continue_on_error` correctly refuses a non-fatal step inside a
  # job whose own name IS a required context, and a mutation test confirmed
  # it does (see #2847). Moving the actual gate into a job that is NOT itself
  # the required context, with a thin aggregator carrying that name instead,
  # gives the log upload the same non-fatal treatment tier1 has without
  # asking the guard to make an exception for it.
  #
  # Unlike tier1-engine/tier1-rest, this job is not conditionally skipped for
  # merge_group -- tier 2 is not report-only in the queue the way tier 1 is
  # (cleat#2080), so the aggregator below only has one outcome to check:
  # success.
  tier2-run:
    name: Tier 2 Gate -- run
    runs-on: ubuntu-latest
    # The gate ran 1567 tests in six patterns plus one module when this was written,
    # with -p 1, in well under two minutes of test time locally. 30 is generous; a gate
    # that times out is indistinguishable from one that fails.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # mssql/server:2022, deliberately not the azure-sql-edge image used in local
      # sandboxes. Measured 2026-08-07 against edge: plugins/kvstore and
      # plugins/featureflags fail their MultiBackend tests with
      #   tls: failed to parse certificate from server: x509: negative serial number
      # which is Go 1.26 enforcing RFC 5280 against that image's self-signed cert, not a
      # cleat defect. The tier-1 gate already runs green against server:2022, so this
      # picks the image that is known to work rather than importing a local artifact.
      mssql:
        # Pinned by digest 2026-08-07; `2022-latest` is a moving tag and this is
        # a required check. Full rationale, the re-derive commands, and why the
        # `ancestor=` filters had to move with it: tier1-gate.yml's mssql
        # service. Bump all six sites together or `Lint` fails the PR.
        image: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
          # SQL Server on Linux sizes its buffer pool to 80% of VISIBLE host
          # memory by default, with no awareness it shares a runner with
          # other services in this job (cleat#2101). Bump all six sites
          # together, per the note above.
          MSSQL_MEMORY_LIMIT_MB: "2048"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
          --publish 1433:1433

    env:
      # Explicit, not inherited. CGO_ENABLED=0 removes NewWasmtimeBackend (//go:build
      # cgo), leaving no WASM backend at all -- the wazero backend was deleted in #459
      # (2026-08-10), so there is nothing to land on by accident any more; the run simply
      # has no backend. The gate checks this too; pinning it means the check never has to
      # fire. (This said "and silently runs on wazero -- and tier 2 names wazero as a
      # component in its own right" until 2026-09-06. Tier 2 still names it, now as
      # `runtime-wazero`, and the entry says plainly that it is not a backend.)
      CGO_ENABLED: "1"

      # Both PostgreSQL names -- the tree carries two conventions for the same DSN and
      # setting only one silently skips everything keyed on the other.
      CLEAT_TEST_POSTGRES: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_DB: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@localhost:1433?database=cleat
      # cleat#982: arm the row-disappearance audit (a test-only AFTER DELETE
      # trigger on workflow_instances) so a recurrence reports WHO deleted a
      # missing row instead of only that it is gone. No-op for every dialect
      # except SQL Server; see engine/testutil/mssql_row_disappearance.go.
      CLEAT_TEST_MSSQL_ROW_AUDIT: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create the cleat database on SQL Server
        run: |
          docker exec "$(docker ps -q --filter 'ancestor=mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89')" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CleatTest123!' -C \
            -Q "IF DB_ID('cleat') IS NULL CREATE DATABASE cleat"

      # No continue-on-error. The gate's own exit status is this job's exit status. Tier 2
      # tolerating known failures is expressed in tiers.yaml, where it is reviewable --
      # not here, where it would silently tolerate everything.
      - name: Tier 2 gate
        run: scripts/tier2-gate.sh

      # cleat#2691: this job already sets all three DSNs (above), and
      # tier2-gate.sh's sweep above already runs this test's postgres,
      # mysql and mssql subtests for real -- cleat-review confirmed that
      # while reviewing #2684, the PR that moved this test from tier 1
      # (skips_allowed: false) to plugins/eventtriggers, a plain tier-2
      # package (tiers.yaml:577, skips_allowed: true). The move was
      # necessary -- registerAwaiter/unregisterAwaiter/registrationKey are
      # unexported, so exercising the REAL functions instead of a
      # hand-copy requires being in-package -- but it means a toolchain
      # hiccup or an unset DSN no longer fails anything here:
      # scripts/tier2-gate.sh enforces no skip budget of its own, only
      # tiers.yaml's generic (and permissive) one.
      #
      # A NARROW, ADDITIONAL, -run-filtered rerun of just this one test,
      # same DSNs, with a skip budget of ZERO -- the pattern
      # tiers.yaml:1060-1066 already documents for tests/cross-language and
      # tests/plugin-harness, not new infrastructure. Filtering to one test
      # means this step's report contains only its own skip events, so a
      # single zero-budget __UNATTRIBUTED__ line suffices; no per-dialect
      # regex is needed the way it is for an unfiltered sweep's ledger
      # lines elsewhere in this repo.
      #
      # This catches a genuine t.Skip (today, only reachable on PostgreSQL
      # -- see the next step's comment for why MySQL/MSSQL need a different
      # check).
      - name: Run eventtriggers legacy-replay dialect test
        run: |
          set -o pipefail
          go test -count=1 -json -run '^TestALegacyAwaiterReplayLeavesAtMostTwoRowsAndUnregisterRemovesBoth$' ./plugins/eventtriggers/... 2>&1 | tee eventtriggers-legacy-replay-report.json

      - name: Skip budget (eventtriggers legacy-replay dialect test)
        if: always()
        run: scripts/check-skip-budget.sh tier2/eventtriggers-legacy-replay eventtriggers-legacy-replay-report.json

      # The skip-budget step above cannot see the failure mode this issue
      # actually names for MySQL/MSSQL. engine/testutil/plugin_backend.go's
      # NewPluginTestBackends only includes a MySQL or MSSQL backend when
      # its DSN env var is non-empty (checked BEFORE MySQLTestDB/MSSQLTestDB
      # ever run) -- an unset DSN means that dialect's t.Run subtest is
      # never CREATED, which emits no skip event at all. Verified by
      # falsification: unsetting CLEAT_TEST_MSSQL and rerunning this exact
      # test produces `go test` exit 0, zero skip events, and a passing
      # skip-budget check -- the mssql subtest is simply absent, not
      # skipped. (The dialect that CAN still emit a real skip event here is
      # PostgreSQL, which NewPluginTestBackends always attempts and which
      # TestDB skips, rather than fails, when unconfigured and unreachable
      # -- that path is what the step above actually guards.) Assert
      # presence directly, independent of the skip-budget mechanism.
      - name: Assert eventtriggers legacy-replay ran on all three dialects
        if: always()
        run: |
          missing=""
          for d in postgres mysql mssql; do
            grep -q "\"Test\":\"TestALegacyAwaiterReplayLeavesAtMostTwoRowsAndUnregisterRemovesBoth/$d\"" eventtriggers-legacy-replay-report.json || missing="$missing $d"
          done
          if [ -n "$missing" ]; then
            echo "eventtriggers legacy-replay dialect subtest(s) never ran (DSN unset?):$missing"
            exit 1
          fi
          echo "all three dialect subtests ran"

      # continue-on-error, for the same reason as tier1-gate.yml's identical
      # steps (cleat#2834, #2846): this is debugging evidence, not the gate --
      # the "Tier 2 gate" step's own exit status is what this job's result
      # already is, and that result (not this upload) is what the `tier2`
      # aggregator job below checks. Safe here specifically because this job
      # is no longer itself the required context (see the comment above
      # `tier2-run:`); the guard in scripts/check-workflow-guards.py would
      # refuse this exact line if it appeared in a job named `Tier 2 Gate`.
      - name: Upload the tier-2 log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tier2-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tier2-gate.log
            tier2-gate.json
            eventtriggers-legacy-replay-report.json
          retention-days: 30

  # `always()` and an explicit result check, not a bare `needs:` -- CLAUDE.md
  # records, under "a condition that never decides anything cannot be
  # observed to be wrong", how costly it was to find out only after relying
  # on it that a SKIPPED needs-job does not read as failure to branch
  # protection. tier1-gate.yml's own aggregator (job `tier1`) states the same
  # check for its three shards; this is the one-shard version of it.
  tier2:
    name: Tier 2 Gate
    needs: [tier2-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate the gate result
        env:
          RUN: ${{ needs.tier2-run.result }}
        run: |
          echo "tier2-run: $RUN"
          if [ "$RUN" != "success" ]; then
            echo "::error::Tier 2 Gate: tier2-run did not succeed ($RUN)"
            exit 1
          fi
