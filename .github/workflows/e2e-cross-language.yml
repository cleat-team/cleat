# ---------------------------------------------------------------------------
# Cross-Language End-to-End WASM Tests
#
# Workstream 2 — Cross-cutting CI (Task C2)
#
# Compiles workflow examples in Rust, Python, AssemblyScript, and Java to
# WASM, then runs them through the Go host runtime to verify the full
# compilation-to-execution pipeline for each non-Go language.
#
# Key design decisions:
#   - All four are first-class: build/execute failures block the CI. Java and
#     AssemblyScript joined Rust and Python on 2026-08-06. This job had always
#     installed Node, Java 17 and Gradle and always ran their tests -- but both
#     Go tests degraded every failure into a skip, so "best-effort" described
#     the tests' behaviour rather than any property of the SDKs. With the skips
#     removed, both pass.
#   - Each Go test handles its own WASM compilation; the CI only provides
#     the toolchains and dependencies, avoiding redundant double-builds.
#   - The push trigger covers main and develop only. It carried "feature/**"
#     until 2026-08-07, which ran the whole job a second time on every push to
#     a feature branch that already had a PR open -- the pull_request trigger
#     covers those. `Cross-Language WASM E2E` became a required check on
#     2026-08-06, so the duplicate was the more expensive of the two.
#
# SHARDED, 2026-11-15, because this job was one of the two longest on the
# merge-group critical path and the queue is what limits merges per day. The
# single job measured 698s wall on e6cf2185: 527s in one `go test` and 111s
# compiling wasm-tools from source. It now runs as four matrix legs that
# partition the same selector and are measured at roughly 90-180s of tests
# each, plus an aggregate job that carries the required context's name --
# see the comment on that job, because a matrix renames the check and a
# required context is a plain string match.
# ---------------------------------------------------------------------------
name: Cross-Language E2E

# cleat#3073: surfaces the triggering activity type in the run's display
# title, so a PR body edit's run set is distinguishable from the one it
# shares a SHA with. Full rationale in ci.yml, next to the same expression.
run-name: >-
  ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}${{ github.event.action && format(' [{0}]', github.event.action) || '' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    # cleat#2483: `branches` filters on the PR's BASE branch, and a
    # release branch was absent -- so every PR targeting one ran none of
    # this workflow, and the release PR into main was the only gate left.
    branches: [main, develop, "release/**"]
    # `edited` is required, not decorative: it is the activity type a BASE
    # CHANGE fires. Without it a PR opened against a feature branch and later
    # retargeted here never triggers this workflow at all -- not at open (the
    # branches filter excluded it) and not at retarget (not a default type).
    # Such a PR reports CLEAN with only the unfiltered workflows' checks.
    # scripts/check-workflow-pr-triggers.sh guards this.
    types: [opened, synchronize, reopened, edited]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. EVERY required context on develop has to
  # report here. The list is tiers.yaml's `required_contexts` block; the count
  # is deliberately not repeated here, because it was -- in nine workflow files
  # at once -- and all nine said 32 while develop required 33 (cleat#1937).
  merge_group:
concurrency:
  # Every push gets its own group; PR runs share one per ref and supersede.
  #
  # `github.ref` is refs/heads/develop for EVERY merge, so keying the group on
  # it puts consecutive merges in one group. That discards a merge's own
  # verification, and `cancelled` is not `success` -- nothing downstream reads
  # it as a failure, so it disappears silently.
  #
  # `cancel-in-progress: false` is NOT enough to prevent that, which is the
  # part the first fix (#634) got wrong. It stops a *running* run being killed,
  # but GitHub still allows only one pending run per group: when a third push
  # enters an occupied group, the one waiting is cancelled before it ever
  # starts. Measured on develop after #634 merged (18:20:48Z on 2026-09-03),
  # 5 of 24 `Tier 1 Gate` push runs were cancelled -- every one with **zero
  # jobs**, killed within seconds of the next merge landing.
  #
  # The job count separates the two mechanisms, and it does it cleanly. Of the
  # 22 cancelled gate runs that day, the 17 before #634 have jobs=1 (killed
  # mid-run) with a single jobs=0 exception, and all 5 after it have jobs=0:
  #
  #   gh run view <cancelled-id> --json jobs --jq '.jobs | length'   # 0
  #   gh run view <success-id>   --json jobs --jq '.jobs | length'   # 1
  #
  # So #634 did exactly what it claimed and no more. The gate takes 20-40
  # minutes and merges land minutes apart, so the queue is almost always
  # occupied. Keying push runs on `github.sha` gives each merge a group of its
  # own: never queued, so never superseded.
  #
  # On a pull_request the group stays per-ref and cancellation is the setting's
  # real purpose: pushing twice to a branch should not run the suite twice.
  #
  # `scripts/check-workflow-concurrency.sh` guards both halves.
  # A BODY EDIT MUST NOT SUPERSEDE THE RUN IT RACES (cleat#1688).
  #
  # `edited` is subscribed above because a BASE CHANGE fires it and nothing
  # else does -- but it also fires for a title or body edit, and `github.ref`
  # is identical for every pull_request activity type. The edited run therefore
  # landed in this group and cancelled the synchronize run it followed, and a
  # superseded run renders as a failure rather than as "replaced".
  #
  # `github.run_id` is unique per run, so a no-op edited run shares a group
  # with nothing and cancels nothing. An `edited` that DID change the base
  # keeps the per-ref group: that is a real re-evaluation against a different
  # target and should supersede, which is why the activity type exists here.
  #
  # ONE LINE ON PURPOSE: check-workflow-concurrency.sh reads the single line
  # matching `^\s*group:` and looks for github.sha/run_id/ref in it. A folded
  # `>-` scalar hides the expression and the guard reports a false alarm.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'edited' && !github.event.changes.base && github.run_id || github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Declares the "first-class" policy above to the tests themselves.
  #
  # engine/rust_workflow_test.go and engine/python_wasm_e2e_test.go need to
  # tell "nobody asked for this toolchain" (a developer's laptop, or ci.yml's
  # engine matrix entry, whose Setup Rust step is gated to the internal
  # package) from "the job that promised this toolchain cannot find it". The
  # first is a skip; the second is a silently-failed setup step and must be a
  # failure.
  #
  # This is an explicit variable rather than a check on $GITHUB_WORKFLOW
  # because that would match on this workflow's display `name:` field.
  # Renaming a workflow is a cosmetic edit that nobody would expect to change
  # test behaviour, and it would silently return both files to skipping --
  # which is exactly how DURABLE_TEST_DB was renamed with nothing noticing
  # (IMPROVEMENT-PLAN.md 2.9). A CLEAT_REQUIRE_* variable reads as
  # load-bearing and greps to its consumers.
  # java and assemblyscript joined rust and python on 2026-08-06, and for the
  # same reason in both cases. This job has installed Java 17, Gradle and Node
  # since it was written, and runs TestJava* and TestAssemblyScript* in the -run
  # regex below -- so it was already paying for both toolchains. But
  # engine/java_workflow_e2e_test.go and engine/as_workflow_e2e_test.go each
  # skipped on a missing one unconditionally, and that skip is invisible here:
  # this step's output is -v text, not the -json a skip budget reads. So in this
  # job a missing JDK or a missing Node is a failed setup step, not an absent
  # prerequisite, and must read as a failure.
  CLEAT_REQUIRE_TOOLCHAINS: "rust,python,java,assemblyscript"

  # THE ONE PLACE THE E2E TEST SELECTOR IS WRITTEN.
  #
  # -short=false overrides any default -short so WASM integration tests are
  # not skipped; -count=1 bypasses Go's test cache. The shards below split
  # this string at run time, so a name added here is run by exactly one shard
  # with no other edit -- see "Select this shard's tests".
  #
  # It is longer than it looks like it should be, and the extra alternatives
  # are not decoration. This job is the ONLY one that installs Rust, Node,
  # a JDK and Gradle, so a toolchain-building test this regex does not match
  # runs nowhere at all -- it skips in every other job, silently, because a
  # skip and a pass print the same thing.
  #
  # `TestRust|TestPython|TestAssemblyScript|TestJava` selects by language
  # PREFIX, and ten tests build a toolchain while being named for what they
  # do instead. Three of them -- TestARustGuestSuspendsCleanly,
  # TestARustGuestReachesTheHostRetryLoop and
  # TestARustLongRetryPolicySuspendsInsteadOfHoldingTheWorker -- were
  # already excluded from the tier-1 gate as tier 2, so on 2026-09-03 they
  # were running in NO job. "TestARust" does not contain "TestRust".
  #
  # Do not prune this by hand.
  # engine/tier2_toolchain_tests_placement_test.go derives the required set
  # from the source and fails if an alternative is missing -- it reads THIS
  # variable, and it also fails if the variable stops being what the shard
  # split is computed from (IMPROVEMENT-PLAN 3.109).
  E2E_SELECTOR: "TestRust|TestARust|TestPython|TestAssemblyScript|TestJava|TestADeferBody|TestAMissingDeferExport|TestTheBackendLogsToTheConfiguredLogger|TestTheHostRunsDefersOfAKilled|TestTheWazeroPathRunsDefers"

permissions:
  contents: read

jobs:
  e2e-cross-language:
    name: Cross-Language WASM E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # 25, not the 35 the single job carried: one shard's test step is bounded
    # by its own -timeout=15m below, so 25 is that plus the ~2m of toolchain
    # setup and the selector enumeration, with a margin. Lower is the point --
    # a shard that hangs should not hold a queue slot for 35 minutes -- but
    # this value is arithmetic, not a measurement; replace it with one when
    # there are a few weeks of shard runs to read.
    timeout-minutes: 25
    strategy:
      # One shard's failure must not cancel its siblings. The aggregate job
      # below names which dependency was not a success, and a sibling killed
      # by `fail-fast` reads as "cancelled" -- not a success, but with nothing
      # saying why, and it hides whether THAT shard passed.
      fail-fast: false
      matrix:
        # THE LIST IS BOTH THE SHARD VALUES AND THE SHARD COUNT. Selection
        # uses strategy.job-total for the count, so adding a fifth entry here
        # is the whole edit a re-shard needs -- and there is no second number
        # to leave behind, which is the failure that would silently drop a
        # fifth of the tests.
        #
        # The stripes are only as even as the durations allow. Measured
        # 2026-11-15 against the e6cf2185 run, the four shards carry
        # 91s / 90s / 179s / 111s of test time (59 tests, 471s total); shard 3
        # is the long pole because TestPythonComponentExecutionFence alone is
        # 94s of it, and no split of the selector changes that. A fifth shard
        # would move the maximum from 179s to 153s, which is not worth a fifth
        # runner's setup. Re-measure rather than assume if this list changes.
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # Language toolchains
      # ------------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # This shard's slice of E2E_SELECTOR, before the toolchains are paid
      # for: a broken selector should fail in ten seconds, not after four
      # minutes of setup on four runners.
      #
      # THE SPLIT IS DERIVED, NOT LISTED. Four hand-written -run patterns
      # would be four lists someone maintains, and the failure mode is the one
      # the selector comment above has been warning about since 2026-09-03: a
      # test that matches the selector but is named in no shard runs NOWHERE,
      # and every job stays green. `go test -list` prints exactly what the
      # selector matches and (NR-1) % n assigns each name to exactly one
      # shard, so the union IS the selector -- the only way a test can stop
      # running is by leaving E2E_SELECTOR itself, which the placement test
      # and the comment above guard.
      #
      # Both ends of the split are asserted, because neither is visible on a
      # green run: `-run` that matches nothing is a PASS with no --- lines,
      # which is how three tier-2 Rust tests ran nowhere for months. An empty
      # enumeration means the selector is broken; an empty slice means the
      # arithmetic or the matrix is.
      - name: Select this shard's tests
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          if [ "$SHARD" -lt 1 ] || [ "$SHARD" -gt "$SHARDS" ]; then
            echo "matrix.shard=$SHARD is outside 1..$SHARDS" >&2
            exit 1
          fi
          # A build error must fail here and say so, rather than arriving as
          # an empty list below.
          listed=$(go test -list "$E2E_SELECTOR" ./engine/...)
          # LC_ALL=C because every shard has to sort identically: if two
          # runners ordered the list differently, the stripes would differ and
          # tests would be dropped by two shards at once -- silently, the exact
          # failure this step exists to prevent.
          names=$(printf '%s\n' "$listed" \
            | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' \
            | LC_ALL=C sort -u || true)
          total=$(printf '%s\n' "$names" | grep -c . || true)
          total=${total:-0}
          if [ "$total" -eq 0 ]; then
            echo "E2E_SELECTOR matched no tests: the selector is broken, not this shard" >&2
            exit 1
          fi
          mine=$(printf '%s\n' "$names" | awk -v n="$SHARDS" -v s="$SHARD" '(NR - 1) % n == s - 1')
          count=$(printf '%s\n' "$mine" | grep -c . || true)
          count=${count:-0}
          if [ "$count" -eq 0 ]; then
            echo "shard $SHARD of $SHARDS was assigned none of the $total selected tests" >&2
            exit 1
          fi
          {
            echo "pattern=^($(printf '%s\n' "$mine" | paste -sd'|' -))$"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          echo "shard $SHARD/$SHARDS: $count of $total selected tests"
          printf '%s\n' "$mine"

      # Both targets, and wasm32-unknown-unknown is the one that matters:
      # `cleat build --target rust` produces that cdylib (cmd/cleat/build_rust.go),
      # and tests/cross-language now builds the same shape rather than the
      # wasm32-wasip1 artifact it used to, which no user runs.
      #
      # Adding it here was not optional and was initially missed: the suite built
      # and passed locally on a machine that happened to have both targets
      # installed, and failed in CI with `error[E0463]: can't find crate for
      # 'std'`. A local pass on a richer toolchain than the runner's is not
      # evidence the job works.
      #
      # wasm32-wasip1 stays for the SDK crates, which still build against it.
      - name: Setup Rust + wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ------------------------------------------------------------------
      # Python WASM toolchain
      # ------------------------------------------------------------------
      - name: Install Python WASM toolchain
        run: |
          pip install --upgrade pip
          pip install componentize-py

          # The prebuilt release binary, not `cargo install wasm-tools`.
          #
          # Measured on this job (e6cf2185): the step was 111s, almost all of
          # it compiling wasm-tools from source. The release tarball is a
          # download. Same fetch and the same offline digest check as
          # tier1-gate.yml's "Install wasm-tools", including
          # --retry-all-errors and a file rather than a pipe -- see that step
          # for the measurements behind both.
          #
          # PINNED, and 1.263.0 is the version `cargo install wasm-tools`
          # resolved on 2026-11-15. Unpinned, every shard recompiles whatever
          # crates.io served that morning; pinned, a version bump is a
          # reviewable edit and four shards cannot disagree about which
          # toolchain they tested. tier1-gate.yml and
          # scripts/docker/python-toolchain.Dockerfile pin 1.255.0 -- unifying
          # the three sites is a separate change, deliberately not folded in
          # here where it would move the toolchain version of a required check
          # and a shard at the same time.
          #
          # Provenance: verified 2026-11-15 against the SLSA attestation for
          # wasm-tools-1.263.0-x86_64-linux.tar.gz with
          #
          #   gh attestation verify wasm-tools-1.263.0-x86_64-linux.tar.gz \
          #     --repo bytecodealliance/wasm-tools
          #
          # builder .../bytecodealliance/wasm-tools/.github/workflows/publish.yml@refs/heads/main,
          # subject sha256 21c036c1...5431. CI then enforces it offline: a
          # required check has already been failed once by a transient 503
          # from this fetch (tier1-gate.yml records it), and a repeat network
          # call would be a new way to flake.
          curl -sSLf --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz"
          echo "21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431  /tmp/wasm-tools.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo mv /tmp/wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install Python SDK
        working-directory: python-sdk
        run: pip install -e .

      # ------------------------------------------------------------------
      # Run this shard's cross-language E2E tests
      # ------------------------------------------------------------------
      - name: Run cross-language E2E tests
        shell: bash
        env:
          # Through env rather than spliced into the run text, which is this
          # repo's rule for anything derived from the workflow itself.
          SHARD_PATTERN: ${{ steps.shard.outputs.pattern }}
          SHARD_COUNT: ${{ steps.shard.outputs.count }}
        run: |
          # pipefail, for the same reason the step below it already has it:
          # without it `tee` supplies the exit status and a failing `go test`
          # is reported as a green step.
          #
          # That fix was applied to the next step and not this one, and this
          # one was hiding a real failure -- TestPythonWasmEndToEnd had been
          # failing on develop while this workflow reported success. It is the
          # only job that installs componentize-py, so it is the only place
          # that failure could ever have shown up.
          #
          # The status is captured rather than left as the step's, because a
          # check now follows it: without the capture, a failing `go test`
          # would be masked by that check succeeding -- the same shape as the
          # tee defect above, one step later.
          set -o pipefail
          status=0
          go test -count=1 -short=false -timeout=15m \
            -v \
            -run "$SHARD_PATTERN" \
            ./engine/... 2>&1 | tee e2e-report.txt || status=$?
          if [ "$status" -ne 0 ]; then
            # The test failure is the report. Naming a count shortfall here
            # too would blame the split for a test that simply failed.
            exit "$status"
          fi
          # EVERY ASSIGNED TEST RAN. `go test` exits 0 when -run matches
          # nothing, and `=== RUN` is the only line that records a test being
          # entered -- so this is what distinguishes "the shard ran its slice"
          # from "the shard ran, green, and did nothing". A subtests' `=== RUN
          # Parent/sub` line is excluded by the anchor, so the count is
          # top-level tests only, which is what was assigned.
          ran=$(grep -cE '^=== RUN   [A-Za-z0-9_]+$' e2e-report.txt || true)
          ran=${ran:-0}
          if [ "$ran" -ne "$SHARD_COUNT" ]; then
            echo "::error::this shard entered $ran tests but was assigned $SHARD_COUNT" >&2
            exit 1
          fi

      # tests/cross-language was in UNWIRED_SUITES: seven tests covering
      # Rust<->Go cross-replay -- executing under one runtime and replaying the
      # recorded history under the other, plus divergence detection across the
      # boundary. No job referenced it, so none of them had ever run. They pass
      # as written; this job is the only one that installs the toolchain they
      # need.
      #
      # ON ONE SHARD, not all four. It is 15s of tests and its own report feeds
      # the skip budget below, so splitting it would mean four reports and a
      # budget check that covers a quarter of the suite each.
      - name: Run the cross-language suite
        if: matrix.shard == 1
        shell: bash
        # tests/cross-language is its own Go module since the root<->cleat/
        # module cycle was broken (it imports cleat/wasmtest; the root module
        # must not). `go test ./tests/cross-language/...` from the repo root no
        # longer matches -- it fails with "directory prefix tests/cross-language
        # does not contain main module or its selected dependencies" -- so the
        # pattern is ./... from inside the module. See
        # tests/cross-language/go.mod.
        working-directory: tests/cross-language
        run: |
          # pipefail is required: without it `tee` supplies the exit status and
          # a failing `go test` is silently reported as a green step.
          set -o pipefail
          # ../../: the report lands at the repo root, because the Skip budget
          # step below runs scripts/check-skip-budget.sh from there.
          go test -count=1 -short=false -timeout=15m -json \
            ./... 2>&1 | tee ../../cross-language-report.json

      # 0, and the number is the point: every test in that suite needs cargo and
      # the wasm32-wasip1 target, which this job installs above. A skip here
      # means the toolchain setup stopped working and the suite quietly went
      # back to testing nothing.
      #
      # Shard 1 only, because it reads the single report the step above writes.
      # `always()` is unchanged: it runs after a failed test step so the skip
      # budget can still report, and a missing report is itself the failure.
      - name: Skip budget
        if: always() && matrix.shard == 1
        run: scripts/check-skip-budget.sh e2e-cross-language cross-language-report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The shard is in the name because four uploads of one name would
          # collide; the merge-group run's artifacts are read by whoever is
          # working out which shard went red.
          name: e2e-test-report-${{ github.sha }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: e2e-report.txt
          retention-days: 30

  # THE REQUIRED STATUS CONTEXT. `Cross-Language WASM E2E` is in
  # .github/required-checks.txt and tiers.yaml's required_contexts, and a
  # required context is a plain string matched against a check's name.
  #
  # This job exists because of that, not because anything needs summarising. A
  # matrix job reports one check per leg under a DIFFERENT name, so sharding
  # the job above would stop anything reporting "Cross-Language WASM E2E" --
  # and a required context nothing reports blocks every pull request while
  # looking exactly like a check that is merely slow. required-checks.txt's own
  # header describes that failure; scripts/check-workflow-guards.py guard 1
  # fails the Lint job when a context resolves to no job, which is the cheap
  # way to find out. Same shape as tier1-gate.yml's `tier1` job.
  #
  # `if: always()` plus an explicit result check, rather than leaving this job
  # to be skipped when a shard fails: a SKIPPED job does not read as "success",
  # but spelling out the check costs five lines and removes any reliance on
  # GitHub's semantics for a required check -- which is the assumption the
  # `tier1` job's comment refuses to make for the same reason.
  e2e-cross-language-summary:
    name: Cross-Language WASM E2E
    needs: [e2e-cross-language]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        env:
          SHARDS_RESULT: ${{ needs.e2e-cross-language.result }}
        run: |
          echo "e2e-cross-language (all shards): $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::Cross-Language WASM E2E: at least one shard did not succeed" >&2
            exit 1
          fi
