# ---------------------------------------------------------------------------
# Cross-Language End-to-End WASM Tests
#
# Workstream 2 — Cross-cutting CI (Task C2)
#
# Compiles workflow examples in Rust, Python, AssemblyScript, and Java to
# WASM, then runs them through the Go host runtime to verify the full
# compilation-to-execution pipeline for each non-Go language.
#
# Key design decisions:
#   - Rust and Python are first-class: build/execute failures block the CI.
#   - AssemblyScript and Java are best-effort: their Go tests skip gracefully
#     when the toolchain is unavailable or execution fails.
#   - Each Go test handles its own WASM compilation; the CI only provides
#     the toolchains and dependencies, avoiding redundant double-builds.
# ---------------------------------------------------------------------------
name: Cross-Language E2E

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

  # Declares the "first-class" policy above to the tests themselves.
  #
  # engine/rust_workflow_test.go and engine/python_wasm_e2e_test.go need to
  # tell "nobody asked for this toolchain" (a developer's laptop, or ci.yml's
  # engine matrix entry, whose Setup Rust step is gated to the internal
  # package) from "the job that promised this toolchain cannot find it". The
  # first is a skip; the second is a silently-failed setup step and must be a
  # failure.
  #
  # This is an explicit variable rather than a check on $GITHUB_WORKFLOW
  # because that would match on this workflow's display `name:` field.
  # Renaming a workflow is a cosmetic edit that nobody would expect to change
  # test behaviour, and it would silently return both files to skipping --
  # which is exactly how DURABLE_TEST_DB was renamed with nothing noticing
  # (IMPROVEMENT-PLAN.md 2.9). A CLEAT_REQUIRE_* variable reads as
  # load-bearing and greps to its consumers.
  CLEAT_REQUIRE_TOOLCHAINS: "rust,python"

permissions:
  contents: read

jobs:
  e2e-cross-language:
    name: Cross-Language WASM E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Language toolchains
      # ------------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Both targets, and wasm32-unknown-unknown is the one that matters:
      # `cleat build --target rust` produces that cdylib (cmd/cleat/build_rust.go),
      # and tests/cross-language now builds the same shape rather than the
      # wasm32-wasip1 artifact it used to, which no user runs.
      #
      # Adding it here was not optional and was initially missed: the suite built
      # and passed locally on a machine that happened to have both targets
      # installed, and failed in CI with `error[E0463]: can't find crate for
      # 'std'`. A local pass on a richer toolchain than the runner's is not
      # evidence the job works.
      #
      # wasm32-wasip1 stays for the SDK crates, which still build against it.
      - name: Setup Rust + wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ------------------------------------------------------------------
      # Python WASM toolchain
      # ------------------------------------------------------------------
      - name: Install Python WASM toolchain
        run: |
          pip install --upgrade pip
          pip install componentize-py
          cargo install wasm-tools

      - name: Install Python SDK
        working-directory: python-sdk
        run: pip install -e .

      # ------------------------------------------------------------------
      # Run cross-language E2E tests
      #
      # -short=false overrides any default -short so WASM integration tests
      #   are not skipped; -count=1 bypasses Go's test cache.
      # The -run regex matches only cross-language E2E tests.
      # ------------------------------------------------------------------
      - name: Run cross-language E2E tests
        run: |
          go test -count=1 -short=false -timeout=10m \
            -v \
            -run "TestRust|TestPython|TestAssemblyScript|TestJava" \
            ./engine/... 2>&1 | tee e2e-report.txt

      # tests/cross-language was in UNWIRED_SUITES: seven tests covering
      # Rust<->Go cross-replay -- executing under one runtime and replaying the
      # recorded history under the other, plus divergence detection across the
      # boundary. No job referenced it, so none of them had ever run. They pass
      # as written; this job is the only one that installs the toolchain they
      # need.
      - name: Run the cross-language suite
        shell: bash
        run: |
          # pipefail is required: without it `tee` supplies the exit status and
          # a failing `go test` is silently reported as a green step.
          set -o pipefail
          go test -count=1 -short=false -timeout=10m -json \
            ./tests/cross-language/... 2>&1 | tee cross-language-report.json

      # 0, and the number is the point: every test in that suite needs cargo and
      # the wasm32-wasip1 target, which this job installs above. A skip here
      # means the toolchain setup stopped working and the suite quietly went
      # back to testing nothing.
      - name: Skip budget
        if: always()
        run: scripts/check-skip-budget.sh e2e-cross-language cross-language-report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-${{ github.sha }}
          path: e2e-report.txt
          retention-days: 30
