# ---------------------------------------------------------------------------
# DCO Check — verifies every commit includes a Signed-off-by line
#
# Workstream 2 — Continuous Integration and Delivery
#
# The Developer Certificate of Origin (DCO) confirms the contributor has the
# right to submit the contribution under the project's license. Every commit
# must include a "Signed-off-by:" trailer, added automatically with:
#
#   git commit --signoff
#
# or, once and for all, by installing the repo's hooks:
#
#   git config core.hooksPath .githooks
#
# To fix commits that are missing the trailer:
#   git commit --amend --signoff              (latest commit)
#   git rebase --signoff HEAD~N               (last N commits)
#
# ---------------------------------------------------------------------------
# Until 2026-08-07 this job printed a warning and exited 0 on unsigned
# commits, so it could not fail:
#
#   if [ -n "$FAILING" ]; then echo "...WARNING..."; fi   # no exit 1
#   if [ -z "$FAILING" ]; then echo "passed"; fi          # returns 0 either way
#
# It was a *required* status check on develop the whole time, with 37 successes
# and no failure in its recorded history, while 95 of the last 100 non-merge
# commits on develop carried no Signed-off-by at all. Re-derive both numbers:
#
#   gh run list --workflow=dco-check.yml --limit 40 --json conclusion \
#     --jq '.[].conclusion' | sort | uniq -c
#   git log --no-merges -100 --format=%H develop | while read -r c; do \
#     [ -z "$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c")" ] \
#       && echo "$c"; done | wc -l
#
# The only five signed commits in that window were dependabot's — the one
# author the CLA check was rejecting.
#
# This job now exits 1. It reads only the commits the pull request adds
# (base..head), so nothing behind us is re-litigated; the 95 stay as they are.
#
# It also stops asking the wrong question. See the trailer note on the check
# itself: the old predicate grepped the whole message for the substring, so a
# commit that merely mentions "Signed-off-by:" satisfied it.
# ---------------------------------------------------------------------------
name: DCO Check

# pull_request only. The push trigger this job used to carry re-checked the
# squash commit *after* it had already landed on develop, which is both
# un-actionable (there is no branch left to amend) and redundant: the repo
# squashes with squash_merge_commit_message=COMMIT_MESSAGES, so the trailers
# from the branch commits are carried into the squash body verbatim. That is
# not an assumption — dependabot's five signed PRs are on develop as five
# signed squash commits. Re-derive with:
#
#   gh api repos/cleat-team/cleat --jq .squash_merge_commit_message
#
# The push trigger also had a latent bug: it used github.event.before as the
# base, which is all-zeros on a branch's first push and would have made
# `git log 000..HEAD` fail rather than report anything useful.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reduced from `pull-requests: write`, which this job never used — it posts
# no comment and sets no label. It reads git history and nothing else.
permissions:
  contents: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history: base..head is not reachable from a shallow clone.
          fetch-depth: 0

      - name: Check DCO
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # pipefail matters here. Without it, a `git log` that fails on a bad
          # range yields an empty FAILING, which reads as "every commit is
          # signed" — a green that measured nothing, which is the exact failure
          # mode this job spent its whole life in.
          set -euo pipefail

          # Already-released history is not this PR's contribution to certify.
          #
          # gitflow cuts hotfix/* from main, and that branch then has to merge
          # back into develop. Its base..head range therefore replays every
          # commit main carries that develop does not — including 467a689, a
          # pre-convention commit with no trailer that predates this job having
          # teeth. Without this skip the first hotfix back-merge fails DCO on a
          # commit nobody in the PR wrote, and there is no branch left to amend.
          #
          # This is the same grandfathering the job already intends one line
          # down ("nothing behind us is re-litigated"); base..head alone only
          # achieves it while history is a straight line. Re-derive the case:
          #
          #   git log --no-merges --format='%H %s' origin/develop..origin/main
          #   git show -s --format='%(trailers:key=Signed-off-by,valueonly)' 467a689
          #
          # It is not a hole. A commit reaches main only through a PR from
          # develop or a release branch, and those are checked here on the way
          # in. Exempting what main already carries exempts what was already
          # certified — not what is arriving now.
          git fetch --no-tags --quiet origin main
          RELEASED=$(git rev-parse FETCH_HEAD)

          # %(trailers:...) rather than `grep -q "Signed-off-by:"` over %B.
          #
          # The grep matched the string anywhere in the message, including
          # inside prose or a fenced command. The commit that introduced this
          # job's exit 1 quotes the old one-liner in its own body, so it
          # contains the text "Signed-off-by:" while carrying no trailer at
          # all — under the old predicate it certifies itself by talking about
          # certification. git's trailer parser reads only the trailer block,
          # which is the thing the DCO is actually about.
          FAILING=$(git log --no-merges "${BASE}..${HEAD}" --format="%H" | while read -r commit; do
            if git merge-base --is-ancestor "$commit" "$RELEASED"; then
              continue
            fi
            if [ -z "$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")" ]; then
              echo "  $(git log -1 --format='%h %s' "$commit")"
            fi
          done)

          if [ -n "$FAILING" ]; then
            echo "============================================"
            echo "  DCO CHECK — FAILED"
            echo "============================================"
            echo ""
            echo "The following commits are missing Signed-off-by:"
            echo "$FAILING"
            echo ""
            echo "To fix:"
            echo "  git commit --amend --signoff        # fix the latest commit"
            echo "  git rebase --signoff HEAD~N          # fix the last N commits"
            echo "  git push --force-with-lease          # push the fix"
            echo ""
            echo "To stop having to remember:"
            echo "  git config core.hooksPath .githooks  # once, per clone"
            echo ""
            echo "For details: https://developercertificate.org/"
            exit 1
          fi

          echo "All commits have Signed-off-by. DCO check passed."
