# ---------------------------------------------------------------------------
# Branch Naming Check — validates PR source branches follow gitflow convention
#
# Expected prefixes: feature/, bugfix/, fix/, docs/, release/, hotfix/
# Examples: feature/multi-db-support, bugfix/claim-race, release/v1.2.0
#
# Exemptions: branches opened by dependabot, or PRs labeled "bot"
# ---------------------------------------------------------------------------
name: Branch Naming Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # The merge queue tests the required checks against the PROJECTED tip on a
  # temporary `gh-readonly-queue/...` ref, which fires `merge_group` and not
  # `pull_request`. Without this trigger the check never starts in queue
  # context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES -- with no check going red. There are 32 required contexts on
  # develop and every one of them has to report here.
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      # In the merge queue this check is both impossible and pointless.
      #
      # Impossible - a merge_group event carries no pull_request payload, so
      # every `github.event.pull_request.*` reference below is null.
      #
      # Pointless - whatever it would examine was examined on the pull request
      # and cannot change between there and here.
      #
      # It REPORTS rather than being skipped. A skipped job satisfies a
      # required check, but a job that fails to start does not, and the queue
      # cannot tell that from a check which has not finished yet - so it waits
      # forever and nothing merges. With 32 required contexts on develop that
      # is 32 chances to deadlock the repository silently.
      - name: Already checked on the pull request
        if: github.event_name == 'merge_group'
        run: echo "validated when the pull request was opened"
      - name: Check branch naming convention
        if: github.event_name != 'merge_group'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;
            const labels = context.payload.pull_request.labels.map(l => l.name);

            // Exempt bot PRs
            if (author === 'dependabot[bot]' || labels.includes('bot')) {
              console.log(`Exempt: ${author} (bot PR)`);
              return;
            }

            // Exempt main, master, develop (permanent branches)
            if (branch === 'main' || branch === 'master' || branch === 'develop') {
              console.log('Branch is main/master/develop — skipping check.');
              return;
            }

            const validPrefixes = ['feature/', 'bugfix/', 'fix/', 'docs/', 'release/', 'hotfix/'];
            const isValid = validPrefixes.some(p => branch.startsWith(p));

            if (!isValid) {
              core.setFailed(
                `BRANCH NAME: ${branch}\n\n` +
                `Branch names must follow the gitflow convention with one of these prefixes:\n\n` +
                `  feature/   — new functionality      (e.g. feature/multi-db-support)\n` +
                `  bugfix/    — bug fixes               (e.g. bugfix/claim-race-condition)\n` +
                `  fix/       — CI, config, tooling fixes (e.g. fix/ci-token)\n` +
                `  docs/      — documentation only      (e.g. docs/branch-conventions)\n` +
                `  release/   — release preparation     (e.g. release/v1.2.0)\n` +
                `  hotfix/    — critical production fix (e.g. hotfix/worker-panic)\n\n` +
                `Use lowercase, hyphens (not underscores), and keep names concise.\n\n` +
                `To rename your branch:\n` +
                `  git branch -m ${branch} feature/descriptive-name\n` +
                `  git push origin feature/descriptive-name\n` +
                `  git push origin --delete ${branch}\n\n` +
                `See CONTRIBUTING.md#branch-naming for the full convention.`
              );
              // core.setFailed does not stop execution; without this return the
              // job logs the rejection and then claims the name is fine.
              return;
            }

            console.log(`Branch name "${branch}" follows convention.`);
