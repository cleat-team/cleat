name: Plugin Harness Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Layer 1 — cleattest-based SDK tests (fast, no infra needed)
  # --------------------------------------------------------------------------
  test-layer1:
    name: Layer 1 — SDK (cleattest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check tools
        run: make tools-go
      - run: go test -count=1 -timeout=120s ./tests/plugin-harness/... -run 'TestPluginCalls_Cleattest|TestNewTestPluginEnvInMemory|TestMockServers'
        env:
          CGO_ENABLED: "0"

  # --------------------------------------------------------------------------
  # Layer 2 — WASM integration (compiled Go workflow via standard Go wasip1)
  # --------------------------------------------------------------------------
  test-layer2:
    name: Layer 2 — WASM Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 -timeout=300s ./tests/plugin-harness/... -run 'TestPluginCalls_Wasm'
        env:
          CGO_ENABLED: "0"

  # --------------------------------------------------------------------------
  # Layer 3 — Multi-DB (real databases, standard Go wasip1 workflow)
  # --------------------------------------------------------------------------
  test-multi-db:
    name: Layer 3 — Multi-DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cleat
          MYSQL_DATABASE: cleat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pcleat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CleatTest123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CleatTest123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEAT_TEST_POSTGRES: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_MYSQL: root:cleat@tcp(127.0.0.1:3306)/cleat?tls=false&parseTime=true
      CLEAT_TEST_MSSQL: sqlserver://sa:CleatTest123!@localhost:1433?database=master
      CLEAT_TEST_SKIP_REAL_SERVICES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 -timeout=600s ./tests/plugin-harness/... -run 'TestPluginCalls_MultiDB'
        env:
          CGO_ENABLED: "0"

  # --------------------------------------------------------------------------
  # Blobstore S3 round-trip (MinIO)
  # --------------------------------------------------------------------------
  test-blobstore-s3:
    name: Blobstore S3 Round-Trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data
    env:
      CLEAT_TEST_POSTGRES: postgres://cleat:cleat@127.0.0.1:5432/cleat?sslmode=disable
      CLEAT_TEST_S3_ENDPOINT: http://localhost:9000
      CLEAT_TEST_S3_ACCESS_KEY: minioadmin
      CLEAT_TEST_S3_SECRET_KEY: minioadmin
      CLEAT_TEST_S3_BUCKET: cleat-test-harness
      CLEAT_TEST_S3_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 -timeout=120s -v ./tests/plugin-harness/... -run 'TestBlobstore_S3'
        env:
          CGO_ENABLED: "0"
