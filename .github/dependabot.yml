# Dependency updates.
#
# THIS FILE IS THE ONLY ONE THAT RUNS. `renovate.json` sat beside it
# configuring Renovate, which has never opened a pull request in this
# repository -- 0 ever, against 29 from Dependabot:
#
#   gh api "search/issues?q=repo:cleat-team/cleat+is:pr+author:app/renovate" --jq .total_count
#   gh api "search/issues?q=repo:cleat-team/cleat+is:pr+author:app/dependabot" --jq .total_count
#
# It has been deleted rather than left in place. A well-formed config that
# nothing reads is worse than no config: it is a plausible answer to "how are
# dependencies managed here", and it survived an internal review that read it
# as live (cleat#1321).
#
# WHAT THIS CHANGES. Before it, `github-actions` was the only ecosystem with a
# schedule. Every Go module, every npm package and every crate got updates only
# when a Dependabot SECURITY alert fired -- which needs an advisory to exist, to
# be in GitHub's database, and to match the pinned version's range. Routine
# patch releases, including ones that fix a problem before an advisory is
# published, arrived never. That is how #1033 (grpc) and #1064 (vitest) are the
# only non-Actions dependency PRs in the repository's history: both are security
# updates, and both landed in directories this file did not cover.
#
# SCOPE. The directories below are the ones that ship. Deliberately excluded:
# examples/, testdata/, tests/ and benchmarks/ -- fixtures pinned on purpose,
# where a version bump is churn rather than a release. Security updates still
# reach them regardless of this file, which is exactly how #1033 arrived in
# tests/cross-language.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "area/ci"
      - "dependencies"

  # Go modules. The main module is where wasmtime lives, which is the
  # dependency this repository most needs a schedule for: it is a large C
  # library on the sandbox boundary, so a patch release is a security event
  # rather than a chore.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/cleat"
      - "/cleat/backendkit"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 10
    groups:
      # wasmtime is deliberately NOT grouped with everything else. Burying it in
      # a twenty-module batch is how its advisory cadence stops being visible,
      # which is the complaint in cleat#1321.
      wasmtime:
        patterns:
          - "github.com/bytecodealliance/wasmtime-go*"
      go-minor-and-patch:
        exclude-patterns:
          - "github.com/bytecodealliance/wasmtime-go*"
        update-types:
          - "minor"
          - "patch"

  # The admin dashboard and the AssemblyScript SDK.
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/packages/cleat-as"
      - "/packages/cleat-as/transform"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is held, not skipped. No svelte-check release supports it:
      # 4.7.6 (latest) declares `typescript: "^5.0.0 || ^6.0.0"`, and `npm run
      # check` under TS 7 dies inside svelte-check's own bundle with
      # `Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')`
      # before checking a single file. cleat#1357 sat red for that reason and
      # could not have gone green at any point.
      #
      # REMOVE THIS when svelte-check's peerDependencies admit ^7.0.0:
      #   npm view svelte-check@latest peerDependencies.typescript
      # Nothing else needs to change; the group below will then carry TS 7 up
      # together with the svelte-check that accepts it.
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      # The web toolchain moves as a set or not at all. typescript,
      # svelte-check, vitest, jsdom and undici are one dependency graph, and
      # proposing corners of it individually produces PRs that cannot go green
      # at any point in the future rather than PRs that are merely behind:
      # cleat#1359 (jsdom 25->30) failed on `webidl.util.markAsUncloneable is
      # not a function`, which is jsdom 30 + undici 8 under vitest 4, and was
      # fixed by the vitest 5 bump that was sitting in a separate PR. cleat#1709.
      #
      # This group is FIRST on purpose. Dependabot places a dependency in the
      # first group whose patterns match, and npm-minor-and-patch below has no
      # `patterns` key, so it matches everything -- listing it first would
      # swallow the minor and patch updates of these packages and split the set
      # again by update-type instead of by name.
      web-toolchain:
        patterns:
          - "typescript"
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "@tsconfig/svelte"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "undici"
          - "@testing-library/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Rust SDK crates.
  - package-ecosystem: "cargo"
    directories:
      - "/crates/cleat-sdk"
      - "/crates/cleat-macro"
      - "/crates/cleat-test"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Python SDK.
  - package-ecosystem: "pip"
    directory: "/python-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
