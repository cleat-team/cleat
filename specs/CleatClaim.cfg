CONSTANTS
    Workers = {w1, w2}
    NumInstances = 2
    HeartbeatInterval = 1
    HeartbeatTimeout = 2
    MaxClaimBatch = 1
    NULL = NULL

\* cleat#2041: the instances the engine's `priority ASC` sorts ahead of the
\* rest. {} means every instance has equal priority; {2} models instance 2
\* having been started at a higher priority than the older instance 1, which is
\* the shape the engine test measures.
    HighPriorityInstances = {}

INVARIANTS
    TypeOK
    Safety

\* ClaimRespectsOrder IS GATED. It pins the claim order -- a claim takes a
\* prefix of `Precedes`, so nothing is ever overtaken -- is a safety property
\* checked during ordinary reachability rather than by the liveness engine, and
\* depends on nothing outside the model. It fails if `Claim` is reverted to an
\* arbitrary SUBSET of ReadyInstances, which is the defect this issue is about;
\* that was verified by doing exactly that. See its own comment in the .tla.
\*
\* NoStarvation is DEFINED BUT NOT GATED, and the reason is NOT the one that
\* first left it out. The disjunctive-fairness counter-example is fixed. It is
\* still ungated because (1) it passes through the unclamped clock rather than
\* through the claim protocol -- with the clamp restored it FAILS at 3,349
\* distinct states -- and (2) the starvation the engine actually has, a run
\* passed over indefinitely by SUSTAINED higher-priority arrivals, is not
\* representable at any finite NumInstances. A property that holds only while a
\* particular clock arithmetic is in force is not one to ship as checked. Both
\* reasons are spelled out on the definition in the .tla. Tracked as cleat#2041.
PROPERTIES
    ClaimProgress
    ClaimRespectsOrder
    ReapProgress
    TerminalStableLiveness

