CONSTANTS
    Workers = {w1, w2}
    NumInstances = 2
    HeartbeatInterval = 1
    HeartbeatTimeout = 2
    MaxClaimBatch = 1
    NULL = NULL

INVARIANTS
    TypeOK
    Safety

\* NoStarvation is defined in the .tla but deliberately NOT gated here --
\* see its "NOT GATED IN CleatClaim.cfg" comment above the definition for
\* the concrete, no-mutation-needed counter-example (a sole surviving
\* worker can nondeterministically always pick the same ready instance to
\* claim, satisfying SF_vars(Claim(w)) while a sibling instance starves
\* forever) that stopped it being shipped as checked. specs/CleatRunLifecycle.tla
\* leaves its analogous L1/L2/L3 ungated for the same reason.
PROPERTIES
    ClaimProgress
    ReapProgress
    TerminalStableLiveness

